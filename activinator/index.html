<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Activinator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Activinator">
<meta name="description" content="A deck of things to actually go and do. Swipe the ones you fancy; it works out what you are like.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/deck.css">
<link rel="stylesheet" href="css/panels.css">
</head>
<body>
<div id="frame">
  <main id="deck"></main>
  <!-- One button in each corner of a full-screen card, so none of them is ever
       in the way of the middle of it: where you go and what you look for along
       the top, what you make and what you take back along the bottom. -->
  <nav class="dock">
    <button class="menu" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="browse" data-act="browse" aria-label="All activities"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <button class="undo" data-act="undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7H6.5A4.5 4.5 0 1 0 6.5 16H12"/><path d="M12 4L8.5 7L12 10"/></svg></button>
    <button class="add" data-act="add" aria-label="Write your own"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </nav>
</div>
<div id="panelhost"></div>
<div id="toast"></div>
<script type="module" src="js/boot.js"></script>
</body>
</html>
