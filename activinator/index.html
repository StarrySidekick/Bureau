<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Activinator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Activinator">
<meta name="description" content="A deck of things to actually go and do. Swipe the ones you fancy; it works out what you are like.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/deck.css">
<link rel="stylesheet" href="css/panels.css">
</head>
<body>
<div id="frame">
  <header id="top">
    <button class="ctxbtn" data-act="ctx"><span id="ctxline">Anyone · Anywhere · Any length</span></button>
    <div class="topr">
      <button class="chip" data-act="list">List<em id="listn"></em></button>
      <button class="chip" data-act="taste">Taste</button>
    </div>
  </header>
  <main id="deck"></main>
  <footer id="acts">
    <button class="act undo" data-act="undo" title="Take that back">Undo</button>
    <button class="act no"  data-act="no"  title="Not for me">Pass</button>
    <button class="act now" data-act="now" title="Doing it now">Now</button>
    <button class="act yes" data-act="yes" title="Yes, put it on the list">Yes</button>
  </footer>
</div>
<div id="panelhost"></div>
<div id="toast"></div>
<script type="module" src="js/boot.js"></script>
</body>
</html>
