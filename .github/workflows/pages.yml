# Publishes web/ to GitHub Pages on every push to main, with activinator/
# alongside it at /activinator/.
# The app lives in web/, and Pages' branch mode only serves the repo root or
# docs/ — docs/ is the written documentation, so we deploy an artifact instead.
#
# Activinator is a separate app that happens to live in this repository. It is
# served from a path inside Bureau's service worker scope, which is why that
# worker skips /activinator/ — see the guard in web/sw.js.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r activinator _site/activinator
          rm -rf _site/activinator/test _site/activinator/scripts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
