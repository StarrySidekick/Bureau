<!doctype html>
<!-- Activinator lives in its own repository now, served at /activinator/.
     This stub holds its old address so a phone that installed it from here
     finds its way over. Saved state needs no forwarding: localStorage belongs
     to the origin, and the origin is the same. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activinator has moved</title>
  <meta http-equiv="refresh" content="0; url=https://starrysidekick.github.io/activinator/">
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#14151c; color:#f2efe6; font:17px/1.5 Georgia, serif; text-align:center; }
    a { color:#f2efe6; }
  </style>
</head>
<body>
  <p>Activinator has moved.<br><a href="https://starrysidekick.github.io/activinator/">Take me there</a></p>
  <script>location.replace('https://starrysidekick.github.io/activinator/');</script>
</body>
</html>
