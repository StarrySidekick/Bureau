   19 · gestures: swipe + drag reorder
   ============================================================ */
let G=null;
let holdTimer=null, holdFrom=null;
// any real movement, or letting go, means it was not a press-and-hold
function cancelHold(e){
  if(!holdTimer) return;
  if(e && holdFrom && Math.abs(e.clientX-holdFrom.x)<6 && Math.abs(e.clientY-holdFrom.y)<6) return;
  clearTimeout(holdTimer); holdTimer=null;
}

/* Width of one grid column in px, measured rather than assumed — the grid is
   fluid (repeat(cols,1fr)) so this changes with the window and the rail. */
function cellW(grid,g){
  const r=grid.getBoundingClientRect();
  return (r.width - g.gap*(g.cols-1))/g.cols;
}
/* Where a move/resize would land, in grid cells. Dragging an edge moves that
   edge only; dragging a corner moves both of its edges — same as a window. */
function candidate(g, cx, cy){
  const b=g.box, hd=g.handle;
  if(g.type==='move') return {x:b.x+cx, y:b.y+cy, w:b.w, h:b.h};
  let x=b.x, y=b.y, w=b.w, h=b.h;
  if(hd.includes('e')) w=b.w+cx;
  if(hd.includes('w')){ x=b.x+cx; w=b.w-cx; }
  if(hd.includes('s')) h=b.h+cy;
  if(hd.includes('n')){ y=b.y+cy; h=b.h-cy; }
  if(w<1){ if(hd.includes('w')) x=b.x+b.w-1; w=1; }   // never invert the box
  if(h<1){ if(hd.includes('n')) y=b.y+b.h-1; h=1; }
  return {x,y,w,h};
}
function place(el, b){
  el.style.gridColumn=`${b.x} / span ${b.w}`;
  el.style.gridRow=`${b.y} / span ${b.h}`;
}

function onDown(e){
  if(e.button===2) return;
  const app=$('#app');
  // any tile on a grid, container or not — they all move and resize the same
  // any tile on a grid, whatever it is — controls carry data-id, not data-row
  const dEl=e.target.closest('.grid .drawer[data-drawer],.grid .drawer[data-row],.grid .drawer[data-id]');
  if(S.arrange && dEl && !e.target.closest('.sizebtns')){
    const grid=dEl.closest('.grid');
    const d=byId(dEl.dataset.drawer||dEl.dataset.row||dEl.dataset.id);
    if(!d || !grid) return;
    const hEl=e.target.closest('[data-rz]'), g=gridOf();
    G={type: hEl?'resize':'move', el:dEl, id:d.id, handle:hEl?hEl.dataset.rz:null,
       parent:grid.dataset.gridfor||ROOT,
       box:lay(d), stepX:cellW(grid,g)+g.gap, stepY:g.rowh+g.gap,
       sx:e.clientX, sy:e.clientY, mode:null, ok:true, cand:null};
    dEl.setPointerCapture&&dEl.setPointerCapture(e.pointerId);
    return;
  }
  // Press and hold a tile to start arranging, the way a home screen does.
  if(!S.arrange && dEl){
    clearTimeout(holdTimer);
    holdTimer=setTimeout(()=>{
      holdTimer=null;
      S.arrange=true; S.sel=[]; render();
      if(navigator.vibrate) navigator.vibrate(8);
      toast('Arranging — drag to move, drag an edge to resize');
    }, 420);
    holdFrom={x:e.clientX,y:e.clientY};
  }
  const rEl=e.target.closest('.row[data-row]');
  if(!rEl) return;
  if(e.target.closest('[data-check],[data-del],[data-menu],[data-habit]')) return;
  const list=rEl.closest('.rows');
  const canDrag = e.pointerType==='mouse' || (list&&list.classList.contains('reordering'));
  G={type:'row', el:rEl, wrap:rEl.parentElement, sx:e.clientX, sy:e.clientY, mode:null, canDrag, t:Date.now()};
  rEl.setPointerCapture&&rEl.setPointerCapture(e.pointerId);
}
function onMove(e){
  cancelHold(e);
  if(!G) return;
  const dx=e.clientX-G.sx, dy=e.clientY-G.sy;

  if(G.type==='move' || G.type==='resize'){
    if(!G.mode){
      if(Math.abs(dx)<5 && Math.abs(dy)<5) return;
      G.mode='grid';
      G.el.classList.add('dragging');
      if(G.type==='move'){
        G.ghost=document.createElement('div');
        G.ghost.className='ghost';
        place(G.ghost, G.box);
        G.el.parentElement.appendChild(G.ghost);
      }
    }
    const box=candidate(G, Math.round(dx/G.stepX), Math.round(dy/G.stepY));
    G.cand=box; G.ok=boxOk(box, G.id, dev(), G.parent);
    G.el.classList.toggle('invalid', !G.ok);
    if(G.type==='move'){
      G.el.style.transform=`translate(${dx}px,${dy}px)`;
      G.ghost.className='ghost'+(G.ok?'':' bad');
      place(G.ghost, box);
    } else {
      place(G.el, box);            // live resize, like dragging a window edge
    }
    return;
  }

  if(!G.mode){
    if(Math.abs(dx)<7 && Math.abs(dy)<7) return;
    if(Math.abs(dx)>Math.abs(dy)){ G.mode='swipe'; G.wrap.classList.add('swiping'); }
    else if(G.canDrag){ G.mode='drag'; G.wrap.classList.add('dragging'); G.wrap.style.opacity='.35'; G.wrap.style.pointerEvents='none'; }
    else { G.mode='none'; }
  }
  if(G.mode==='swipe'){ G.el.style.transform=`translateX(${clamp(dx,-140,140)}px)`; }
  else if(G.mode==='drag'){
    const under=document.elementFromPoint(e.clientX,e.clientY);
    if(!under) return;
    const t=under.closest('.rowwrap');
    if(t&&t!==G.wrap){ const p=t.parentElement, before=t.compareDocumentPosition(G.wrap)&Node.DOCUMENT_POSITION_FOLLOWING;
      p.insertBefore(G.wrap, before? t : t.nextSibling); }
  }
}
function onUp(e){
  if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
  if(!G) return;
  const g=G; G=null;
  const dx=e.clientX-g.sx;

  if(g.mode==='grid'){
    g.el.classList.remove('dragging','invalid');
    g.el.style.transform='';
    if(g.ghost) g.ghost.remove();
    const d=byId(g.id);
    if(d && g.cand && g.ok) d[dev()]={...g.cand};
    save(); render();
    if(d && g.cand && !g.ok) toast('No room there');
    return;
  }

  if(g.mode==='swipe'){
    g.wrap.classList.remove('swiping');
    const id=g.el.dataset.row;
    if(dx<-72){ g.el.style.transform='translateX(-100%)'; setTimeout(()=>del(id),140); return; }
    if(dx>72){ g.el.style.transform='translateX(100%)'; setTimeout(()=>toggleDone(id),140); return; }
    g.el.style.transform='';
    return;
  }
  if(g.mode==='drag'){
    g.wrap.classList.remove('dragging'); g.wrap.style.opacity=''; g.wrap.style.pointerEvents='';
    const list=g.wrap.parentElement;
    $$('[data-wrap]',list).forEach((el,i)=>{ const o=byId(el.dataset.wrap); if(o) o.ord=i; });
    toast('Order saved');
    render(); return;
  }
  if(g.mode===null && Math.abs(dx)<7){
    // a tap
    if(g.type==='move'||g.type==='resize'){ const o=byId(g.id); if(S.arrange&&o) isContainer(o)?modalDrawer(g.id):openObj(g.id); }
    else if(g.type==='row') openObj(g.el.dataset.row);
  }
}


/* ============================================================
   19b · persistence — everything stays on this device
   ============================================================ */
const APP_VERSION = '1.0';
const KEY = 'bureau.v1';
let deferredInstall = null;
let saveTimer = null;

function snapshot(){
  // image bytes live in IndexedDB — keep them out of the JSON
  const objects = S.objects.map(o=>{
    if(!o.media || !o.media.src) return o;
    const m=Object.assign({},o.media); delete m.src;
    return Object.assign({},o,{media:m});
  });
  return {v:5, savedAt:new Date().toISOString(), theme:S.theme, listmode:S.listmode,
          look:S.look, kinds:S.kinds, objects};
}
function writeNow(){
  try{ localStorage.setItem(KEY, JSON.stringify(snapshot())); }
  catch(e){ console.warn('Bureau could not save:', e.message); }
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(writeNow, 250); }
function storeSize(){ try{ return (localStorage.getItem(KEY)||'').length; }catch(e){ return 0; } }

/* v1 → v2: drawers carried only {w,h} and were laid out by flow order. Replay
   that same dense flow once to give every drawer real x/y coordinates, so an
   existing desk comes back looking exactly as its owner left it. */
function flowToCoords(drawers, device){
  const g=GRID[device], taken=[];
  const free=(box)=> box.x+box.w-1<=g.cols && !taken.some(t=>overlaps(box,t));
  drawers.forEach(d=>{
    const b=d[device]||{}, w=clamp(b.w||2,1,g.cols), h=clamp(b.h||1,1,40);
    if(b.x&&b.y){ taken.push({x:b.x,y:b.y,w,h}); d[device]={x:b.x,y:b.y,w,h}; return; }
    let placed=null;
    for(let y=1;y<400&&!placed;y++) for(let x=1;x<=g.cols-w+1;x++){
      const box={x,y,w,h};
      if(free(box)){ placed=box; break; }
    }
    placed=placed||{x:1,y:1,w,h};
    taken.push(placed); d[device]=placed;
  });
}
/* v2 → v3: drawers and objects were two arrays and a drawer could not live
   inside anything. Fold the drawers into the object list as kind 'drawer', and
   turn each object's `drawer` pointer into a `parent`. Ids are preserved, so
   anything that referenced an object by id still resolves. */
function foldDrawers(d){
  const drawers=(d.drawers||[]).map(x=>Object.assign({
    kind:'drawer', parent:ROOT, layout:'list', tags:[], body:'', ord:0,
    filter:{}, pv:'list'
  }, x, {title: x.title || x.nm || 'Untitled'}));
  drawers.forEach(x=>{ delete x.nm; });
  flowToCoords(drawers,'desk');
  flowToCoords(drawers,'phone');
  const known=new Set(drawers.map(x=>x.id));
  const objects=(d.objects||[]).map(o=>{
    const n=Object.assign({tags:[],history:[],milestones:[],ord:0,desk:null,phone:null},o);
    n.parent = (o.parent && (known.has(o.parent)||o.parent===ROOT)) ? o.parent
             : (known.has(o.drawer) ? o.drawer : ROOT);
    delete n.drawer;
    return n;
  });
  return drawers.concat(objects);
}
/* v3 → v4: the grid went from 6 columns of 104px rows to 12 square columns, so
   every cell is half the width it was. Doubling each box keeps a desk looking
   the way it was arranged — a tile twice as wide as tall stays twice as wide
   as tall — which matters more than matching the old pixel height exactly. */
function doubleBoxes(objects){
  objects.forEach(o=>['desk','phone'].forEach(dv=>{
    const b=o[dv]; if(!b || !b.w) return;
    o[dv]={x:(b.x-1)*2+1, y:(b.y-1)*2+1, w:b.w*2, h:b.h*2};
  }));
}
/* New, Arrange and Settings are objects on the desk now, so a desk saved before
   they existed would have no way to reach them. Put back any that are missing —
   this also rescues a desk where one was deleted by accident. */
function ensureControls(){
  // New and Arrange became gestures, so retire their buttons from older desks
  S.objects = S.objects.filter(o=>!(o.ctl==='new'||o.ctl==='arrange'));
  if(!S.objects.some(o=>o.ctl==='settings')){
    S.objects.push({id:'c_set', title:'Settings', ctl:'settings', ic:'sliders',
      c:'#6B6152', kind:'control', parent:ROOT, body:'', tags:[],
      ord:-1, created:T, desk:null, phone:null});
  }
}
function adopt(d){
  if(!d || !Array.isArray(d.objects)) return false;
  S.objects = Array.isArray(d.drawers)
    ? foldDrawers(d)                                    // v1 or v2
    : d.objects.map(o=>Object.assign({tags:[],history:[],milestones:[],ord:0},o));
  if(!(d.v>=4)) doubleBoxes(S.objects);   // 6 cols -> 12
  if(!(d.v>=5)) doubleBoxes(S.objects);   // 12 cols -> 24, so a half-cell exists
  ensureControls();
  S.kinds = d.kinds || {};
  S.look = Object.assign(defaultLook(), d.look||{});
  if(d.theme) S.theme = d.theme;
  if(d.listmode) S.listmode = d.listmode;
  refreshKinds();
  return true;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    return raw ? adopt(JSON.parse(raw)) : false;
  }catch(e){ return false; }
}
function exportBackup(){
  const name = `bureau-${D.iso(D.today())}.json`;
  const blob = new Blob([JSON.stringify(snapshot(),null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Backup saved · ' + name);
}
function importBackup(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      if(adopt(JSON.parse(fr.result))){ writeNow(); S.view='desk'; S.openId=null; render(); renderSheet(); toast('Desk restored'); }
      else toast('That file is not a Bureau backup');
    }catch(e){ toast('Could not read that file'); }
  };
  fr.readAsText(file);
}

/* ============================================================
   19c · assets — image bytes live in IndexedDB, never in the JSON
   ============================================================
   localStorage caps around 5MB and holds the whole desk, so pictures cannot go
   in it. Objects keep {assetId, w, h, label}; the bytes sit in IndexedDB and
   are hydrated onto `media.src` in memory after load. snapshot() strips `src`
   again on the way out, which is what keeps a backup small and readable.      */
const DBNAME='bureau-assets', STORE='assets';
let _db=null;
function db(){
  if(_db) return _db;
  _db = new Promise((res,rej)=>{
    const r=indexedDB.open(DBNAME,1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore(STORE); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  }).catch(()=>null);
  return _db;
}
function assetPut(id,src){
  return db().then(d=>d&&new Promise(res=>{
    const tx=d.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(src,id);
    tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
  })).catch(()=>false);
}
function assetGet(id){
  return db().then(d=>d&&new Promise(res=>{
    const rq=d.transaction(STORE,'readonly').objectStore(STORE).get(id);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null);
  })).catch(()=>null);
}
function assetDel(id){
  return db().then(d=>d&&new Promise(res=>{
    const tx=d.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
  })).catch(()=>false);
}
// After a load, put the pictures back on the objects that reference them.
function hydrateAssets(){
  const want=S.objects.filter(o=>o.media&&o.media.assetId&&!o.media.src);
  if(!want.length) return;
  Promise.all(want.map(o=>assetGet(o.media.assetId).then(src=>{ if(src) o.media.src=src; })))
    .then(()=>render());
}
/* Downscale on import: an untouched phone photo is several megabytes and
   nothing on this grid needs more than about 1400px on its long edge. */
function importImage(file){
  if(!/^image\//.test(file.type)){ toast('That is not an image'); return; }
  const fr=new FileReader();
  fr.onerror=()=>toast('Could not read that file');
  fr.onload=()=>{
    const im=new Image();
    im.onerror=()=>toast('Could not read that image');
    im.onload=()=>{
      const max=1400, s=Math.min(1, max/Math.max(im.width,im.height));
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(im.width*s)); cv.height=Math.max(1,Math.round(im.height*s));
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      let src; try{ src=cv.toDataURL('image/jpeg',0.82); }catch(e){ toast('Could not read that image'); return; }
      const assetId=uid('a');
      assetPut(assetId,src).then(ok=>{
        // an image is placed, not filed: it lands on the grid you are looking
        // at, rather than being routed to whatever drawer collects media
        const here=(S.view==='drawer'&&S.drawerId)||ROOT;
        const o=create('media',{title:file.name.replace(/\.[^.]+$/,''), parent:here});
        o.media={assetId, type:'image', w:cv.width, h:cv.height, label:file.name, src};
        // pictures land square; you stretch them to the shape you want
        o.desk=null; o.phone=null;
        hideModal(); save(); render();
        toast(ok?'Image added':'Image added — it may not survive a reload');
      });
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ============================================================
   20 · event wiring
   ============================================================ */
function bindSortables(){ /* delegation handles it; keep quick-add focused */ }

function act(name, el){
  switch(name){
    case 'new': modalNewObject(); break;
    case 'newdrawer': modalDrawer(null); break;
    case 'arrange': S.arrange=!S.arrange; render(); break;
    case 'reorder': S.reorder=!S.reorder; render(); break;
    case 'listmode': S.listmode = S.listmode==='rows'?'cards':'rows'; render(); break;
    case 'back': S.view='desk'; S.drawerId=null; S.kindFilter=null; render(); break;
    case 'cancel': hideModal(); break;
    case 'savedrawer': {
      const id=el.dataset.id, m=$('#modal'), draft=m._draft||{};
      const title=$('#dnm').value.trim()||'Untitled drawer';
      if(id){ const d=byId(id);
        Object.assign(d,{title,c:draft.c,pv:draft.pv,layout:draft.layout});
        d.filter=Object.assign({},d.filter,{kinds:draft.kinds,tag:draft.tag||undefined});
      } else {
        // a new drawer lands inside whatever container you are looking at
        const home=(S.view==='drawer'&&S.drawerId)||ROOT;
        S.objects.push({id:uid('d'), kind:'drawer', title, body:'', tags:[],
          parent:home, c:draft.c, pv:draft.pv, layout:draft.layout||'list',
          filter:{kinds:draft.kinds,tag:draft.tag||undefined}, ord:0, created:T,
          desk:freeSpot(2,2,'desk',home), phone:freeSpot(2,2,'phone',home)});
      }
      hideModal(); save(); render(); toast(id?'Drawer updated':'Drawer added');
      break;
    }
    case 'deldrawer': {
      const id=el.dataset.id;
      // its children are kept — they fall back to wherever it lived
      const d=byId(id), up=(d&&d.parent)||ROOT;
      S.objects.forEach(o=>{ if(o.parent===id) o.parent=up; });
      S.objects=S.objects.filter(o=>o.id!==id);
      if(S.drawerId===id){ S.drawerId=up===ROOT?null:up; S.view=up===ROOT?'desk':'drawer'; }
      hideModal(); save(); render(); toast('Drawer removed — its contents kept');
      break;
    }
    case 'attrreset': {
      const o=byId(S.openId); if(!o) return;
      o.attrs=null; save(); renderSheet(); render(); toast(`Following the ${K(o.kind).nm.toLowerCase()} kind again`);
      break;
    }
    case 'kindfromobj': modalNewKind(byId(S.openId)); break;
    case 'savekind': {
      const m=$('#modal'), draft=m._draft||{};
      const nm=$('#knm').value.trim();
      if(!nm){ toast('Give the kind a name'); return; }
      const key=nm.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20)||('kind'+Date.now());
      S.kinds[key]={nm, ic:draft.ic||'note', c:draft.c, key:nm[0].toUpperCase(),
                    ds:draft.ds||'A kind you made', attrs:draft.attrs.slice(), body:''};
      refreshKinds();
      // the object that inspired it now simply *is* that kind
      if(draft.fromId){ const o=byId(draft.fromId); if(o){ o.kind=key; o.attrs=null; } }
      hideModal(); save(); render(); renderSheet(); toast(`“${nm}” is now a kind`);
      break;
    }
    case 'delkind': {
      const key=el.dataset.id;
      if(S.objects.some(o=>o.kind===key)){ toast('Something still uses that kind'); return; }
      delete S.kinds[key]; refreshKinds(); save(); render(); toast('Kind removed');
      break;
    }
    case 'addtag': {
      const o=byId(S.openId); if(!o) return;
      const t=prompt('Tag'); if(t){ o.tags=o.tags||[]; if(!o.tags.includes(t.trim())) o.tags.push(t.trim().replace(/^#/,'')); renderSheet(); render(); }
      break;
    }
    case 'addmile': { const o=byId(S.openId); o.milestones.push({t:'New milestone',done:false,d:dz(30)}); renderSheet(); break; }
    case 'attach': { const o=byId(S.openId); o.media={type:'image',label:'photo-2026-08.heic · 4.2 MB'}; renderSheet(); render(); toast('Media attached'); break; }
    case 'dupe': { const o=byId(S.openId); const c=Object.assign({},o,{id:uid('o'),title:o.title+' (copy)',ord:o.ord+0.1}); S.objects.push(c); openObj(c.id); render(); break; }
    case 'sched': { const o=byId(S.openId); o.due=T; renderSheet(); render(); toast('Scheduled for today'); break; }
    case 'stopedit': S.layoutEdit=null; S.arrange=false; render(); break;
    case 'export': exportBackup(); break;
    case 'import': $('#importer').click(); break;
    case 'pickimage': $('#imgpicker').click(); break;
    case 'drawersettings': modalDrawer(el.dataset.id); break;
    case 'newkind': modalNewKind(null); break;
    case 'install': if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; } break;
    case 'reseed': { const th=S.theme, lk=S.look; reset(); S.theme=th; S.look=lk; applyLook(); writeNow(); render(); toast('Sample desk restored'); break; }
    case 'wipe': {
      if(!confirm('Erase every object and drawer on this device? This cannot be undone.')) return;
      // keep three empty drawers so the desk isn't a blank rectangle
      const th=S.theme, lk=S.look; reset(); S.theme=th; S.look=lk;
      S.objects = S.objects.filter(isContainer).slice(0,3);
      applyLook(); writeNow(); render(); toast('Desk cleared'); break;
    }
  }
}

function wire(){
  const frame=$('#frame');

  frame.addEventListener('pointerdown', onDown);
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
  frame.addEventListener('pointercancel', ()=>{ if(G){ if(G.el) G.el.style.transform=''; G=null; } });

  frame.addEventListener('contextmenu', e=>{
    const tile=e.target.closest('.grid .drawer');
    if(tile){
      const id=tile.dataset.drawer||tile.dataset.row||tile.dataset.id;
      if(id){ e.preventDefault(); openCtx(e.clientX,e.clientY,id); }
      return;
    }
    const r=e.target.closest('[data-row]'); if(!r) return;
    e.preventDefault(); openCtx(e.clientX,e.clientY,r.dataset.row);
  });

  frame.addEventListener('click', e=>{
    const t=e.target;
    if(!t.closest('#ctx')) closeCtx();

    const undoEl=t.closest('[data-undo]'); if(undoEl){ undo(); return; }
    const c=t.closest('[data-c]');
    if(c){ const [cmd,id]=c.dataset.c.split(':'); closeCtx();
      if(cmd==='open') openObj(id);
      else if(cmd==='done') toggleDone(id);
      else if(cmd==='today'){ byId(id).due=T; render(); toast('Scheduled today'); }
      else if(cmd==='tom'){ byId(id).due=dz(1); render(); toast('Scheduled tomorrow'); }
      else if(cmd==='move') modalMove(id);
      else if(cmd==='dupe'){ const o=byId(id); S.objects.push(Object.assign({},o,{id:uid('o'),title:o.title+' (copy)',ord:o.ord+0.1})); render(); }
      else if(cmd==='intodrawer') drawerFromSelection(id);
      else if(cmd==='del'){
        const sel = S.sel.includes(id) ? S.sel.slice() : [id];
        if(sel.length>1){ sel.forEach(x=>{ const i=S.objects.findIndex(o=>o.id===x); if(i>=0) S.objects.splice(i,1); });
          S.sel=[]; save(); render(); toast(`Deleted ${sel.length}`); }
        else del(id);
      }
      return; }

    const mv=t.closest('[data-moveto]');
    if(mv){ const [oid,did]=mv.dataset.moveto.split(':');
      byId(oid).parent=did; hideModal(); save(); render(); renderSheet();
      toast('Filed in '+(did===ROOT?'The Desk':byId(did).title)); return; }

    const nk=t.closest('[data-new]');
    if(nk){
      const at=pendingCell;            // hideModal clears it, so keep it first
      hideModal();
      pendingCell=at;
      const kind=nk.dataset.new;
      const o=create(kind, at?{parent:at.parent}:undefined);
      placeAtPending(o);
      render();
      // a drawer wants naming and a rule; everything else wants its body
      if(isContainer(o)) modalDrawer(o.id);
      else { openObj(o.id); S.editing=true; renderSheet(); }
      return; }

    const ck=t.closest('[data-check]'); if(ck){ toggleDone(ck.dataset.check); return; }
    const hb=t.closest('[data-habit]'); if(hb){ toggleHabit(hb.dataset.habit); return; }
    const dl=t.closest('[data-del]'); if(dl){ del(dl.dataset.del); return; }
    const mn=t.closest('[data-menu]'); if(mn){ const r=mn.getBoundingClientRect(); openCtx(r.left,r.bottom+4,mn.dataset.menu); return; }

    const ml=t.closest('[data-mile]');
    if(ml){ const [gid,i]=ml.dataset.mile.split(':'); const g=byId(gid); const m=g.milestones[+i];
      m.done=!m.done; if(m.done) toast('Milestone passed · '+m.t);
      render(); if(S.openId) renderSheet(); return; }
    const mdel=t.closest('[data-mdel]');
    if(mdel){ byId(S.openId).milestones.splice(+mdel.dataset.mdel,1); renderSheet(); render(); return; }

    const hd=t.closest('[data-hday]');
    if(hd){ const o=byId(S.openId); const ds=hd.dataset.hday; const i=o.history.indexOf(ds);
      if(i>=0) o.history.splice(i,1); else o.history.push(ds); renderSheet(); render(); return; }

    const ut=t.closest('[data-untag]');
    if(ut){ const o=byId(S.openId); o.tags=o.tags.filter(x=>x!==ut.dataset.untag); renderSheet(); render(); return; }

    const sh=t.closest('[data-sheet]');
    if(sh){ const v=sh.dataset.sheet;
      if(v==='close') closeSheet();
      else if(v==='del') del(S.openId);
      else if(v==='done'){ toggleDone(S.openId); renderSheet(); }
      else { S.editing = v==='write'; renderSheet(); }
      return; }

    const a=t.closest('[data-act]'); if(a){ act(a.dataset.act,a); return; }

    const vw=t.closest('[data-view]');
    if(vw){ S.view=vw.dataset.view; S.drawerId=null; S.kindFilter=null; S.arrange=false; render(); return; }

    /* Clicking bare grid makes something there. The cell under the pointer is
       remembered so the new object lands where you pointed, not wherever there
       happened to be room. */
    if(t.classList && t.classList.contains('grid') && !S.arrange){
      const g=gridOf(), r=t.getBoundingClientRect(), cw=cellW(t,g);
      const cx=Math.floor((e.clientX-r.left)/(cw+g.gap))+1;
      const cy=Math.floor((e.clientY-r.top)/(CELL[dev()]+g.gap))+1;
      pendingCell={x:clamp(cx,1,g.cols), y:Math.max(1,cy), parent:t.dataset.gridfor||ROOT};
      modalNewObject();
      return;
    }

    // a control object on the desk
    const ctl=t.closest('[data-ctl]');
    if(ctl && !S.arrange){
      const a=ctl.dataset.ctl;
      if(a==='new') modalNewObject();
      else if(a==='arrange'){ S.arrange=true; render(); }
      else if(a==='settings'){ S.view='settings'; render(); }
      return;
    }

    // shift/⌘ click builds a selection, Finder-style, instead of opening
    const tile=t.closest('.grid .drawer');
    if(tile && (e.shiftKey||e.metaKey||e.ctrlKey)){
      const id=tile.dataset.drawer||tile.dataset.row||tile.dataset.id;
      if(id){ const i=S.sel.indexOf(id);
        if(i>=0) S.sel.splice(i,1); else S.sel.push(id);
        render(); }
      return;
    }
    // a plain click anywhere clears the selection before doing anything else
    if(S.sel.length && !t.closest('#ctx')) S.sel=[];

    const dr=t.closest('[data-drawer]');
    if(dr && (dr.classList.contains('navitem') || dr.tagName==='B' || (dr.classList.contains('drawer') && !S.arrange))){
      S.view='drawer'; S.drawerId=dr.dataset.drawer; S.kindFilter=null; S.reorder=false; S.arrange=false; render(); return; }

    // cards, goal titles, timeline entries — anything carrying an id that isn't a swipeable row
    const ro=t.closest('[data-row]');
    if(ro && !ro.classList.contains('row')){ openObj(ro.dataset.row); return; }

    const kf=t.closest('[data-kind]');
    if(kf && kf.classList.contains('fchip')){ S.kindFilter=kf.dataset.kind||null; render(); return; }
    const kk=t.closest('[data-kk]');
    if(kk){ const m=$('#modal'), k=kk.dataset.kk, i=m._draft.kinds.indexOf(k);
      if(i>=0) m._draft.kinds.splice(i,1); else m._draft.kinds.push(k);
      kk.classList.toggle('on'); return; }
    const pv=t.closest('[data-pv]');
    if(pv){ $('#modal')._draft.pv=pv.dataset.pv; $$('#dpv .fchip').forEach(b=>b.classList.remove('on')); pv.classList.add('on'); return; }
    const col=t.closest('[data-col]');
    if(col){ $('#modal')._draft.c=col.dataset.col; $$('#dcol button').forEach(b=>b.classList.remove('on')); col.classList.add('on'); return; }

    // layout of the drawer being edited in the modal
    const dtg=t.closest('[data-dtag]');
    if(dtg){ $('#modal')._draft.tag=dtg.dataset.dtag; $$('#dtag .fchip').forEach(b=>b.classList.remove('on')); dtg.classList.add('on'); return; }

    const dlay=t.closest('[data-dl]');
    if(dlay){ $('#modal')._draft.layout=dlay.dataset.dl; $$('#dlayout .fchip').forEach(b=>b.classList.remove('on')); dlay.classList.add('on'); return; }

    // attributes, in the new-kind modal
    const ka=t.closest('[data-ka]');
    if(ka){ const d=$('#modal')._draft, a=ka.dataset.ka, i=d.attrs.indexOf(a);
      if(i>=0) d.attrs.splice(i,1); else d.attrs.push(a);
      ka.classList.toggle('on');
      $('#kattrsds').textContent=d.attrs.map(x=>ATTRS[x].ds).join(' · ');
      return; }

    // attributes, on one object in the detail sheet
    const at=t.closest('[data-attr]');
    if(at){ const o=byId(S.openId); if(!o) return;
      const cur=attrsOf(o).slice(), a=at.dataset.attr, i=cur.indexOf(a);
      if(i>=0) cur.splice(i,1); else cur.push(a);
      o.attrs=cur;
      save(); renderSheet(); render(); return; }

    // how a drawer lays its contents out, from the drawer's own toolbar
    const lm=t.closest('[data-layoutmode]');
    if(lm){ const d=byId(S.drawerId); if(d){ d.layout=lm.dataset.layoutmode; S.arrange=false; save(); render(); } return; }

    // a button object's button
    const fire=t.closest('[data-fire]');
    if(fire){ const o=byId(fire.dataset.fire), tg=o&&o.link&&o.link.target;
      if(!tg){ openObj(fire.dataset.fire); return; }
      if(/^https?:/.test(tg)){ window.open(tg,'_blank','noopener'); return; }
      const dest=byId(tg);
      if(dest && isContainer(dest)){ S.view='drawer'; S.drawerId=tg; render(); }
      else if(dest) openObj(tg);
      return; }

    const lk=t.closest('[data-look]');
    if(lk){ const k=lk.dataset.look, v=lk.dataset.val;
      S.look[k] = k==='railHidden' ? !!v : (v||null);
      applyLook(); save(); render(); return; }

    const tg=t.closest('[data-tag]');
    if(tg){ const v=tg.dataset.tag; S.tagFilter = (!v||S.tagFilter===v)?null:v; if(S.tagFilter) S.view='all'; render(); return; }

    const day=t.closest('[data-day]'); if(day){ S.selDate=day.dataset.day; render(); return; }

    const th=t.closest('[data-theme2]'); if(th){ S.theme=th.dataset.theme2; render(); return; }
    const ly=t.closest('[data-layout]');
    if(ly){ S.layoutEdit = ly.dataset.layout || null; S.view='desk'; S.arrange=!!S.layoutEdit; render(); return; }

    // the size chip still cycles presets — quicker than dragging on a phone.
    // It keeps the drawer where it is and skips any preset that would collide.
    const sz=t.closest('[data-size]');
    if(sz){ const d=byId(sz.dataset.size), g=gridOf(), cur=lay(d);
      const P = dev()==='desk' ? [[2,2],[4,4],[6,6],[8,6],[12,8],[6,12],[24,8]]
                               : [[2,2],[4,4],[8,6],[8,8],[16,6],[16,12]];
      const i=P.findIndex(p=>p[0]===cur.w&&p[1]===cur.h);
      for(let n=1;n<=P.length;n++){
        const [w,h]=P[(i+n)%P.length];
        const box={x:Math.min(cur.x, g.cols-w+1), y:cur.y, w, h};
        if(boxOk(box,d.id,dev(),d.parent)){ d[dev()]=box; save(); render(); return; }
      }
      toast('No room to resize — move it first'); return; }
    const dd=t.closest('[data-delDrawer]');
    if(dd){ const id=dd.dataset.deldrawer, o=byId(id), up=(o&&o.parent)||ROOT;
      S.objects.forEach(x=>{ if(x.parent===id) x.parent=up; });
      S.objects=S.objects.filter(x=>x.id!==id); save(); render(); return; }

    const cr=t.closest('[data-cmd]'); if(cr){ runCmd(+cr.dataset.cmd); return; }

    if(t.id==='scrim') hideModal();
    if(t.id==='cmdscrim') closeCmd();
  });

  // inline field edits
  frame.addEventListener('input', e=>{
    // colour pickers: live preview while dragging, committed on 'change'
    const li=e.target.dataset.lookinput;
    if(li){ S.look[li]=e.target.value; applyLook(); return; }
    if(e.target.dataset.colinput!=null){
      const m=$('#modal'); if(m&&m._draft){ m._draft.c=e.target.value;
        $$('#dcol button').forEach(b=>b.classList.remove('on')); }
      return;
    }
    const f=e.target.dataset.f;
    if(f){
      const o=byId(S.openId); if(!o) return;
      if(f==='title'){ o.title=e.target.value; e.target.style.height='auto'; e.target.style.height=e.target.scrollHeight+'px'; }
      else if(f==='body') o.body=e.target.value;
      else if(f==='due') o.due=e.target.value||null;
      else if(f==='repeat') o.repeat=e.target.value||null;
      else if(f==='parent'){
        const v=e.target.value;
        if(v!==o.id && !isAncestor(o.id, container(v))) o.parent=v;
        else toast('A drawer cannot go inside itself');
      }
      else if(f==='layout'){ o.layout=e.target.value; render(); }
      else if(f==='linklabel'){ o.link=o.link||{}; o.link.label=e.target.value; }
      else if(f==='linktarget'){ o.link=o.link||{}; o.link.target=e.target.value; }
      else if(f==='linkurl'){ o.link=o.link||{}; if(e.target.value) o.link.target=e.target.value; }
      else if(f==='mtype'){ o.media=o.media||{label:'untitled'}; o.media.type=e.target.value; renderSheet(); }
      else if(f==='kind'){ o.kind=e.target.value; if(has(o,'progress')&&!o.milestones.length) o.milestones=[{t:'First milestone',done:false,d:dz(30)}]; renderSheet(); }
      return;
    }
    if(e.target.dataset.mtext!=null){ byId(S.openId).milestones[+e.target.dataset.mtext].t=e.target.value; return; }
    if(e.target.dataset.mdate!=null){ byId(S.openId).milestones[+e.target.dataset.mdate].d=e.target.value; return; }
    if(e.target.id==='cmdinput'){ cmdList(e.target.value); return; }
  });

  frame.addEventListener('change', e=>{
    if(e.target.id==='imgpicker' && e.target.files && e.target.files[0]){
      importImage(e.target.files[0]); e.target.value='';
    }
    if(e.target.id==='importer' && e.target.files && e.target.files[0]){
      importBackup(e.target.files[0]); e.target.value='';
    }
    // re-render only once the picker closes, so it doesn't die mid-drag
    if(e.target.dataset.lookinput){ save(); render(); }
  });

  frame.addEventListener('keydown', e=>{
    if(e.target.id==='qa' && e.key==='Enter'){
      const o=quickAdd(e.target.value, e.target.dataset.kind, e.target.dataset.drawer);
      e.target.value=''; if(o){ render(); setTimeout(()=>{const q=$('#qa'); q&&q.focus();},0); toast('Added'); }
      return;
    }
    if(e.target.id==='cmdinput'){
      if(e.key==='Enter'){ runCmd(0); }
      if(e.key==='Escape'){ closeCmd(); }
    }
  });

  document.addEventListener('keydown', e=>{
    const typing = /input|textarea/i.test(document.activeElement.tagName);
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCmd(); return; }
    if(e.key==='Escape'){ closeCtx(); hideModal(); closeCmd(); if(S.openId) closeSheet(); return; }
    if(typing) return;
    if(e.key==='n'||e.key==='N'){ e.preventDefault(); modalNewObject(); return; }
    if($('#scrim').classList.contains('open')){
      const k=KEYS.find(x=>KINDS[x].key.toLowerCase()===e.key.toLowerCase());
      if(k){ hideModal(); const o=create(k); render(); openObj(o.id); S.editing=true; renderSheet(); }
    }
  });

  // the device decides which layout you see; the OS decides the default theme
  const wide = window.matchMedia('(min-width: 900px)');
  const addML = (mq, fn)=> mq.addEventListener ? mq.addEventListener('change', fn) : mq.addListener(fn);
  addML(wide, ()=>{ S.device = sensedDevice(); render(); });
  addML(window.matchMedia('(prefers-color-scheme: dark)'), ()=>{ if(S.theme==='auto') render(); });

  // Device is sensed once at parse time, when the window may not be laid out
  // yet (a background tab reports zero width and reads as a phone). Re-sense on
  // resize so the desk layout appears as soon as there is a real width.
  window.addEventListener('resize', ()=>{
    const d=sensedDevice();
    if(d!==S.device && !S.layoutEdit){ S.device=d; render(); }
    else sizeGrid();
  });
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall=e; if(S.view==='settings') render(); });
  window.addEventListener('beforeunload', writeNow);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) writeNow(); });
}

/* ============================================================
   21 · boot
   ============================================================ */
const restored = load();
const hash = (location.hash||'').replace('#','');
if(['today','keep','all','desk','settings'].includes(hash)) S.view = hash;
$('#frame').insertAdjacentHTML('beforeend', overlayHTML());
wire();
applyLook();
render();
hydrateAssets();
if(!restored) writeNow();

// keep a save after every re-render, cheaply
const _render = render;
render = function(){ _render(); save(); };
save();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* file:// or unsupported */ });
  });
}

window.BUREAU = {get state(){return S}, render:()=>render(), create, save:writeNow, K:KINDS};
})();
</script>
</body>
</html>
