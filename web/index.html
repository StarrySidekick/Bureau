<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Bureau</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23E9E1CC'/%3E%3Crect x='9' y='12' width='46' height='40' rx='4' fill='%237E5A38'/%3E%3Crect x='13' y='16' width='38' height='32' rx='2' fill='none' stroke='%23F3E7D2' stroke-opacity='.45' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23F3E7D2' fill-opacity='.75'/%3E%3C/svg%3E">

<style>
/* ============================================================
   BUREAU — design tokens
   ============================================================ */
:root{
  --paper:#E9E1CC;          /* parchment */
  --paper-2:#F2ECDB;
  --paper-3:#DCD2B9;
  --felt:#C7BA9B;
  --ink:#2A241C;
  --ink-2:#6B6152;
  --ink-3:#968B78;
  --rule:rgba(42,36,28,.16);
  --rule-2:rgba(42,36,28,.08);
  --brass:#A9793F;
  --brass-2:#D9B57C;
  --shadow:0 1px 2px rgba(42,36,28,.13),0 6px 18px -10px rgba(42,36,28,.28);
  --shadow-lg:0 2px 6px rgba(42,36,28,.16),0 22px 46px -20px rgba(42,36,28,.42);
  --board-1:#EFEADA;        /* the board, light square */
  --board-2:#DDE5CE;        /* the board, other square — a soft green */
  --radius:5px;             /* UI chrome — pills, chips, fields */
  --radius-d:3px;           /* drawers. A drawer front is not a rounded rect. */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="walnut"]{
  --paper:#191510;
  --paper-2:#231E18;
  --paper-3:#2E2820;
  --felt:#3A3228;
  --ink:#F0E8D9;
  --ink-2:#A29786;
  --ink-3:#7A7062;
  --rule:rgba(240,232,217,.14);
  --rule-2:rgba(240,232,217,.07);
  --brass:#D7AE72;
  --brass-2:#8A6A3C;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px -14px rgba(0,0,0,.8);
  --shadow-lg:0 2px 8px rgba(0,0,0,.55),0 40px 70px -28px rgba(0,0,0,.9);
  --board-1:#201B14;
  --board-2:#26221A;
}
/* Custom background/accent/outline are written as inline custom properties on
   <html> by applyLook() in section 4b — an inline property beats any selector
   here, so it overrides whichever theme is active without a third theme block. */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);overscroll-behavior:none;
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box;border:3px solid transparent}

/* ============================================================
   App shell
   ============================================================ */
#frame{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.seg{display:flex;background:var(--paper-3);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:4px 11px;border-radius:7px;font-size:12px;color:var(--ink-2);font-weight:500;transition:.15s}
.seg button[aria-pressed="true"]{background:var(--paper-2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.iconbtn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);transition:.15s}
.iconbtn:hover{background:var(--paper-3);color:var(--ink)}
.banner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;font-size:12px;
  background:color-mix(in srgb,var(--brass) 16%,transparent);color:var(--ink);margin-bottom:10px}
.banner button{margin-left:auto;font-weight:600;color:var(--brass);white-space:nowrap}

/* ============================================================
   App shell
   ============================================================ */
.app{position:absolute;inset:0;display:flex;overflow:hidden;padding-top:env(safe-area-inset-top)}
/* a drag must never turn into a text selection */
.dragging-ui,.dragging-ui *{user-select:none!important}
.navitem{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;
  color:var(--ink-2);font-size:13.5px;font-weight:500;transition:.12s;width:100%;text-align:left;
}
.navitem:hover{background:var(--paper-3);color:var(--ink)}
.navitem.on{background:color-mix(in srgb,var(--brass) 15%, transparent);color:var(--ink)}
.navitem .ico{width:17px;display:grid;place-items:center;color:var(--ink-3)}
.navitem.on .ico{color:var(--brass)}
.navitem .n{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tagchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;
  background:var(--paper-3);color:var(--ink-2);border:1px solid var(--rule-2)}
.tagchip.on{background:color-mix(in srgb,var(--brass) 22%, transparent);color:var(--ink);border-color:transparent}
.realtag{
  position:relative;display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px 4px 20px;font-size:12px;color:#F8F3E6;
  background:var(--brass);
  clip-path:polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%);
}
.realtag::before{content:"";position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;background:rgba(0,0,0,.42)}
.realtag b{cursor:pointer;opacity:.7;font-weight:400}
.realtag b:hover{opacity:1}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 22px 10px;
}
.is-phone .topbar{padding:12px 16px 8px}
.topbar h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;letter-spacing:.005em}
.is-phone .topbar h1{font-size:23px}
.topbar .sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.topbar .grow{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12.5px;
  font-weight:500;background:var(--paper-2);border:1px solid var(--rule);color:var(--ink-2);transition:.15s;white-space:nowrap
}
.pill:hover{border-color:var(--brass);color:var(--ink)}
.pill.solid{background:var(--ink);color:var(--paper);border-color:transparent}
html[data-theme="walnut"] .pill.solid{background:var(--brass);color:#20180E}
.pill.solid:hover{opacity:.9}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 22px 120px}
.is-phone .scroll{padding:4px 14px 110px}
/* the desk has no toolbar — the grid is the page */
.deskscroll{padding:0 14px 120px}
.is-phone .deskscroll{padding:0 10px 110px}
/* reserve the scrollbar on both sides, or the grid sits off-centre */
.scroll{scrollbar-gutter:stable both-edges}

/* ---- the bar above every grid ---------------------------------------- */
.gridbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px 14px 8px;
}
.is-phone .gridbar{padding:8px 10px 6px}
.gridbar .where{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.gridbar .here{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gridbar .trail{display:flex;align-items:center;gap:5px;min-width:0;font-size:13px;color:var(--ink-3)}
.gridbar .trail b{font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.gridbar .trail b:hover{color:var(--brass)}
.bartools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.sqbtn{
  width:30px;height:30px;border-radius:var(--radius);display:grid;place-items:center;
  color:var(--ink-2);background:var(--paper-2);border:1px solid var(--rule);transition:.14s;
}
.sqbtn:hover{border-color:var(--brass);color:var(--ink)}

/* ============================================================
   Drawers grid
   ============================================================ */
/* Explicit x/y placement: every drawer names its column and row, so the grid is
   a coordinate space, not a flow. No auto-flow — an empty cell stays empty. */
/* Square cells: --rowh is set from the measured column width by sizeGrid(). */
.grid{display:grid;gap:0;align-content:start;position:relative}
.grid.g-desk{grid-template-columns:repeat(var(--cols,24),1fr);grid-auto-rows:var(--rowh,40px)}
.grid.g-phone{grid-template-columns:repeat(var(--cols,16),1fr);grid-auto-rows:var(--rowh,21px)}

.drawer{
  position:relative;border-radius:var(--radius-d);overflow:hidden;text-align:left;
  background:var(--c);
  border:1px solid var(--line,rgba(0,0,0,.28));
  box-shadow:var(--shadow);
  transition:box-shadow .18s,filter .18s;
  display:flex;flex-direction:column;padding:11px 13px;isolation:isolate;
  /* Drawer fronts are solid mid-dark colours, so everything inside reads light. */
  --dink:#F8F3E6;--dink-2:rgba(248,243,230,.76);--dink-3:rgba(248,243,230,.54);
  color:var(--dink);
}
.drawer:hover{box-shadow:var(--shadow-lg);filter:brightness(1.07)}
.drawer:active{filter:brightness(.96)}
.drawer .dtop{display:flex;align-items:center;gap:7px}
.drawer .swatch{display:none}
.drawer .dname{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.005em;
  color:var(--dink);white-space:normal;overflow-wrap:anywhere;overflow:hidden}
.drawer .dcount{margin-left:auto;font-size:11px;color:var(--dink-2);font-variant-numeric:tabular-nums;
  background:rgba(0,0,0,.20);border:1px solid rgba(255,255,255,.14);padding:1px 7px;border-radius:20px}
.drawer .dbody{flex:1;min-height:0;margin-top:8px;overflow:hidden;position:relative}
.drawer .dfoot{
  margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:center;
}
/* the knob sits in the middle of the front, like a real drawer pull */
.drawer.dtile .dfoot{position:absolute;left:0;right:0;top:0;bottom:0;margin:0;padding:0;
  align-items:center;justify-content:center;pointer-events:none}
.drawer.dtile.knb-bottom .dfoot{top:auto;height:32%;bottom:0}
.drawer.dtile .dtop{position:relative;z-index:2;align-items:flex-start;justify-content:center;padding-bottom:4px}
/* The knob owns the middle of the front, so the name is capped at two lines
   and sits above it. Capping *lines* rather than the box's height is what
   keeps it from being sliced through the middle of a letter. */
.drawer.dtile .dname{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.22;text-align:center;width:100%}
.drawer.h1{padding:9px 12px}
.drawer.h1 .dbody{margin-top:5px}
.drawer.h1 .dfoot{padding-top:5px}
.drawer.h1 .pv-big{flex-direction:row;align-items:baseline;gap:7px}
.drawer.h1 .pv-big .num{font-size:24px}
.drawer.h1 .pv-big .cap{margin-top:0}
.drawer.h1 .pv-list .r:nth-child(n+3){display:none}
.drawer.h1 .pv-thumbs{grid-template-columns:repeat(6,1fr)}
.drawer.h1 .pv-stack .card:nth-child(n+2){display:none}
.drawer.h1 .pv-bars{gap:4px}

/* preview styles inside drawers — all on a solid colour, so light-on-dark */
.pv-list{display:flex;flex-direction:column;gap:4px}
.pv-list .r{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dink-2);white-space:nowrap;overflow:hidden;min-width:0}
.pv-list .r span.lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pv-list .r .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75;flex:0 0 auto}
.pv-list .r.done{color:var(--dink-3);text-decoration:line-through}
.pv-stack{position:relative;height:100%}
.pv-stack .card{
  position:absolute;left:0;right:0;height:30px;border-radius:2px;background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.13);padding:7px 9px;font-size:11.5px;
  color:var(--dink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  border-left:3px solid rgba(255,255,255,.4);
}
.pv-big{display:flex;flex-direction:column;justify-content:center;height:100%}
.pv-big .num{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600;letter-spacing:-.02em;color:var(--dink)}
.pv-big .cap{font-size:11.5px;color:var(--dink-3);margin-top:3px}
.pv-thumbs{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:5px;height:100%}
.drawer.h1 .pv-thumbs{grid-template-rows:1fr}
.pv-thumbs i{border-radius:2px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.10);display:block}
.pv-bars{display:flex;flex-direction:column;gap:7px;justify-content:center;height:100%}
.pv-bars .b{height:5px;border-radius:2px;background:rgba(0,0,0,.26);overflow:hidden}
.pv-bars .b i{display:block;height:100%;background:var(--dink-2);border-radius:2px}

/* ------------------------------------------------------------
   the board — always visible, because the grid is the point
   ------------------------------------------------------------ */
.grid{
  /* a checkerboard two cells across, so the squares read as squares */
  border-radius:var(--radius);
}
.grid::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  border-radius:var(--radius);
  opacity:var(--board-alpha,1);
  background-color:var(--board-1);
  background-image:conic-gradient(
    var(--board-2) 0 25%, transparent 0 50%,
    var(--board-2) 0 75%, transparent 0);
  background-size:var(--checker,160px) var(--checker,160px);
  background-position:0 0;
}
.grid > *{position:relative;z-index:1}
.panel{
  position:absolute;top:52px;right:14px;z-index:44;width:290px;max-height:74vh;overflow-y:auto;
  background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);padding:12px 14px 14px;
}
.is-phone .panel{left:10px;right:10px;width:auto}
.panel .ptop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel .ptop b{font-family:var(--serif);font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{margin-bottom:10px}
.prow label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-bottom:5px}
.prow > div{display:flex;flex-wrap:wrap;gap:4px}
.pchip{padding:4px 9px;border-radius:20px;font-size:11.5px;border:1px solid var(--rule);
  color:var(--ink-2);background:var(--paper);transition:.12s}
.pchip:hover{border-color:var(--brass);color:var(--ink)}
.pchip.on{background:color-mix(in srgb,var(--brass) 22%,transparent);color:var(--ink);border-color:transparent}
.pslide{width:100%;accent-color:var(--brass)}
.rollup{margin-left:auto;font-size:11px;color:var(--dink-2);font-variant-numeric:tabular-nums;
  background:rgba(0,0,0,.20);border:1px solid rgba(255,255,255,.14);padding:1px 7px;border-radius:20px}
.pvwrap{display:grid;place-items:center;padding:16px 10px 18px;margin-bottom:12px;
  border:1px solid var(--rule);border-radius:var(--radius);
  background-color:var(--board-1);
  background-image:conic-gradient(var(--board-2) 0 25%,transparent 0 50%,var(--board-2) 0 75%,transparent 0);
  background-size:36px 36px;min-height:120px}
.pvgrid{background:none!important;max-width:100%}
.pvgrid::before{content:none}
.pvgrid .drawer{cursor:default}
.pvgrid .rz{display:none}
.iconchip{padding:5px 8px;display:inline-flex;align-items:center}
.iconchip.on{color:var(--ink)}
.relrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.relchip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;
  font-size:11.5px;cursor:pointer;color:var(--ink);
  background:color-mix(in srgb,var(--k) 16%,transparent);border:1px solid color-mix(in srgb,var(--k) 40%,transparent)}
.relchip:hover{border-color:var(--k)}
.relchip b{opacity:.55;font-weight:400}
.relchip b:hover{opacity:1}

/* ---- more type silhouettes ------------------------------------------- */
/* a poem: centred, on parchment */
.drawer.otile.sh-verse{background:var(--paper-2);text-align:center;align-items:center;justify-content:center;
  clip-path:polygon(0 0,100% 0,100% 62%,96.5% 68%,100% 74%,100% 100%,0 100%,0 34%,2.5% 28%,0 22%);
  border-left:1px solid var(--rule)}
.drawer.otile.sh-verse .dname{text-align:center;font-family:var(--serif)}
.drawer.otile.sh-verse .tiletext{text-align:center;font-family:var(--serif);font-style:italic;white-space:pre-line}
/* an ingredient reads like a line off a recipe card */
.drawer.otile.sh-index{background:#F6F1E2;border:1px solid var(--rule);padding-left:18px;
  background-image:linear-gradient(rgba(90,120,150,.18) 1px,transparent 1px);background-size:100% 100%}
.drawer.otile.sh-index::after{content:"";position:absolute;left:11px;top:0;bottom:0;width:1px;background:rgba(180,70,60,.5)}
/* a habit is a stack of days */
.drawer.otile.sh-habit{background:var(--paper-2)}
.drawer.otile.sh-habit::after{content:"";position:absolute;left:10px;right:10px;bottom:10px;height:8px;
  background-image:repeating-linear-gradient(90deg,var(--c) 0 7px,transparent 7px 11px);opacity:.55;border-radius:2px}
/* a goal is a target with a bar */
.drawer.otile.sh-goal,.drawer.otile.sh-dream{background:var(--paper-2)}
.drawer.otile.sh-goal::after{content:"";position:absolute;left:10px;right:10px;bottom:10px;height:5px;
  border-radius:99px;background:linear-gradient(90deg,var(--c) var(--pct,30%),rgba(0,0,0,.10) var(--pct,30%))}
.drawer.otile.sh-dream{border-style:dashed;opacity:.96}
.drawer.otile.sh-dream::after{content:"";position:absolute;right:8px;top:8px;width:14px;height:14px;
  background:var(--c);opacity:.35;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
/* an achievement is a plaque */
.drawer.otile.sh-plaque{
  background:linear-gradient(#6B4E22,#8A6A3C 40%,#5E4620);color:#F6EFD8;
  border:2px solid rgba(255,255,255,.28);border-radius:3px;
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.22), var(--shadow-lg);
  align-items:center;justify-content:center;text-align:center;
  --dink:#F8F2DE;--dink-2:rgba(248,242,222,.8);--dink-3:rgba(248,242,222,.6);
}
.drawer.otile.sh-plaque .dname{font-family:var(--serif);letter-spacing:.02em;text-align:center}
/* a story is a book seen spine-on */
.drawer.otile.spinetile{
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 68%,#000) 0 6%,var(--c) 6% 92%,color-mix(in srgb,var(--c) 70%,#000) 92%);
  border-radius:2px 4px 4px 2px;align-items:center;justify-content:center;padding:10px 0;overflow:hidden;
  box-shadow:var(--shadow), inset -3px 0 6px rgba(0,0,0,.25);
}
.spinetop,.spinefoot{width:64%;height:3px;background:rgba(255,255,255,.42);border-radius:2px;flex:0 0 auto}
.spinetitle{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--serif);font-size:14px;
  color:#F8F3E6;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a question with rounder corners */
.drawer.otile.sh-bubble{border-radius:18px 18px 18px 3px}
/* a timeline */
.tlwrap{position:absolute;left:12px;right:12px;top:44%;bottom:8px}
.tlrule{position:absolute;left:0;right:0;top:6px;height:2px;background:rgba(255,255,255,.35);border-radius:2px}
.tlnode{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:74px}
.tlnode i{width:9px;height:9px;border-radius:50%;background:var(--dink);opacity:.9}
.tlnode b{font-size:9.5px;font-weight:600;color:var(--dink-2);text-align:center;line-height:1.15;overflow-wrap:anywhere}
.tlnode u{font-size:8.5px;text-decoration:none;color:var(--dink-3)}
/* a button sits on a tile rather than floating */
.drawer.btntile{background:var(--paper-2);border:1px solid var(--rule);box-shadow:var(--shadow)}
/* counter digits fill the tile */
.cntnum{font-size:clamp(30px, min(60cqw, 62cqh), 260px)}
/* the book, floating in the middle like a real one */
.bookscrim{position:absolute;inset:0;z-index:60;background:rgba(20,16,12,.55);backdrop-filter:blur(2px)}
.bookstage{position:absolute;z-index:61;inset:4vh 6vw;display:flex;flex-direction:column;gap:10px;
  align-items:center;justify-content:center;pointer-events:none}
.bookstage > *{pointer-events:auto}
.bookhead{display:flex;align-items:center;gap:10px;color:var(--paper);width:min(1100px,100%)}
.bookhead b{flex:1;font-family:var(--serif);font-size:17px;color:#F4EEDD;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bookstage .book{width:min(1100px,100%)}
.bookstage .spread{min-height:min(70vh,720px);box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.bookstage .bookcount{color:#E5DCC6}
/* the lasso reads as a selection rather than a new object */
.ghost.band{border-style:dashed}
.ghost.picking{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 18%,transparent);
  box-shadow:0 0 0 2px rgba(255,255,255,.4)}
/* a generator: a press with an arrow */
.drawer.gentile{background:var(--c);align-items:center;justify-content:center;gap:5px;text-align:center;
  border-radius:8px;border-color:transparent;padding:8px;container-type:inline-size}
.genico{color:#F8F3E6;opacity:.9}
.genlabel{font-size:clamp(10px,6cqw,14px);font-weight:600;color:#F8F3E6;overflow-wrap:anywhere;line-height:1.2}
.genarrow{position:absolute;right:6px;bottom:6px;color:rgba(248,243,230,.65)}
.drawer.gentile:active{transform:scale(.97)}
/* a counter as an old ledger totaliser */
.drawer.cnttile{
  background:linear-gradient(#2A241C,#211C16);border:1px solid rgba(0,0,0,.5);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6), var(--shadow);border-radius:6px;
}
.cntlabel{color:rgba(233,225,204,.55);letter-spacing:.1em;text-transform:uppercase;
  font-size:clamp(8px,4cqw,12px)}
.cntnum{color:#E9E1CC;text-shadow:0 1px 0 rgba(0,0,0,.8)}
.wheel{background:linear-gradient(#171310,#2E2820 18%,#3A332A 50%,#2E2820 82%,#171310);
  border-radius:2px;margin:0 1px;box-shadow:inset 0 0 4px rgba(0,0,0,.8)}
/* the panel's swatch grids were collapsing to one per row inside the flex row */
.prow > div{display:flex;flex-wrap:wrap;gap:4px}
.prow .pickgrid{display:flex;flex-wrap:wrap;gap:5px;width:100%}
.prow .pickgrid button{width:26px;height:26px;flex:0 0 auto;border-radius:4px}

/* ---- drawer textures: quiet, and drawn over the front colour ---------- */
.drawer.dtile[class*="tx-"]::after{content:"";position:absolute;inset:0;pointer-events:none;
  border-radius:inherit;opacity:.30}
.drawer.dtile.tx-none::after{content:none}
.tx-dots::after{background-image:radial-gradient(circle at 50% 50%, rgba(255,255,255,.75) 0 1.1px, transparent 1.6px);
  background-size:14px 14px}
.tx-starry::after{background-image:
  radial-gradient(circle at 20% 30%, rgba(255,255,255,.95) 0 2.4px, transparent 3px),
  radial-gradient(circle at 72% 18%, rgba(255,255,255,.8) 0 1.9px, transparent 2.5px),
  radial-gradient(circle at 46% 74%, rgba(255,255,255,.9) 0 2.2px, transparent 2.8px),
  radial-gradient(circle at 88% 62%, rgba(255,255,255,.7) 0 1.7px, transparent 2.3px);
  background-size:104px 104px;opacity:.5}
.tx-grid::after{background-image:
  linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
  background-size:18px 18px;opacity:.18}
.tx-weave::after{background-image:
  repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 1px, transparent 1px 6px),
  repeating-linear-gradient(-45deg, rgba(255,255,255,.35) 0 1px, transparent 1px 6px);
  opacity:.22}
.tx-weave2::after{background-image:
  repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 1px, transparent 1px 13px),
  repeating-linear-gradient(-45deg, rgba(255,255,255,.35) 0 1px, transparent 1px 13px);
  opacity:.22}
.tx-speckle::after{background-image:
  radial-gradient(circle at 12% 18%, rgba(0,0,0,.5) 0 1.1px, transparent 1.5px),
  radial-gradient(circle at 63% 32%, rgba(0,0,0,.5) 0 1.1px, transparent 1.5px),
  radial-gradient(circle at 34% 66%, rgba(0,0,0,.5) 0 1.1px, transparent 1.5px),
  radial-gradient(circle at 82% 84%, rgba(0,0,0,.5) 0 1.1px, transparent 1.5px),
  radial-gradient(circle at 47% 8%,  rgba(0,0,0,.5) 0 1.1px, transparent 1.5px),
  radial-gradient(circle at 6% 52%,  rgba(0,0,0,.5) 0 1.1px, transparent 1.5px),
  radial-gradient(circle at 91% 44%, rgba(0,0,0,.5) 0 1.1px, transparent 1.5px),
  radial-gradient(circle at 24% 92%, rgba(0,0,0,.5) 0 1.1px, transparent 1.5px);
  background-size:34px 34px;opacity:.4}
.tx-check::after{background-image:conic-gradient(
    rgba(255,255,255,.5) 0 25%, transparent 0 50%,
    rgba(255,255,255,.5) 0 75%, transparent 0);
  background-size:28px 28px;opacity:.22}
.tx-rule::after{background-image:linear-gradient(rgba(255,255,255,.55) 1px, transparent 1px);
  background-size:100% 22px;opacity:.20}

/* ---- picture frames, deliberately skeuomorphic ------------------------ */
.drawer.imgtile{border:0}
.drawer.imgtile.fr-mount{padding:9%;background:#F3EFE3;box-shadow:var(--shadow);border-radius:2px}
.drawer.imgtile.fr-gilt{padding:5%;border-radius:2px;
  background:linear-gradient(135deg,#C9A24A,#EBD79A 22%,#B98F35 48%,#F0E2AE 70%,#A87F2C);
  box-shadow:var(--shadow-lg), inset 0 0 0 3px rgba(0,0,0,.22)}
.drawer.imgtile.fr-walnut{padding:5%;border-radius:2px;
  background:linear-gradient(135deg,#5A3B22,#8A5C33 30%,#4A3018 60%,#7A5230);
  box-shadow:var(--shadow-lg), inset 0 0 0 3px rgba(0,0,0,.3)}
.drawer.imgtile.fr-black{padding:4%;border-radius:1px;background:#141210;
  box-shadow:var(--shadow-lg), inset 0 0 0 2px rgba(255,255,255,.10)}
.drawer.imgtile.fr-polaroid{padding:7% 7% 20%;background:#FBF8F0;border-radius:2px;box-shadow:var(--shadow-lg)}
.drawer.imgtile:not(.fr-none) .tileimg{border-radius:1px;box-shadow:0 1px 3px rgba(0,0,0,.35)}

/* a recipe is an index card: ruled, with a red margin line */
.drawer.otile.sh-index{
  background:#F6F1E2;clip-path:none;border:1px solid var(--rule);border-left:1px solid var(--rule);padding-left:20px;
  background-image:linear-gradient(rgba(90,120,150,.20) 1px, transparent 1px);
  background-size:100% 20px;background-position:0 30px;
}
.drawer.otile.sh-index::after{content:"";position:absolute;left:12px;top:0;bottom:0;width:1px;background:rgba(180,70,60,.5)}
.drawer.otile.sh-index .dname{font-family:var(--serif);font-size:14px}
.drawer.otile.sh-index .tiletext{font-size:11px;line-height:20px}
/* counter wheels */
.cntnum{display:flex;gap:1px;justify-content:center;align-items:center}
.wheel{display:block;height:1em;width:.62em;overflow:hidden;font-style:normal;line-height:1}
.wheel b{display:block;font-weight:inherit;
  transition:transform .6s cubic-bezier(.16,1.05,.3,1)}
.wheel b u{display:block;height:1em;line-height:1;text-decoration:none;text-align:center}
.wheel.plain{width:auto;line-height:1}
/* a trip is a ticket with a stub */
.drawer.triptile{padding:0;flex-direction:row;overflow:hidden;background:var(--c);align-items:stretch}
.triptile .tkmain{flex:1;min-width:0;padding:10px 12px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.triptile .tklabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dink-3)}
.triptile .tkloc{font-size:11.5px;color:var(--dink-2);display:flex;align-items:center;gap:4px}
.triptile .tkstub{
  flex:0 0 auto;width:22%;min-width:44px;display:grid;place-items:center;
  font-family:var(--serif);font-size:clamp(13px,4cqw,26px);letter-spacing:.08em;color:var(--dink);
  background:rgba(0,0,0,.20);
  border-left:2px dashed rgba(255,255,255,.45);
}
/* a text field that makes tasks */
.drawer.fieldtile{padding:0;background:var(--paper-2);border:1px dashed var(--rule);align-items:stretch}
.fieldin{width:100%;height:100%;border:0;background:none;outline:none;padding:0 12px;font-size:13.5px;color:var(--ink)}
/* dropping into a drawer */
.drawer.dropinto{outline:3px solid var(--brass);outline-offset:-3px;filter:brightness(1.12)}
.ghost.hidden{display:none}
@keyframes swallow{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
.drawer.swallow{animation:swallow .42s cubic-bezier(.2,.9,.3,1)}
/* the sheet takes the left half when the object is on the right */
.is-desk.sheet-left .sheet{right:auto;left:0;border-left:0;border-right:1px solid var(--rule)}
.is-desk.sheet-left .sheetveil{right:auto;left:50vw}
/* book view */
.book{max-width:1100px;margin:0 auto}
.spread{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;min-height:64vh}
.is-phone .spread{grid-template-columns:1fr}
.spread .page{padding:34px 38px 44px;position:relative;font-size:14.5px;line-height:1.75;
  border-right:1px solid var(--rule-2)}
.spread .page:last-child{border-right:0}
.spread .page h2{font-family:var(--serif);font-size:20px;margin:0 0 12px}
.spread .pno{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink-3)}
.spread .thin{color:var(--ink-3)}
.bookbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.bookcount{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bookbar .pill[disabled]{opacity:.4}
.pfoot{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule-2)}
.rangerow{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.rangerow input[type=range]{flex:1;accent-color:var(--brass)}
.rangerow b{font-variant-numeric:tabular-nums;color:var(--ink);min-width:38px;text-align:right}
.drawer{cursor:grab;user-select:none}
.drawer:active{cursor:grabbing}
/* picked up: bigger, as if lifted toward you, with a small unsteady sway */
.drawer.lifted{
  z-index:50;transform-origin:center;
  animation:lift 1.5s ease-in-out infinite;
  box-shadow:var(--shadow-lg);cursor:grabbing;
}
/* one loop: it swells as it comes up, then keeps swaying at that size */
@keyframes lift{
  0%  {transform:scale(1.055) rotate(-.6deg)}
  50% {transform:scale(1.055) rotate(.6deg)}
  100%{transform:scale(1.055) rotate(-.6deg)}
}
.drawer.dragging{opacity:.92;z-index:60;box-shadow:var(--shadow-lg);cursor:grabbing;animation:none}
.drawer.invalid{outline:2px solid #C0563F;outline-offset:-2px}
.grid.locked .drawer{cursor:default}
.lockmark{color:var(--ink-3);display:inline-flex;align-items:center;margin-left:6px}

/* the cells a dragged/resized drawer would land on */
.ghost{
  border:2.5px solid var(--ink);
  background:color-mix(in srgb,var(--ink) 26%,transparent);
  box-shadow:0 0 0 2px rgba(255,255,255,.5), var(--shadow-lg);
  border-radius:var(--radius-d);pointer-events:none;z-index:20;
}
.ghost.bad{border-color:#C0563F;background:rgba(192,86,63,.30);
  box-shadow:0 0 0 2px rgba(255,255,255,.45), var(--shadow-lg)}

/* eight handles, like a window. Bigger hit area than they look. */
.rz{position:absolute;z-index:30;display:block}
.rz::after{content:"";position:absolute;inset:0}
.rz.nw{top:-5px;left:-5px;width:16px;height:16px;cursor:nwse-resize}
.rz.ne{top:-5px;right:-5px;width:16px;height:16px;cursor:nesw-resize}
.rz.sw{bottom:-5px;left:-5px;width:16px;height:16px;cursor:nesw-resize}
.rz.se{bottom:-5px;right:-5px;width:16px;height:16px;cursor:nwse-resize}
/* invisible until you go near the tile, then a small corner mark */
.rz::before{content:"";position:absolute;inset:4px;background:var(--dink);
  opacity:0;border-radius:1px;transition:opacity .14s}
.drawer:hover .rz::before{opacity:.42}
.rz:hover::before{opacity:1}
.grid.locked .rz{display:none}

.sizebtns b{
  font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:3px 6px;border-radius:3px;
  background:rgba(0,0,0,.42);color:var(--dink);cursor:pointer;font-variant-numeric:tabular-nums
}
.sizebtns b:hover{background:rgba(0,0,0,.68)}
/* the ✕ needs a real target — a near-miss used to open the thing instead */
.sizebtns b[data-delDrawer]{padding:4px 9px;font-size:12px;line-height:1}
.sizebtns::before{content:"";position:absolute;inset:-8px;pointer-events:auto}

/* selection, Finder-style */
.drawer.selected{outline:2.5px solid var(--brass);outline-offset:2px}
.drawer.selected::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--brass) 14%,transparent);pointer-events:none}
.ctxhead{padding:7px 12px 5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* A magic drawer should read as not-quite-solid: a dashed inner rule that
   drifts, and a faint sheen. It collects rather than holds, and looks it. */
.drawer.magicdrawer{
  background-image:
    radial-gradient(circle at 18% 26%, rgba(255,255,255,.30) 0 1.1px, transparent 1.6px),
    radial-gradient(circle at 72% 18%, rgba(255,255,255,.22) 0 .9px, transparent 1.4px),
    radial-gradient(circle at 46% 74%, rgba(255,255,255,.26) 0 1px,  transparent 1.5px),
    radial-gradient(circle at 86% 62%, rgba(255,255,255,.18) 0 .8px, transparent 1.3px),
    radial-gradient(circle at 30% 52%, rgba(255,255,255,.20) 0 .8px, transparent 1.3px);
  animation:twinkle 6s ease-in-out infinite;
}
@keyframes twinkle{ 0%,100%{background-size:100% 100%} 50%{background-size:104% 104%} }
.clcount{margin-left:auto;font-size:11px;color:var(--dink-3);font-variant-numeric:tabular-nums}
/* checklist: the contents, tickable, on the front of the tile */
.clist{display:flex;flex-direction:column;gap:2px;overflow:hidden;height:100%}
.cline{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--dink-2);
  cursor:pointer;padding:1px 0;overflow-wrap:anywhere;line-height:1.35}
.cline:hover{color:var(--dink)}
.cline.done{color:var(--dink-3);text-decoration:line-through}
.clbox{width:13px;height:13px;flex:0 0 auto;margin-top:1px;border:1.5px solid var(--dink-3);border-radius:2px;
  display:grid;place-items:center;color:var(--dink)}
.cline.done .clbox{background:rgba(255,255,255,.22);border-color:transparent}
.clempty{font-size:11.5px;color:var(--dink-3)}
/* calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;height:100%;align-content:start}
.calgrid .dow{font-size:9px;color:var(--dink-3);text-align:center;font-style:normal}
.calgrid .pad{display:block}
.cday{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  font-style:normal;font-size:10px;color:var(--dink-2);border-radius:2px;padding:1px 0;min-height:0}
.cday.today{background:rgba(255,255,255,.20);color:var(--dink)}
.cday.has{color:var(--dink)}
.cday u{text-decoration:none;font-size:8px;line-height:1;letter-spacing:-1px}
.magicmark{color:var(--dink-2);display:inline-flex;align-items:center;margin-left:2px}
.magicmark.big{color:var(--brass);vertical-align:middle}
@media (prefers-reduced-motion:reduce){
  .drawer.magicdrawer,.drawer.magicdrawer::before{animation:none}
}

/* Scroll view — a drawer read top to bottom, nothing truncated */
.listgrid{display:flex;flex-direction:column;gap:6px;max-width:900px}
.drawer.listband{
  position:relative;min-height:46px;padding:8px 14px;justify-content:center;
  box-shadow:none;cursor:pointer;
}
.drawer.listband:hover{filter:brightness(1.05)}
.drawer.listband .dtop{gap:10px;align-items:center;width:100%}
.drawer.listband .dname{font-size:14px;-webkit-line-clamp:1;white-space:nowrap;flex:0 0 auto;max-width:40%}
.drawer.listband .bandsnip{font-size:12px;color:var(--dink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.drawer.listband .pull{margin-left:auto;width:14px;height:14px}
.drawer.otile.listband .bandsnip{color:var(--ink-3)}
.bandimg{width:34px;height:34px;object-fit:cover;border-radius:3px;flex:0 0 auto}
.scrollview{max-width:720px}
.scrollentry{padding:16px 0;border-bottom:1px solid var(--rule-2)}
.scrollentry header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.scrollentry h3{font-family:var(--serif);font-size:19px;font-weight:600;margin:0}
.scrollentry h3.done{text-decoration:line-through;color:var(--ink-3)}
.scrollentry .prose{font-size:14.5px;line-height:1.65}
.scrollimg{max-width:100%;border-radius:var(--radius);margin:8px 0;display:block}
.readtitle{font-family:var(--serif);font-size:30px;font-weight:600;margin:0 0 10px;letter-spacing:.005em}
.prose.read{font-size:15.5px;line-height:1.7;max-width:62ch}
.drawer.addnew{background:none;border:1.5px dashed var(--rule);box-shadow:none;align-items:center;justify-content:center;color:var(--ink-3);--dink:var(--ink-3)}
.drawer.addnew:hover{border-color:var(--brass);color:var(--brass);filter:none}

/* An object sitting directly on a grid. Same tile, no drawer front — it reads
   as a card on the desk rather than something you open. */
.drawer.otile{
  background:var(--paper-2);border-color:var(--rule);
  --dink:var(--ink);--dink-2:var(--ink-2);--dink-3:var(--ink-3);
}
/* a coloured edge is a choice, not a default */
.drawer.otile.edge{border-left:3px solid var(--c)}
.drawer.otile:hover{filter:none;box-shadow:var(--shadow-lg)}
.drawer.otile .dname{font-family:var(--sans);font-size:13.5px;font-weight:600;white-space:normal;
  overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.drawer.otile .dname.done{text-decoration:line-through;color:var(--ink-3)}
.drawer.otile .dtop{align-items:flex-start;gap:8px}
.tiletext{font-size:11.5px;color:var(--ink-3);line-height:1.45;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.tilecheck{flex:0 0 auto;margin-top:1px}
/* a button object fills its tile; the shape is its own setting */
.drawer.btntile{padding:0;background:none;border:0;box-shadow:none;align-items:stretch;justify-content:stretch}
.drawer.btntile .btnface{
  margin:8%;width:84%;height:84%;background:var(--c);border-radius:inherit;
  display:grid;place-items:center;
  border:1px solid rgba(0,0,0,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),
             inset 0 -2px 0 rgba(0,0,0,.22),
             0 2px 0 rgba(0,0,0,.28), var(--shadow);
  transition:transform .08s, box-shadow .08s;
}
.drawer.btntile:active .btnface{
  transform:translateY(2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.20);
}
.drawer.btntile .btnface{font-size:14px;font-weight:600;color:#F8F3E6;text-align:center;
  padding:8px 12px;line-height:1.25;overflow-wrap:anywhere}
.drawer.btntile:hover{filter:brightness(1.09)}
.drawer.btntile:active{filter:brightness(.94)}
.drawer.btntile.bs-round{border-radius:50%}
.drawer.btntile.bs-rounded{border-radius:14px}
.drawer.btntile.bs-square{border-radius:0}
.tilestars{font-size:12px;color:var(--dink);letter-spacing:1px;margin-top:2px}
.tilestars span{opacity:.32}
.counter{display:inline-flex;align-items:center;gap:10px}
.counter button{width:26px;height:26px;border:1px solid var(--rule);border-radius:var(--radius);font-size:15px;color:var(--ink-2)}
.counter b{font-variant-numeric:tabular-nums;min-width:24px;text-align:center}
.stars{display:flex;gap:3px}
.stars button{color:var(--ink-3)}
.stars button.on{color:var(--brass)}
/* priority shows as a stripe rather than a word */
.drawer.prio-high{box-shadow:inset 4px 0 0 #C0563F}
.drawer.prio-mid{box-shadow:inset 4px 0 0 var(--brass)}
.drawer.prio-low{box-shadow:inset 4px 0 0 var(--ink-3)}
.tilemeta{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---- what each kind looks like on the board ---------------------------- */

/* A note is a torn scrap of parchment: no binding, and a chip out of one edge */
.drawer.otile.sh-note,.drawer.otile.sh-note,
.drawer.otile.sh-note,.drawer.otile.sh-plaque{
  border-left:1px solid var(--rule);
  background:var(--paper-2);
  clip-path:polygon(0 0, 100% 0, 100% 62%, 96.5% 68%, 100% 74%, 100% 100%,
                    0 100%, 0 34%, 2.5% 28%, 0 22%);
}
/* ---- one silhouette per kind ------------------------------------------ */

/* An idea has a folded corner, like a page turned down to mark it */
.drawer.otile.sh-idea{
  clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
  background:var(--paper-2);border-left:3px solid var(--c);
}
.drawer.otile.sh-idea::after{
  content:"";position:absolute;top:0;right:0;width:18px;height:18px;
  background:color-mix(in srgb, var(--c) 34%, var(--paper-3));
  clip-path:polygon(0 0, 100% 100%, 0 100%);
}
/* A question is a speech bubble, with a tail */
.drawer.otile.sh-bubble{
  border-radius:12px 12px 12px 2px;background:var(--paper-2);
}
.drawer.otile.sh-bubble{border-left:1px solid var(--rule);clip-path:none}
.drawer.otile.sh-bubble::after{
  content:"";position:absolute;left:14px;bottom:-10px;width:16px;height:12px;
  background:var(--paper-2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  clip-path:polygon(100% 0, 100% 100%, 0 0);
}
/* A quote: big opening mark, hanging indent, set in the serif */
.drawer.quotetile{
  background:var(--paper-2);border:0;border-left:4px double var(--c);
  padding:12px 14px 10px 16px;justify-content:center;overflow:hidden;
}
.quotetile .qmark{position:absolute;left:6px;top:-10px;font-family:var(--serif);
  font-size:54px;color:var(--c);opacity:.28;line-height:1}
.quotetile .qbody{font-family:var(--serif);font-size:14.5px;line-height:1.45;
  font-style:italic;color:var(--ink);overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
/* A counter is a number with a caption */
.drawer.cnttile{
  background:var(--c);align-items:center;justify-content:center;gap:4px;text-align:center;padding:8px;
  border-radius:10px;border-color:transparent;
}
.cntnum{font-family:var(--serif);font-size:clamp(30px,52cqw,180px);line-height:1;font-weight:600;
  color:#F8F3E6;font-variant-numeric:tabular-nums;cursor:pointer}
.cntlabel{font-size:clamp(10px,5cqw,15px);color:rgba(248,243,230,.82);overflow-wrap:anywhere;line-height:1.2;order:-1}
.drawer.cnttile{container-type:inline-size}
/* A character is a portrait with a name plate */
.drawer.chartile{padding:0;overflow:hidden;background:var(--paper-2);align-items:stretch}
.charface{flex:1;min-height:0;display:grid;place-items:center;background:var(--paper-3);color:var(--ink-3)}
.charface img{width:100%;height:100%;object-fit:cover;display:block}
.charname{padding:6px 8px;font-size:12px;font-weight:600;text-align:center;
  background:var(--c);color:#F8F3E6;overflow-wrap:anywhere}
/* A script is a punched page in a typewriter face */
.drawer.otile.sh-page,.drawer.otile.sh-page{
  background:var(--paper-2);padding-left:22px;border-left:0;clip-path:none;
}
.drawer.otile.sh-page::after,.drawer.otile.sh-page::after{
  content:"";position:absolute;left:8px;top:12px;bottom:12px;width:6px;
  background-image:radial-gradient(circle at 50% 50%, var(--paper) 0 2.6px, transparent 3px);
  background-size:6px 26px;opacity:.9;
}
.drawer.otile.sh-page .tiletext,.drawer.otile.sh-page .tiletext{font-family:var(--mono);font-size:10.5px}
/* moodboard */
.drawer.mbtile{padding:0;overflow:hidden;background:var(--paper-3)}
.mbwall{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.mbwall i{background-size:cover;background-position:center;border-radius:2px;display:block}
.mbname{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;font-size:12px;font-weight:600;
  color:#F8F3E6;background:rgba(0,0,0,.5);text-align:left}
/* a task is a sliver with a point on the right, like a flag or a tab */
.drawer.otile.sh-sliver{
  clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%);
  padding-right:20px;
}
.drawer.otile.sh-sliver .dbody,.drawer.otile.sh-sliver .dfoot{display:none}
.drawer.otile.sh-sliver .dtop{height:100%;align-items:center}
.drawer.otile.sh-sliver .dname{-webkit-line-clamp:2;font-size:13px;white-space:normal;overflow-wrap:anywhere}

/* ---- drawer fronts: borders and knobs -------------------------------- */
/* Five borders, in the spirit of a Victorian chest: a bevelled panel, a
   beaded edge, a double rule, a recessed cove, and plain. */
.drawer.dtile{ border-width:1px }
.drawer.dtile.bd-panel{
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.20),
             inset 0 0 0 5px rgba(0,0,0,.16),
             inset 0 0 0 6px rgba(255,255,255,.12), var(--shadow);
}
.drawer.dtile.bd-heavy{
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.20),
             inset 0 0 0 10px rgba(0,0,0,.16),
             inset 0 0 0 12px rgba(255,255,255,.12), var(--shadow);
}
.drawer.dtile.bd-bar{
  box-shadow:inset 0 0 0 6px rgba(0,0,0,.16), var(--shadow);
}
.drawer.dtile.bd-plain{ box-shadow:var(--shadow) }
.drawer.dtile.bd-none{ box-shadow:none;border-color:transparent }

/* Six knobs. The default is half-transparent white; the colour and shape are
   both set in the drawer's settings. */
.drawer.dtile{container-type:size}
.pull{
  width:clamp(18px, min(20cqw, 26cqh), 84px);height:clamp(18px, min(20cqw, 26cqh), 84px);flex:0 0 auto;
  background:var(--knob, color-mix(in srgb, var(--c) 62%, #fff));
  opacity:.76;transition:opacity .18s;border-radius:50%;
}
.pull.kn-round{border-radius:50%}
.pull.kn-diamond{border-radius:3px;transform:rotate(45deg)}
.pull.kn-bar{width:clamp(30px,min(28cqw,60cqh),120px);height:clamp(8px,min(6cqw,9cqh),20px);border-radius:99px}
.pull.kn-ring{border-radius:50%;background:none;border:4px solid var(--knob,rgba(255,255,255,.5))}

.pull.kn-square{border-radius:3px}
.drawer:hover .pull{opacity:1}

/* A magic drawer is dotted, not dashed */
.drawer.magicdrawer{ border-style:dotted;border-width:2px;
  border-color:color-mix(in srgb, #fff 55%, transparent) }

/* A drawer front: a name and a pull, nothing else. What's inside is inside. */

.drawer.dtile .dname{white-space:normal;font-size:15px}
.drawer.dtile .dcount{align-self:flex-start}
.magicmark{color:var(--dink-2);display:inline-flex;align-items:center;margin-left:2px}

/* An image on the grid, cropped to its box like something pasted in place */
.drawer.imgtile{padding:0;overflow:hidden;background:none;border:0;border-left:0!important;box-shadow:none}
.drawer.imgtile.opaque{background:var(--paper-3)}
.tileimg{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.imgtile:not(.opaque) .tileimg{object-fit:contain}
.imgcap{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;font-size:11px;color:#F8F3E6;
  background:rgba(0,0,0,.45);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Bureau's own buttons, living on the desk */
.drawer.ctile{
  background:var(--paper-2);border-color:var(--rule);align-items:center;justify-content:center;
  gap:5px;--dink:var(--ink);color:var(--ink-2);
}
.drawer.ctile:hover{filter:none;border-color:var(--brass);color:var(--ink)}
.ctile .cico{color:var(--c);display:grid;place-items:center}
.ctile .clabel{font-size:11.5px;font-weight:600;letter-spacing:.01em}

/* ============================================================
   Object rows
   ============================================================ */
.section-h{display:flex;align-items:center;gap:8px;margin:22px 0 9px;}
.section-h h2{font-family:var(--serif);font-size:16px;font-weight:600;margin:0;letter-spacing:.01em}
.section-h .rule{flex:1;height:1px;background:var(--rule)}
.section-h .n{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.rows{display:flex;flex-direction:column;gap:5px}
.rowwrap{position:relative;border-radius:11px;overflow:hidden}
.rowwrap .swipebg{position:absolute;inset:0;opacity:0;transition:opacity .12s;z-index:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:600;color:#fff}
.rowwrap.swiping .swipebg{opacity:1}
.rowwrap .swipebg::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#3E8E5A 50%,#C0563F 50%);}
.rowwrap .swipebg span{position:relative;z-index:1}
.row{
  position:relative;display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:11px;
  background:var(--paper-2);border:1px solid var(--rule);cursor:pointer;z-index:1;
  transition:border-color .15s,background .15s,transform .06s;
  touch-action:pan-y;
}
.row:hover{border-color:color-mix(in srgb,var(--k) 40%, var(--rule));background:color-mix(in srgb,var(--k) 4%, var(--paper-2))}
.row.dragging{opacity:.4}
.row.sel{border-color:var(--brass);box-shadow:0 0 0 2px color-mix(in srgb,var(--brass) 25%,transparent)}
.check{
  width:19px;height:19px;flex:0 0 auto;border-radius:3px;border:1.8px solid var(--ink-3);margin-top:1px;
  display:grid;place-items:center;transition:.15s;
}
.check:hover{border-color:var(--k)}
.check.on{background:var(--k);border-color:var(--k);color:#fff}
.check svg{opacity:0;transform:scale(.5);transition:.15s}
.check.on svg{opacity:1;transform:scale(1)}
.kindmark{
  width:22px;height:22px;flex:0 0 auto;border-radius:7px;display:grid;place-items:center;margin-top:0px;
  background:color-mix(in srgb,var(--k) 17%, transparent);color:var(--k);
}
.row .body{flex:1;min-width:0}
.row .title{font-size:13.5px;font-weight:500;letter-spacing:.003em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .title{color:var(--ink-3);text-decoration:line-through}
.row .snip{font-size:12px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3);white-space:nowrap}
.mchip.k{color:var(--k);font-weight:600;letter-spacing:.02em;text-transform:lowercase}
.mchip.late{color:#C0563F;font-weight:600}
.mchip.tag{color:var(--ink-2);background:var(--paper-3);padding:1px 7px;border-radius:20px}
.rowacts{display:flex;gap:2px;opacity:0;transition:.15s;margin-left:4px}
.row:hover .rowacts{opacity:1}
.is-phone .rowacts{display:none}
.rowacts button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.rowacts button:hover{background:var(--paper-3);color:var(--ink)}
.grip{color:var(--ink-3);opacity:0;cursor:grab;display:grid;place-items:center;width:16px;align-self:center}
.row:hover .grip{opacity:.55}
.dropline{height:2px;background:var(--brass);border-radius:2px;margin:2px 0}

/* card grid view */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
.is-phone .cards{grid-template-columns:repeat(2,1fr);gap:9px}
.ocard{
  border-radius:12px;background:var(--paper-2);border:1px solid var(--rule);padding:12px;text-align:left;
  min-height:118px;display:flex;flex-direction:column;gap:6px;transition:.16s;box-shadow:var(--shadow);cursor:pointer;
  border-top:3px solid var(--k);
}
.ocard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.ocard .t{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.25}
.ocard .s{font-size:11.5px;color:var(--ink-3);line-height:1.45;flex:1;overflow:hidden}
.ocard .media{height:64px;border-radius:8px;background:linear-gradient(135deg,color-mix(in srgb,var(--k) 50%,transparent),color-mix(in srgb,var(--k) 14%,transparent));display:grid;place-items:center;color:#fff}

/* ============================================================
   Object detail
   ============================================================ */
/* On a Mac the sheet takes the right half and leaves the desk visible on the
   left, so you can see where the thing you're editing actually lives. */
.sheet{
  position:absolute;inset:0;z-index:40;padding-top:env(safe-area-inset-top);background:var(--paper);display:flex;flex-direction:column;
  transform:translateY(14px);opacity:0;pointer-events:none;transition:.24s cubic-bezier(.2,.9,.3,1);
}
.is-desk .sheet{
  left:auto;right:0;width:50vw;min-width:420px;
  border-left:1px solid var(--rule);box-shadow:var(--shadow-lg);
  transform:translateX(18px);
}
.is-desk .sheet.open{transform:none}
/* the half the sheet doesn't cover, dimmed so the focused object reads */
.sheetveil{position:absolute;inset:0;right:50vw;z-index:39;background:rgba(0,0,0,.16);
  opacity:0;pointer-events:none;transition:opacity .24s}
.is-desk .sheetveil.on{opacity:1;pointer-events:auto}
/* the tile being edited, centred in the left half */
.drawer.focused{outline:2.5px solid var(--brass);outline-offset:3px;z-index:45}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 20px 10px;border-bottom:1px solid var(--rule-2)}
.is-phone .sheet-h{padding:14px}
.sheet-b{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 140px}
.is-phone .sheet-b{padding:16px 14px 140px}
.detail-wrap{max-width:720px;margin:0 auto}
.kindbadge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;background:color-mix(in srgb,var(--k) 15%,transparent);color:var(--k);
}
.titlefield{
  width:100%;border:0;background:none;outline:none;font-family:var(--serif);font-size:30px;font-weight:600;
  line-height:1.18;margin:12px 0 6px;letter-spacing:-.005em;resize:none;overflow:hidden;
}
.is-phone .titlefield{font-size:25px}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:14px 0 6px}
.field{background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;padding:8px 11px}
.field label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.field input,.field select{width:100%;border:0;background:none;outline:none;font-size:13px;font-weight:500}
.field select{cursor:pointer}
.editor{
  width:100%;min-height:260px;border:0;background:none;outline:none;resize:none;font-family:var(--mono);
  font-size:13px;line-height:1.75;color:var(--ink-2);padding:8px 0;
}
.prose{font-size:15px;line-height:1.72;padding:8px 0}
.prose h1,.prose h2,.prose h3{font-family:var(--serif);letter-spacing:.005em;margin:1.3em 0 .45em;line-height:1.25}
.prose h1{font-size:1.55em}.prose h2{font-size:1.28em}.prose h3{font-size:1.1em}
.prose p{margin:0 0 .9em}
.prose ul,.prose ol{margin:0 0 .9em;padding-left:1.35em}
.prose li{margin:.22em 0}
.prose blockquote{margin:0 0 .9em;padding:2px 0 2px 15px;border-left:3px solid var(--brass);color:var(--ink-2);font-style:italic}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--paper-3);padding:1.5px 5px;border-radius:5px}
.prose hr{border:0;border-top:1px solid var(--rule);margin:1.6em 0}
.prose a{color:var(--brass)}
.prose .tick{list-style:none;margin-left:-1.2em}
.prose .tick b{display:inline-block;width:15px;height:15px;border:1.5px solid var(--ink-3);border-radius:4px;vertical-align:-2px;margin-right:7px}
.prose .tick.on b{background:var(--brass);border-color:var(--brass)}
.prose .tick.on{color:var(--ink-3);text-decoration:line-through}
.mediablock{
  border-radius:12px;overflow:hidden;border:1px solid var(--rule);margin:14px 0;background:var(--paper-2);
}
.mediablock .art{height:170px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,color-mix(in srgb,var(--k) 62%,transparent),color-mix(in srgb,var(--k) 20%,transparent))}
.mediablock .cap{padding:8px 12px;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.tagrow .add{font-size:11.5px;color:var(--ink-3);border:1px dashed var(--rule);padding:3px 9px;border-radius:20px}
.tagrow .add:hover{color:var(--brass);border-color:var(--brass)}
.subtle-btn{font-size:12px;color:var(--ink-3);padding:5px 10px;border-radius:8px;border:1px solid var(--rule)}
.subtle-btn:hover{color:var(--ink);border-color:var(--brass)}

/* ============================================================
   Habits / goals / calendar
   ============================================================ */
.habit{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--paper-2);border:1px solid var(--rule)}
.habit .nm{font-weight:600;font-size:13.5px}
.habit .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.dots{display:flex;gap:3px;margin-left:auto;align-items:center}
.dots i{width:11px;height:18px;border-radius:3px;background:var(--paper-3);display:block;border:1px solid var(--rule-2)}
.dots i.on{background:var(--k);border-color:transparent}
.dots i.today{outline:1.5px solid var(--brass);outline-offset:1.5px}
.is-phone .dots i:nth-child(n+11){display:none}
.is-phone .habit{flex-wrap:wrap;gap:9px}
.is-phone .habit .dots{margin-left:0;order:4;flex:1}
.is-phone .habit>div:nth-child(2){flex:1;min-width:0}
.is-phone .streak{order:5}
.streak{font-family:var(--serif);font-size:19px;font-weight:600;min-width:34px;text-align:right;color:var(--k)}
.tick-btn{width:34px;height:34px;border-radius:11px;border:1.6px solid var(--ink-3);display:grid;place-items:center;flex:0 0 auto;transition:.15s}
.tick-btn.on{background:var(--k);border-color:var(--k);color:#fff}

.goal{padding:14px;border-radius:13px;background:var(--paper-2);border:1px solid var(--rule);border-left:3px solid var(--k)}
.goal .gh{display:flex;align-items:baseline;gap:9px}
.goal .gt{font-family:var(--serif);font-size:17px;font-weight:600}
.goal .gd{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.bar{height:7px;border-radius:6px;background:var(--paper-3);overflow:hidden;margin:11px 0 4px;border:1px solid var(--rule-2)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--k),color-mix(in srgb,var(--k) 55%,var(--brass)));border-radius:6px;transition:width .5s cubic-bezier(.2,.9,.3,1)}
.miles{margin-top:11px;display:flex;flex-direction:column;gap:2px}
.mile{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.mile:hover{background:var(--paper-3)}
.mile.done{color:var(--ink-3)}
.mile.done .mt{text-decoration:line-through}
.mile .md{margin-left:auto;font-size:11px;color:var(--ink-3)}

.weekstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.wday{
  flex:0 0 auto;width:52px;padding:8px 0;border-radius:11px;text-align:center;border:1px solid var(--rule);
  background:var(--paper-2);cursor:pointer;transition:.15s
}
.wday:hover{border-color:var(--brass)}
.wday.on{background:var(--ink);color:var(--paper);border-color:transparent}
html[data-theme="walnut"] .wday.on{background:var(--brass);color:#1c1509}
.wday .d{font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.62}
.wday .n{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2}
.wday .pips{display:flex;gap:2px;justify-content:center;height:5px;margin-top:2px}
.wday .pips i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--rule)}
.tl-item{position:relative;padding:7px 0}
.tl-item::before{content:"";position:absolute;left:-18px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--k);box-shadow:0 0 0 3px var(--paper)}
.tl-date{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* ============================================================
   Overlays: new-object palette, command bar, toast, menu
   ============================================================ */
.scrim{position:absolute;inset:0;z-index:70;background:color-mix(in srgb,var(--ink) 38%,transparent);
  backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;justify-content:center;padding:22px}
.scrim.open{opacity:1;pointer-events:auto}
.modal{
  width:min(560px,100%);max-height:100%;overflow:hidden;background:var(--paper-2);border-radius:18px;border:1px solid var(--rule);
  box-shadow:var(--shadow-lg);transform:translateY(12px) scale(.98);transition:.24s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column
}
.scrim.open .modal{transform:none}
.modal-h{padding:15px 18px 11px;border-bottom:1px solid var(--rule-2)}
.modal-h .t{font-family:var(--serif);font-size:17px;font-weight:600}
.modal-h .s{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.modal-b{padding:14px 16px 18px;overflow-y:auto}
.kindgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.is-phone .kindgrid{grid-template-columns:repeat(3,1fr);gap:7px}
.kindtile{
  border-radius:12px;border:1px solid var(--rule);background:var(--paper);padding:11px 9px;display:flex;flex-direction:column;
  align-items:flex-start;gap:7px;transition:.15s;text-align:left;cursor:pointer
}
.kindtile:hover{border-color:var(--k);background:color-mix(in srgb,var(--k) 7%,var(--paper));transform:translateY(-2px)}
.kindtile .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k)}
.kindtile .nm{font-size:12.5px;font-weight:600}
.kindtile .ds{font-size:10.5px;color:var(--ink-3);line-height:1.35}
.kindtile .kbd{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);border:1px solid var(--rule);border-radius:4px;padding:0 4px;margin-left:auto}

.cmd{width:min(560px,100%);align-self:flex-start;margin-top:8vh}
.cmdinput{width:100%;border:0;background:none;outline:none;font-size:17px;padding:16px 18px;font-family:var(--serif)}
.cmdlist{max-height:46vh;overflow-y:auto;border-top:1px solid var(--rule-2);padding:6px}
.cmdrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px}
.cmdrow:hover,.cmdrow.on{background:var(--paper-3)}
.cmdrow .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k);flex:0 0 auto}
.cmdrow .sub{margin-left:auto;font-size:11px;color:var(--ink-3)}

.fab{
  position:absolute;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:17px;z-index:35;
  background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:var(--shadow-lg);transition:.18s
}
html[data-theme="walnut"] .fab{background:var(--brass);color:#1c1509}
.fab:active{transform:scale(.94)}
.is-desk .fab{display:none}

.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);z-index:36;display:flex;align-items:center;
  border-top:1px solid var(--rule);background:var(--paper-2);
}
.is-desk .tabbar{display:none}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:9.5px;font-weight:600;letter-spacing:.02em}
.tabbar button.on{color:var(--brass)}

.toast{
  position:absolute;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:80;
  background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:12px;font-size:12.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:.22s;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;white-space:nowrap
}
html[data-theme="walnut"] .toast{background:var(--paper-3);color:var(--ink)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast u{cursor:pointer;color:var(--brass-2);text-decoration:none;font-weight:700}

.ctxmenu{
  position:absolute;z-index:90;min-width:184px;background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:5px;display:none;
}
.ctxmenu.open{display:block}
.ctxmenu button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:8px;font-size:12.5px;text-align:left}
.ctxmenu button:hover{background:var(--paper-3)}
.ctxmenu .div{height:1px;background:var(--rule-2);margin:4px 2px}
.ctxmenu .danger{color:#C0563F}

.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.empty .big{font-family:var(--serif);font-size:19px;color:var(--ink-2);margin-bottom:5px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-3)}


.is-phone .topbar .crumbs{display:none}
.is-phone .pill .lbl{display:none}
.is-desk .only-phone{display:none}
.is-phone .topbar h1{font-size:21px;line-height:1.2}
.is-phone .topbar .sub{font-size:11.5px}
.reordering .row{touch-action:none;cursor:grab}
.reordering .grip{opacity:.6}
.quickadd{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:11px;border:1.5px dashed var(--rule);
  background:color-mix(in srgb,var(--paper-2) 60%,transparent);margin-bottom:9px;transition:.15s}
.quickadd:focus-within{border-style:solid;border-color:var(--brass);background:var(--paper-2)}
.quickadd input{flex:1;border:0;background:none;outline:none;font-size:13.5px}
.quickadd input::placeholder{color:var(--ink-3)}
.quickadd .k{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.filterbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;align-items:center}
.filterbar::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:500;border:1px solid var(--rule);
  background:var(--paper-2);color:var(--ink-2);white-space:nowrap;transition:.14s;cursor:pointer}
.fchip:hover{border-color:var(--k,var(--brass));color:var(--ink)}
.fchip.on{background:color-mix(in srgb,var(--k,var(--brass)) 18%,transparent);border-color:transparent;color:var(--ink);font-weight:600}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin-bottom:2px}
.crumbs b{color:var(--ink-2);font-weight:500}
.statline{display:flex;gap:16px;flex-wrap:wrap;margin:2px 0 4px}
.statline .s{font-size:11.5px;color:var(--ink-3)}
.statline .s b{font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:600;margin-right:4px}
.blocks{display:flex;flex-direction:column;gap:11px}
.mini{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:6px 2px}
.mini .dot{width:6px;height:6px;border-radius:50%;background:var(--k);flex:0 0 auto}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
.pickgrid button{height:38px;border-radius:var(--radius);border:1px solid var(--rule);font-size:11.5px;font-weight:600}
.pickgrid button.on{outline:2px solid var(--brass);outline-offset:1px}
/* colour families: small solid squares, one row each */
.pickgrid.sw{grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-bottom:6px}
.pickgrid.sw button{height:30px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
.custcol{display:inline-flex;align-items:center;gap:8px;margin-top:6px;cursor:pointer;
  font-size:12.5px;line-height:1;color:var(--ink-2);padding:6px 10px;
  border:1px solid var(--rule);border-radius:var(--radius);vertical-align:middle}
.custcol span{display:inline-block;line-height:1}
.custcol:hover{border-color:var(--brass);color:var(--ink)}
.custcol input[type=color]{width:26px;height:22px;padding:0;margin:0;flex:0 0 auto;display:block;
  border:1px solid var(--rule);border-radius:3px;background:none;cursor:pointer}
.rowwrap.swiping .row{transition:none}
.rowwrap .row{will-change:transform}
</style>

const isContainer = o => !!o && has(o,'container');
/* A face is how a container draws itself on its parent's board. A layout is
   how it arranges its children once opened. They used to be one property,
   which meant a checklist could not also be sorted when you opened it. */
const FACES = {front:'Drawer front', checklist:'Checklist', calendar:'Calendar',

const faceOf = o => (o && o.face) || K(o&&o.kind).face || 'front';

/* How a non-container object draws itself. This used to be read off the type's
   *name* in both the renderer and the stylesheet, which is exactly what
   CLAUDE.md forbids — an invented type could never look like anything. It is a
   property now, defaulting to the type's, and settable per object. */
const SHAPES = {
  card:'Card', habit:'Streak', goal:'Progress bar', dream:'Dashed', image:'Picture', note:'Torn note', idea:'Folded corner', bubble:'Speech bubble',
  page:'Punched page', index:'Index card', spine:'Book spine', portrait:'Portrait',
  ticket:'Ticket', plaque:'Plaque', tally:'Tally', quote:'Quotation',
  verse:'Verse', sliver:'Sliver', press:'Press', band:'Band'
};
const shapeOf = o => (o && o.shape) || K(o&&o.kind).shape || 'card';
const containers = ()=> S.objects.filter(isContainer);

/* A drawer holds. A magic drawer collects. Nothing does both.
   An object lives in exactly one drawer — its `parent` — and that is the only
   thing an ordinary drawer shows. A magic drawer ignores parentage entirely and
   shows whatever matches its rule, which is the one way an object appears in
   more than one place at once. */
function inContainer(c,o){
  if(!c || o.id===c.id) return false;
  if(has(c,'magic')){
    const f=c.filter||{};
    if(f.done) return !!o.done;        // the archive
    if(o.done) return false;           // finished things leave everywhere else
    if(isContainer(o)) return false;   // magic drawers collect objects, not drawers
    if(f.due==='today') return !!o.due && D.parse(o.due)<=D.today();
    if(f.tag && !(o.tags||[]).includes(f.tag)) return false;
    if(f.kinds && f.kinds.length && !f.kinds.includes(o.kind)) return false;
    if(f.rule && !matchRule(o, f.rule)) return false;
    return !!(f.tag || (f.kinds&&f.kinds.length) || f.rule);
  }
  // Completed things leave a drawer (decision 2) — but not a checklist, where
  // seeing what you've ticked is the entire point of the thing.
  if(o.done && faceOf(c)!=='checklist') return false;
  return o.parent===c.id;              // an ordinary drawer holds what is filed in it
}
/* One clause: a field, a comparison, a value. Everything a magic drawer can
   ask about an object goes through here. */
const OPS = {is:'is', not:'is not', has:'contains', gt:'more than', lt:'less than', any:'has any'};
function matchRule(o, r){
  if(!r || !r.f) return true;
  const fld=fieldOf(r.f); if(!fld) return true;
  if(!attrsOf(o).includes(r.f)) return false;      // it hasn't got that field
  const v=valOf(o, fld.key);
  switch(r.op){
    case 'any':  return Array.isArray(v) ? v.length>0 : v!=null && v!==false;
    case 'is':   return String(v??'')===String(r.v??'');
    case 'not':  return String(v??'')!==String(r.v??'');
    case 'has':  return Array.isArray(v) ? v.includes(r.v) : String(v??'').toLowerCase().includes(String(r.v??'').toLowerCase());
    case 'gt':   { const n=numOf(o,fld.key); return n!=null && n>parseFloat(r.v); }
    case 'lt':   { const n=numOf(o,fld.key); return n!=null && n<parseFloat(r.v); }
    default: return true;
  }
}

/* A container can total something across its children — Notion's rollup, kept
   to the handful that answer a real question. */
const ROLLS = {count:'How many', sum:'Total', avg:'Average', min:'Lowest', max:'Highest', done:'Done'};
function rollup(c){
  if(!has(c,'total') && !(c.roll&&c.roll.fn)) return null;
  const r=c.roll; if(!r || !r.fn) return null;
  const kids=childrenOf(c);
  if(r.fn==='count') return String(kids.length);
  if(r.fn==='done'){ const d=kids.filter(x=>x.done).length; return `${d}/${kids.length}`; }
  const fld=fieldOf(r.f); if(!fld) return null;
  const nums=kids.map(x=>numOf(x, fld.key)).filter(n=>n!=null);
  if(!nums.length) return null;
  const money = fld.type==='money';
  const n = r.fn==='sum' ? nums.reduce((a,b)=>a+b,0)
          : r.fn==='avg' ? nums.reduce((a,b)=>a+b,0)/nums.length
          : r.fn==='min' ? Math.min(...nums) : Math.max(...nums);
  const out = Math.round(n*100)/100;
  return money ? (String(kids.find(x=>valOf(x,fld.key))?.[fld.key]||'').replace(/[\d.,\s-]/g,'')||'') + out : String(out);
}

/* Children, in whatever order the drawer is sorted by. `sort` is null for the
   manual order you arranged yourself, which is the default. */
const SORTS = {
  made:   ['Date made, newest',    (a,b)=>(b.created||'').localeCompare(a.created||'')],
  madeup: ['Date made, oldest',    (a,b)=>(a.created||'').localeCompare(b.created||'')],
  edited: ['Date modified',        (a,b)=>(b.edited||b.created||'').localeCompare(a.edited||a.created||'')],
  az:     ['Alphabetical, A–Z',    (a,b)=>(a.title||'').localeCompare(b.title||'')],
  za:     ['Alphabetical, Z–A',    (a,b)=>(b.title||'').localeCompare(a.title||'')]
};
function childrenOf(c){
  const list = S.objects.filter(o=>inContainer(c,o));
  const s = c && c.sort && SORTS[c.sort];
  return list.sort(s ? s[1] : (a,b)=>(a.ord||0)-(b.ord||0));
}
// Guard against a container being dragged inside itself — with recursion this
// is a real way to lose a subtree, not a theoretical one.
function isAncestor(maybeAncestor, o){
  let p = o && o.parent, n = 0;
  while(p && p!==ROOT && n++ < 100){
    if(p===maybeAncestor) return true;
    const up = byId(p); p = up && up.parent;
  }
  return false;
}
// Breadcrumb chain from the desk down to this container.
/* Relations point both ways without being stored twice: A lists B, and B's
   backlinks are found by asking who points at B. */
const relatedTo = o => (o&&o.rel||[]).map(byId).filter(Boolean);
const backlinksTo = id => S.objects.filter(o=>(o.rel||[]).includes(id));
function relate(aId,bId){
  const a=byId(aId); if(!a||aId===bId) return;
  a.rel=a.rel||[]; if(!a.rel.includes(bId)) a.rel.push(bId);
}
function unrelate(aId,bId){
  const a=byId(aId); if(!a||!a.rel) return;
  a.rel=a.rel.filter(x=>x!==bId);
}
function chainOf(id){
  const out=[]; let o=byId(id), n=0;
  while(o && n++ < 100){ out.unshift(o); o = o.parent&&o.parent!==ROOT ? byId(o.parent) : null; }
  return out;
}

/* ------------------------------------------------------------
   4b · the grid — one coordinate space per device
   ------------------------------------------------------------
   Drawers hold {x,y,w,h} in 1-based grid cells, per device. The grid does not
   flow: an empty cell stays empty, because position is meant to carry meaning.
   Two drawers may never occupy the same cell — a move or resize that would
   overlap is refused rather than shoving a neighbour out of the way, so nothing
   you arranged ever moves without you.                                        */
/* The grid is square: a cell is as tall as it is wide. Columns are fluid, so
   the row height is measured after layout by sizeGrid() and cached here —
   nothing may assume a fixed row height. Twice the columns of the first
   version, which is what makes the smallest object half the size it was. */
const GRID = {
  desk:  {cols:24, gap:0},
  phone: {cols:16, gap:0}
};
const CELL = {desk:40, phone:21};   // last measured; a sane guess until then
const gridOf = (device)=>{
  const d=device||dev();
  return {cols:GRID[d].cols, gap:GRID[d].gap, rowh:CELL[d]};
};
// Tolerate a drawer that predates x/y, or one hand-edited into nonsense.
function lay(d, device){
  const g=gridOf(device), b=d[device||dev()]||{};
  const w=clamp(b.w||2,1,g.cols), h=clamp(b.h||1,1,40);
  return {x:clamp(b.x||1,1,g.cols-w+1), y:Math.max(1,b.y||1), w, h};
}
const overlaps = (a,b)=> a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h;
/* Every check below is scoped to one container's grid. Collisions only matter
   between siblings — two objects in different drawers can share coordinates,
   because they are in different coordinate spaces. */
const hasBox = (o,dv)=> !!(o && o[dv] && o[dv].w);
function boxOk(box, id, device, parentId){
  const g=gridOf(device), dv=device||dev();
  if(box.x<1 || box.y<1 || box.w<1 || box.h<1 || box.x+box.w-1>g.cols) return false;
  // Only objects that have actually been placed can be collided with. Without
  // this, everything unplaced reads as sitting at 1,1 and blocks the corner.
  return !childrenOf(container(parentId||ROOT))
    .some(d=>d.id!==id && hasBox(d,dv) && overlaps(box, lay(d,device)));
}
// Lowest free spot in this container, scanning left-to-right then down.
function freeSpot(w,h,device,parentId){
  const g=gridOf(device);
  for(let y=1;y<200;y++) for(let x=1;x<=g.cols-w+1;x++){
    const box={x,y,w,h};
    if(boxOk(box,null,device,parentId)) return box;
  }
  return {x:1,y:1,w,h};
}
const gridRows = (device,parentId)=> childrenOf(container(parentId||ROOT))
  .reduce((m,d)=>{const b=lay(d,device);return Math.max(m,b.y+b.h-1)},0);
/* An object that has never been in a grid has no box. Give it one the first
   time it needs to be placed, rather than storing coordinates for everything. */
/* Each kind declares the size its objects start at — a task is a wide sliver,
   a drawer a big square. Editable per kind in the kind builder. */
const sizeOfKind = k => (K(k).size || [4,4]);
function ensureBox(o, device, parentId){
  const dv=device||dev();
  if(o[dv] && o[dv].w) return o[dv];
  const [w,h]=sizeOfKind(o.kind);
  o[dv] = freeSpot(w, h, dv, parentId||o.parent);
  return o[dv];
}

/* Which theme is actually showing right now. */
const themeNow = ()=> S.theme==='auto'
  ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'walnut' : 'paper')
  : S.theme;
/* Custom colours are stored per theme. They used to be single values written
   inline on <html>, which beat both theme blocks — so a background chosen in
   Paper stayed put when you switched to Walnut and the theme looked broken. */
function lookVal(key){
  const v=(S.look||{})[key];
  if(v && typeof v==='object') return v[themeNow()]||null;
  // a plain string is the old single-value shape: it was chosen under Paper,
  // so it applies there and nowhere else
  return (typeof v==='string' && themeNow()==='paper') ? v : null;
}
function setLookVal(key, val){
  const cur=(S.look||{})[key];
  const obj = (cur && typeof cur==='object') ? cur : {};
  if(cur && typeof cur==='string') obj.paper=cur;   // migrate on first write
  obj[themeNow()] = val || null;

}

/* Appearance: custom background, accent and drawer outline, applied as inline
   custom properties on <html> for whichever theme is showing. */
function applyLook(){
  const el=document.documentElement, L=S.look||defaultLook();
  L.bg=lookVal('bg'); L.accent=lookVal('accent'); L.line=lookVal('line'); L.board=lookVal('board');
  if(L.bg){

  } else ['--paper','--paper-2','--paper-3'].forEach(p=>el.style.removeProperty(p));
  el.style.setProperty('--board-alpha', L.boardAlpha==null?1:L.boardAlpha);
  if(L.board){ const [a,b]=String(L.board).split('|');

  else { el.style.removeProperty('--board-1'); el.style.removeProperty('--board-2'); }
  if(L.accent) el.style.setProperty('--brass', L.accent); else el.style.removeProperty('--brass');
  if(L.line) el.style.setProperty('--line', L.line); else el.style.removeProperty('--line');
}

/* Testing aid: drop something arbitrary onto the desk. Random kind, random
   size within what the grid allows, random colour — the point is to see how
   placement and the board cope with shapes nobody designed for. */
const WORDS='brass ledger cedar tide quarry lantern vellum thistle harbour ember slate poppy compass juniper marrow'.split(' ');
function randomThing(parentId){

  if(has(o,'date')&&Math.random()<0.6) o.due=dz(Math.floor(Math.random()*14)-3);

  if(isContainer(o)){ o.c=randomFront(); o.board=randomBoard();
    o.knob=pick(['round','diamond','bar','ring','square']);

  const g=gridOf(), dv=dev();
