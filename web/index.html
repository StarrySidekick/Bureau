<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Bureau</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDE7DB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191510" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bureau">
<meta name="description" content="A desk for everything you keep.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<style>
/* ============================================================
   BUREAU — design tokens
   ============================================================ */
:root{
  --paper:#E9E1CC;          /* parchment */
  --paper-2:#F2ECDB;
  --paper-3:#DCD2B9;
  --felt:#C7BA9B;
  --ink:#2A241C;
  --ink-2:#6B6152;
  --ink-3:#968B78;
  --rule:rgba(42,36,28,.16);
  --rule-2:rgba(42,36,28,.08);
  --brass:#A9793F;
  --brass-2:#D9B57C;
  --shadow:0 1px 2px rgba(42,36,28,.13),0 6px 18px -10px rgba(42,36,28,.28);
  --shadow-lg:0 2px 6px rgba(42,36,28,.16),0 22px 46px -20px rgba(42,36,28,.42);
  --radius:5px;             /* UI chrome — pills, chips, fields */
  --radius-d:3px;           /* drawers. A drawer front is not a rounded rect. */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="walnut"]{
  --paper:#191510;
  --paper-2:#231E18;
  --paper-3:#2E2820;
  --felt:#3A3228;
  --ink:#F0E8D9;
  --ink-2:#A29786;
  --ink-3:#7A7062;
  --rule:rgba(240,232,217,.14);
  --rule-2:rgba(240,232,217,.07);
  --brass:#D7AE72;
  --brass-2:#8A6A3C;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px -14px rgba(0,0,0,.8);
  --shadow-lg:0 2px 8px rgba(0,0,0,.55),0 40px 70px -28px rgba(0,0,0,.9);
}
/* Custom background/accent/outline are written as inline custom properties on
   <html> by applyLook() in section 4b — an inline property beats any selector
   here, so it overrides whichever theme is active without a third theme block. */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);overscroll-behavior:none;
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box;border:3px solid transparent}

/* ============================================================
   App shell
   ============================================================ */
#frame{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.seg{display:flex;background:var(--paper-3);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:4px 11px;border-radius:7px;font-size:12px;color:var(--ink-2);font-weight:500;transition:.15s}
.seg button[aria-pressed="true"]{background:var(--paper-2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.iconbtn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);transition:.15s}
.iconbtn:hover{background:var(--paper-3);color:var(--ink)}
.banner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;font-size:12px;
  background:color-mix(in srgb,var(--brass) 16%,transparent);color:var(--ink);margin-bottom:10px}
.banner button{margin-left:auto;font-weight:600;color:var(--brass);white-space:nowrap}

/* ============================================================
   App shell
   ============================================================ */
.app{position:absolute;inset:0;display:flex;overflow:hidden;padding-top:env(safe-area-inset-top)}
/* a drag must never turn into a text selection */
.dragging-ui,.dragging-ui *{user-select:none!important}
.navitem{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;
  color:var(--ink-2);font-size:13.5px;font-weight:500;transition:.12s;width:100%;text-align:left;
}
.navitem:hover{background:var(--paper-3);color:var(--ink)}
.navitem.on{background:color-mix(in srgb,var(--brass) 15%, transparent);color:var(--ink)}
.navitem .ico{width:17px;display:grid;place-items:center;color:var(--ink-3)}
.navitem.on .ico{color:var(--brass)}
.navitem .n{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tagchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;
  background:var(--paper-3);color:var(--ink-2);border:1px solid var(--rule-2)}
.tagchip.on{background:color-mix(in srgb,var(--brass) 22%, transparent);color:var(--ink);border-color:transparent}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 22px 10px;
}
.is-phone .topbar{padding:12px 16px 8px}
.topbar h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;letter-spacing:.005em}
.is-phone .topbar h1{font-size:23px}
.topbar .sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.topbar .grow{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12.5px;
  font-weight:500;background:var(--paper-2);border:1px solid var(--rule);color:var(--ink-2);transition:.15s;white-space:nowrap
}
.pill:hover{border-color:var(--brass);color:var(--ink)}
.pill.solid{background:var(--ink);color:var(--paper);border-color:transparent}
html[data-theme="walnut"] .pill.solid{background:var(--brass);color:#20180E}
.pill.solid:hover{opacity:.9}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 22px 120px}
.is-phone .scroll{padding:4px 14px 110px}
/* the desk has no toolbar — the grid is the page */
.deskscroll{padding:14px 14px 120px}
.is-phone .deskscroll{padding:10px 10px 110px}

/* ============================================================
   Drawers grid
   ============================================================ */
/* Explicit x/y placement: every drawer names its column and row, so the grid is
   a coordinate space, not a flow. No auto-flow — an empty cell stays empty. */
/* Square cells: --rowh is set from the measured column width by sizeGrid(). */
.grid{display:grid;gap:5px;align-content:start;position:relative}
.grid.g-desk{grid-template-columns:repeat(var(--cols,24),1fr);grid-auto-rows:var(--rowh,40px)}
.grid.g-phone{grid-template-columns:repeat(var(--cols,16),1fr);grid-auto-rows:var(--rowh,21px);gap:4px}

.drawer{
  position:relative;border-radius:var(--radius-d);overflow:hidden;text-align:left;
  background:var(--c);
  border:1px solid var(--line,rgba(0,0,0,.28));
  box-shadow:var(--shadow);
  transition:box-shadow .18s,filter .18s;
  display:flex;flex-direction:column;padding:11px 13px;isolation:isolate;
  /* Drawer fronts are solid mid-dark colours, so everything inside reads light. */
  --dink:#F8F3E6;--dink-2:rgba(248,243,230,.76);--dink-3:rgba(248,243,230,.54);
  color:var(--dink);
}
.drawer:hover{box-shadow:var(--shadow-lg);filter:brightness(1.07)}
.drawer:active{filter:brightness(.96)}
.drawer .dtop{display:flex;align-items:center;gap:7px}
.drawer .swatch{display:none}
.drawer .dname{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dink)}
.drawer .dcount{margin-left:auto;font-size:11px;color:var(--dink-2);font-variant-numeric:tabular-nums;
  background:rgba(0,0,0,.20);border:1px solid rgba(255,255,255,.14);padding:1px 7px;border-radius:20px}
.drawer .dbody{flex:1;min-height:0;margin-top:8px;overflow:hidden;position:relative}
.drawer .dfoot{
  margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:center;
}
.pull{
  width:54px;height:6px;border-radius:1px;flex:0 0 auto;
  background:var(--brass);
  box-shadow:0 1px 0 rgba(0,0,0,.28);
  opacity:.9;transition:opacity .18s;
}
.drawer:hover .pull{opacity:1}
.drawer.h1{padding:9px 12px}
.drawer.h1 .dbody{margin-top:5px}
.drawer.h1 .dfoot{padding-top:5px}
.drawer.h1 .pv-big{flex-direction:row;align-items:baseline;gap:7px}
.drawer.h1 .pv-big .num{font-size:24px}
.drawer.h1 .pv-big .cap{margin-top:0}
.drawer.h1 .pv-list .r:nth-child(n+3){display:none}
.drawer.h1 .pv-thumbs{grid-template-columns:repeat(6,1fr)}
.drawer.h1 .pv-stack .card:nth-child(n+2){display:none}
.drawer.h1 .pv-bars{gap:4px}

/* preview styles inside drawers — all on a solid colour, so light-on-dark */
.pv-list{display:flex;flex-direction:column;gap:4px}
.pv-list .r{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dink-2);white-space:nowrap;overflow:hidden;min-width:0}
.pv-list .r span.lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pv-list .r .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75;flex:0 0 auto}
.pv-list .r.done{color:var(--dink-3);text-decoration:line-through}
.pv-stack{position:relative;height:100%}
.pv-stack .card{
  position:absolute;left:0;right:0;height:30px;border-radius:2px;background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.13);padding:7px 9px;font-size:11.5px;
  color:var(--dink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  border-left:3px solid rgba(255,255,255,.4);
}
.pv-big{display:flex;flex-direction:column;justify-content:center;height:100%}
.pv-big .num{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600;letter-spacing:-.02em;color:var(--dink)}
.pv-big .cap{font-size:11.5px;color:var(--dink-3);margin-top:3px}
.pv-thumbs{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:5px;height:100%}
.drawer.h1 .pv-thumbs{grid-template-rows:1fr}
.pv-thumbs i{border-radius:2px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.10);display:block}
.pv-bars{display:flex;flex-direction:column;gap:7px;justify-content:center;height:100%}
.pv-bars .b{height:5px;border-radius:2px;background:rgba(0,0,0,.26);overflow:hidden}
.pv-bars .b i{display:block;height:100%;background:var(--dink-2);border-radius:2px}

/* ------------------------------------------------------------
   arrange mode — move and resize like a window on a grid
   ------------------------------------------------------------ */
.grid.arranging{
  /* the grid itself becomes visible graph paper while you arrange */
  background-image:linear-gradient(to right,var(--rule-2) 1px,transparent 1px),
                   linear-gradient(to bottom,var(--rule-2) 1px,transparent 1px);
  background-size:var(--cellw,100px) var(--cellstep,114px);
  outline:1px dashed var(--rule);outline-offset:6px;
}
.arranging .drawer{cursor:grab;user-select:none}
.arranging .drawer:active{cursor:grabbing}
.drawer.dragging{opacity:.85;z-index:40;box-shadow:var(--shadow-lg);cursor:grabbing}
.drawer.invalid{outline:2px solid #C0563F;outline-offset:-2px}

/* the cells a dragged/resized drawer would land on */
.ghost{
  border:1.5px dashed var(--brass);background:color-mix(in srgb,var(--brass) 14%,transparent);
  border-radius:var(--radius-d);pointer-events:none;z-index:1;
}
.ghost.bad{border-color:#C0563F;background:rgba(192,86,63,.14)}

/* eight handles, like a window. Bigger hit area than they look. */
.rz{position:absolute;z-index:30;display:none}
.arranging .rz{display:block}
.rz::after{content:"";position:absolute;inset:0}
.rz.n {top:-4px;left:10px;right:10px;height:9px;cursor:ns-resize}
.rz.s {bottom:-4px;left:10px;right:10px;height:9px;cursor:ns-resize}
.rz.w {left:-4px;top:10px;bottom:10px;width:9px;cursor:ew-resize}
.rz.e {right:-4px;top:10px;bottom:10px;width:9px;cursor:ew-resize}
.rz.nw{top:-4px;left:-4px;width:14px;height:14px;cursor:nwse-resize}
.rz.ne{top:-4px;right:-4px;width:14px;height:14px;cursor:nesw-resize}
.rz.sw{bottom:-4px;left:-4px;width:14px;height:14px;cursor:nesw-resize}
.rz.se{bottom:-4px;right:-4px;width:14px;height:14px;cursor:nwse-resize}
/* corner grips get a visible mark; edges stay invisible until hover */
.rz.nw::before,.rz.ne::before,.rz.sw::before,.rz.se::before{
  content:"";position:absolute;inset:3px;background:var(--dink);opacity:.5;border-radius:1px
}
.rz:hover::before{opacity:1}
.arranging .drawer:hover .rz.n::before,.arranging .drawer:hover .rz.s::before,
.arranging .drawer:hover .rz.w::before,.arranging .drawer:hover .rz.e::before{
  content:"";position:absolute;inset:3px;background:var(--dink);opacity:.28;border-radius:1px
}
.sizebtns{position:absolute;top:6px;right:6px;display:none;gap:3px;z-index:31}
.arranging .sizebtns{display:flex}
.arranging .drawer .dcount{visibility:hidden}  /* the size chip sits here instead */
.sizebtns b{
  font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:3px 6px;border-radius:3px;
  background:rgba(0,0,0,.42);color:var(--dink);cursor:pointer;font-variant-numeric:tabular-nums
}
.sizebtns b:hover{background:rgba(0,0,0,.68)}
/* the ✕ needs a real target — a near-miss used to open the thing instead */
.sizebtns b[data-delDrawer]{padding:4px 9px;font-size:12px;line-height:1}
.sizebtns::before{content:"";position:absolute;inset:-8px;pointer-events:auto}

/* selection, Finder-style */
.drawer.selected{outline:2.5px solid var(--brass);outline-offset:2px}
.drawer.selected::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--brass) 14%,transparent);pointer-events:none}
.ctxhead{padding:7px 12px 5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* A magic drawer should read as not-quite-solid: a dashed inner rule that
   drifts, and a faint sheen. It collects rather than holds, and looks it. */
.drawer.magicdrawer::before{
  content:"";position:absolute;inset:5px;border:1.5px dashed rgba(255,255,255,.42);
  border-radius:2px;pointer-events:none;
  animation:drift 22s linear infinite;
}
@keyframes drift{ to{ background-position:200px 0 } }
.drawer.magicdrawer{
  background-image:
    radial-gradient(circle at 18% 26%, rgba(255,255,255,.30) 0 1.1px, transparent 1.6px),
    radial-gradient(circle at 72% 18%, rgba(255,255,255,.22) 0 .9px, transparent 1.4px),
    radial-gradient(circle at 46% 74%, rgba(255,255,255,.26) 0 1px,  transparent 1.5px),
    radial-gradient(circle at 86% 62%, rgba(255,255,255,.18) 0 .8px, transparent 1.3px),
    radial-gradient(circle at 30% 52%, rgba(255,255,255,.20) 0 .8px, transparent 1.3px);
  animation:twinkle 6s ease-in-out infinite;
}
@keyframes twinkle{ 0%,100%{background-size:100% 100%} 50%{background-size:104% 104%} }
.magicmark{color:var(--dink-2);display:inline-flex;align-items:center;margin-left:2px}
.magicmark.big{color:var(--brass);vertical-align:middle}
@media (prefers-reduced-motion:reduce){
  .drawer.magicdrawer,.drawer.magicdrawer::before{animation:none}
}

/* Scroll view — a drawer read top to bottom, nothing truncated */
.scrollview{max-width:720px}
.scrollentry{padding:16px 0;border-bottom:1px solid var(--rule-2)}
.scrollentry header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.scrollentry h3{font-family:var(--serif);font-size:19px;font-weight:600;margin:0}
.scrollentry h3.done{text-decoration:line-through;color:var(--ink-3)}
.scrollentry .prose{font-size:14.5px;line-height:1.65}
.scrollimg{max-width:100%;border-radius:var(--radius);margin:8px 0;display:block}
.drawer.addnew{background:none;border:1.5px dashed var(--rule);box-shadow:none;align-items:center;justify-content:center;color:var(--ink-3);--dink:var(--ink-3)}
.drawer.addnew:hover{border-color:var(--brass);color:var(--brass);filter:none}

/* An object sitting directly on a grid. Same tile, no drawer front — it reads
   as a card on the desk rather than something you open. */
.drawer.otile{
  background:var(--paper-2);border-color:var(--rule);
  --dink:var(--ink);--dink-2:var(--ink-2);--dink-3:var(--ink-3);
  border-left:3px solid var(--c);
}
.drawer.otile:hover{filter:none;box-shadow:var(--shadow-lg)}
.drawer.otile .dname{font-family:var(--sans);font-size:13.5px;font-weight:600;white-space:normal;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drawer.otile .dname.done{text-decoration:line-through;color:var(--ink-3)}
.drawer.otile .dtop{align-items:flex-start;gap:8px}
.tiletext{font-size:11.5px;color:var(--ink-3);line-height:1.45;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.tilecheck{flex:0 0 auto;margin-top:1px}
.tilebtn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius);
  background:var(--c);color:#F8F3E6;font-size:11.5px;font-weight:600}
.tilebtn:hover{filter:brightness(1.1)}
.tilemeta{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* A drawer front: a name and a pull, nothing else. What's inside is inside. */
.drawer.dtile .dtop{align-items:center}
.drawer.dtile .dname{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.drawer.dtile .dcount{align-self:flex-start}
.magicmark{color:var(--dink-2);display:inline-flex;align-items:center;margin-left:2px}

/* An image on the grid, cropped to its box like something pasted in place */
.drawer.imgtile{padding:0;overflow:hidden;background:var(--paper-3)}
.tileimg{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.imgcap{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;font-size:11px;color:#F8F3E6;
  background:rgba(0,0,0,.45);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Bureau's own buttons, living on the desk */
.drawer.ctile{
  background:var(--paper-2);border-color:var(--rule);align-items:center;justify-content:center;
  gap:5px;--dink:var(--ink);color:var(--ink-2);border-left:3px solid var(--c);
}
.drawer.ctile:hover{filter:none;border-color:var(--brass);color:var(--ink)}
.ctile .cico{color:var(--c);display:grid;place-items:center}
.ctile .clabel{font-size:11.5px;font-weight:600;letter-spacing:.01em}

/* ============================================================
   Object rows
   ============================================================ */
.section-h{display:flex;align-items:center;gap:8px;margin:22px 0 9px;}
.section-h h2{font-family:var(--serif);font-size:16px;font-weight:600;margin:0;letter-spacing:.01em}
.section-h .rule{flex:1;height:1px;background:var(--rule)}
.section-h .n{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.rows{display:flex;flex-direction:column;gap:5px}
.rowwrap{position:relative;border-radius:11px;overflow:hidden}
.rowwrap .swipebg{position:absolute;inset:0;opacity:0;transition:opacity .12s;z-index:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:600;color:#fff}
.rowwrap.swiping .swipebg{opacity:1}
.rowwrap .swipebg::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#3E8E5A 50%,#C0563F 50%);}
.rowwrap .swipebg span{position:relative;z-index:1}
.row{
  position:relative;display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:11px;
  background:var(--paper-2);border:1px solid var(--rule);cursor:pointer;z-index:1;
  transition:border-color .15s,background .15s,transform .06s;
  touch-action:pan-y;
}
.row:hover{border-color:color-mix(in srgb,var(--k) 40%, var(--rule));background:color-mix(in srgb,var(--k) 4%, var(--paper-2))}
.row.dragging{opacity:.4}
.row.sel{border-color:var(--brass);box-shadow:0 0 0 2px color-mix(in srgb,var(--brass) 25%,transparent)}
.check{
  width:19px;height:19px;flex:0 0 auto;border-radius:6px;border:1.6px solid var(--ink-3);margin-top:1px;
  display:grid;place-items:center;transition:.15s;
}
.check:hover{border-color:var(--k)}
.check.on{background:var(--k);border-color:var(--k);color:#fff}
.check svg{opacity:0;transform:scale(.5);transition:.15s}
.check.on svg{opacity:1;transform:scale(1)}
.kindmark{

function reset(){
  const s = seed();
  S = {
    objects:s.objects, kinds:{},
    // Paper, not auto: the parchment desk is the intended look, so a Mac in
    // dark mode shouldn't silently serve Walnut on first run.
    device:sensedDevice(), layoutEdit:null, theme:'paper',
    view:'desk', drawerId:null, openId:null,
    arrange:false, reorder:false, listmode:'rows', kindFilter:null, tagFilter:null,
    selDate:T, trash:null, editing:false, sel:[],
    look:defaultLook()
  };
  refreshKinds();
}
function defaultLook(){
  return {bg:null, accent:null, line:null, railw:212, railHidden:false};
}
reset();

// which drawer layout we are looking at — the real device, unless you have
// deliberately opened the other one to arrange it
const dev = ()=> S.layoutEdit || S.device;
const byId = id => S.objects.find(o=>o.id===id);

/* The desk is the root container. It is never drawn as a tile — it is the grid
   everything else starts on. Giving it a real object keeps every code path that
   walks containers identical at the top level. */
const rootObj = ()=> ({id:ROOT, kind:'drawer', title:'The Desk', c:'#7E5A38',
                       pv:'list', filter:{}, layout:'grid', parent:null});
const container = id => (id===ROOT||!id) ? rootObj() : byId(id);
const isContainer = o => !!o && has(o,'container');
const containers = ()=> S.objects.filter(isContainer);

/* A drawer holds. A magic drawer collects. Nothing does both.
   An object lives in exactly one drawer — its `parent` — and that is the only
   thing an ordinary drawer shows. A magic drawer ignores parentage entirely and
   shows whatever matches its rule, which is the one way an object appears in
   more than one place at once. */
function inContainer(c,o){
  if(!c || o.id===c.id) return false;
  if(has(c,'magic')){
    const f=c.filter||{};
    if(f.done) return !!o.done;        // the archive
    if(o.done) return false;           // finished things leave everywhere else
    if(isContainer(o)) return false;   // magic drawers collect objects, not drawers
    if(f.due==='today') return !!o.due && D.parse(o.due)<=D.today();
    if(f.tag) return (o.tags||[]).includes(f.tag);
    if(f.kinds && f.kinds.length) return f.kinds.includes(o.kind);
    return false;
  }
  if(o.done) return false;             // finished things leave their drawer
  return o.parent===c.id;              // an ordinary drawer holds what is filed in it
}
// Children in the order the container's layout wants them.
function childrenOf(c){
  const list = S.objects.filter(o=>inContainer(c,o));
  return list.sort((a,b)=>(a.ord||0)-(b.ord||0));
}
// Guard against a container being dragged inside itself — with recursion this
// is a real way to lose a subtree, not a theoretical one.
function isAncestor(maybeAncestor, o){
  let p = o && o.parent, n = 0;
  while(p && p!==ROOT && n++ < 100){
    if(p===maybeAncestor) return true;
    const up = byId(p); p = up && up.parent;
  }
  return false;
}
// Breadcrumb chain from the desk down to this container.
function chainOf(id){
  const out=[]; let o=byId(id), n=0;
  while(o && n++ < 100){ out.unshift(o); o = o.parent&&o.parent!==ROOT ? byId(o.parent) : null; }
  return out;
}

   4b · the grid — one coordinate space per device
   ------------------------------------------------------------
   Drawers hold {x,y,w,h} in 1-based grid cells, per device. The grid does not
   flow: an empty cell stays empty, because position is meant to carry meaning.
   Two drawers may never occupy the same cell — a move or resize that would
   overlap is refused rather than shoving a neighbour out of the way, so nothing
   you arranged ever moves without you.                                        */
/* The grid is square: a cell is as tall as it is wide. Columns are fluid, so
   the row height is measured after layout by sizeGrid() and cached here —
   nothing may assume a fixed row height. Twice the columns of the first
   version, which is what makes the smallest object half the size it was. */
const GRID = {
  desk:  {cols:24, gap:5},
  phone: {cols:16, gap:4}
};
const CELL = {desk:40, phone:21};   // last measured; a sane guess until then
const gridOf = (device)=>{
  const d=device||dev();
  return {cols:GRID[d].cols, gap:GRID[d].gap, rowh:CELL[d]};
};
// Tolerate a drawer that predates x/y, or one hand-edited into nonsense.
function lay(d, device){
  const g=gridOf(device), b=d[device||dev()]||{};
  const w=clamp(b.w||2,1,g.cols), h=clamp(b.h||1,1,40);
  return {x:clamp(b.x||1,1,g.cols-w+1), y:Math.max(1,b.y||1), w, h};
}
const overlaps = (a,b)=> a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h;
/* Every check below is scoped to one container's grid. Collisions only matter
   between siblings — two objects in different drawers can share coordinates,
   because they are in different coordinate spaces. */
const hasBox = (o,dv)=> !!(o && o[dv] && o[dv].w);
function boxOk(box, id, device, parentId){
  const g=gridOf(device), dv=device||dev();
  if(box.x<1 || box.y<1 || box.w<1 || box.h<1 || box.x+box.w-1>g.cols) return false;
  // Only objects that have actually been placed can be collided with. Without
  // this, everything unplaced reads as sitting at 1,1 and blocks the corner.
  return !childrenOf(container(parentId||ROOT))
    .some(d=>d.id!==id && hasBox(d,dv) && overlaps(box, lay(d,device)));
}
// Lowest free spot in this container, scanning left-to-right then down.
function freeSpot(w,h,device,parentId){
  const g=gridOf(device);
  for(let y=1;y<200;y++) for(let x=1;x<=g.cols-w+1;x++){
    const box={x,y,w,h};
    if(boxOk(box,null,device,parentId)) return box;
  }
  return {x:1,y:1,w,h};
}
const gridRows = (device,parentId)=> childrenOf(container(parentId||ROOT))
  .reduce((m,d)=>{const b=lay(d,device);return Math.max(m,b.y+b.h-1)},0);
/* An object that has never been in a grid has no box. Give it one the first
   time it needs to be placed, rather than storing coordinates for everything. */
/* New things land square. A drawer needs room for its name, a control is small,
   everything else starts at the smallest square that can show a title. */
function ensureBox(o, device, parentId){
  const dv=device||dev();
  if(o[dv] && o[dv].w) return o[dv];
  const n = isContainer(o) ? 6 : 4;
  o[dv] = freeSpot(n, n, dv, parentId||o.parent);
  return o[dv];
}

/* Appearance: custom background, accent and drawer outline. Written as inline
   custom properties on <html>, which beat both theme blocks. */
function applyLook(){
  const el=document.documentElement, L=S.look||defaultLook();
  if(L.bg){
    el.style.setProperty('--paper', L.bg);
    el.style.setProperty('--paper-2', `color-mix(in srgb, ${L.bg} 84%, #fff)`);
    el.style.setProperty('--paper-3', `color-mix(in srgb, ${L.bg} 90%, #000)`);
  } else ['--paper','--paper-2','--paper-3'].forEach(p=>el.style.removeProperty(p));
  if(L.accent) el.style.setProperty('--brass', L.accent); else el.style.removeProperty('--brass');
  if(L.line) el.style.setProperty('--line', L.line); else el.style.removeProperty('--line');
  el.style.setProperty('--railw', (L.railw||212)+'px');
}

/* Set colours to choose from. Warm, solid, no gradients — browns, greens,
   blues, and a few earth tones that sit beside them. */
const SWATCHES = {
  brown: [['#6F5137','Walnut'],['#7E5A38','Chestnut'],['#8A6A3C','Tobacco'],['#A0703F','Oak'],['#5A4130','Bark']],
  green: [['#4A7C59','Fern'],['#3D6B4A','Pine'],['#5C7148','Olive'],['#6E8B4E','Moss'],['#3E7A6B','Verdigris']],
  blue:  [['#3F5F7A','Slate'],['#4A6E8F','Denim'],['#2F4A5E','Indigo'],['#5D7E99','Haze'],['#37687A','Teal']],
  earth: [['#A55A3E','Terracotta'],['#96652F','Ochre'],['#8C4A38','Rust'],['#9A7B2F','Brass'],['#6B4A4A','Oxblood']]
};
const BACKDROPS = [
  ['#E9E1CC','Parchment'],['#EFE8D6','Vellum'],['#E2D9C0','Manila'],
  ['#DED3B6','Kraft'],['#F1EDE0','Chalk'],['#D9D2BE','Linen']
];

function streak(o){
  const set=new Set(o.history||[]); let n=0, d=D.today();
  if(!set.has(D.iso(d))) d=D.add(d,-1);
  while(set.has(D.iso(d))){ n++; d=D.add(d,-1); }
  return n;
}
const goalPct = o => !o.milestones||!o.milestones.length ? 0 : Math.round(100*o.milestones.filter(m=>m.done).length/o.milestones.length);
const allTags = ()=>{ const m={}; S.objects.forEach(o=>(o.tags||[]).forEach(t=>m[t]=(m[t]||0)+1)); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };

/* ============================================================
   5 · markdown (small, sufficient)
   ============================================================ */
function md(src){
  if(!src||!src.trim()) return '<p style="color:var(--ink-3)">Nothing written yet.</p>';
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[]; let list=null;
  const close=()=>{ if(list){out.push(`</${list}>`); list=null;} };
  src.split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();
    if(!l){ close(); return; }
    let m;
    if(/^---+$/.test(l)){ close(); out.push('<hr>'); return; }
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ close(); const n=Math.min(m[1].length+1,4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); return; }
    if((m=l.match(/^>\s?(.*)$/))){ close(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); return; }
    if((m=l.match(/^[-*]\s+\[([ xX])\]\s+(.*)$/))){
      if(list!=='ul'){close(); out.push('<ul>'); list='ul';}
      const on=m[1].toLowerCase()==='x';
      out.push(`<li class="tick${on?' on':''}"><b></b>${inline(m[2])}</li>`); return;
    }
    if((m=l.match(/^[-*]\s+(.*)$/))){ if(list!=='ul'){close(); out.push('<ul>'); list='ul';} out.push(`<li>${inline(m[1])}</li>`); return; }
    if((m=l.match(/^\d+[.)]\s+(.*)$/))){ if(list!=='ol'){close(); out.push('<ol>'); list='ol';} out.push(`<li>${inline(m[1])}</li>`); return; }
    close(); out.push(`<p>${inline(l)}</p>`);
  });
  close();
  return out.join('');
}
const strip = s => String(s||'').replace(/[#>*`\-\[\]]/g,' ').replace(/\s+/g,' ').trim();

/* ============================================================
   6 · mutations
   ============================================================ */
function toast(msg,undo){
  const t=$('#toast');
  t.innerHTML = esc(msg) + (undo?' <u data-undo="1">Undo</u>':'');
  t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),3400);
}
function nextDue(o){
  if(!o.repeat||!o.due) return null;
  const r=o.repeat;
  if(r==='daily') return D.addISO(o.due,1);
  if(r==='weekly') return D.addISO(o.due,7);
  if(r==='monthly'){ const d=D.parse(o.due); d.setMonth(d.getMonth()+1); return D.iso(d); }
  if(r==='weekdays'){ let d=D.parse(o.due); do{ d=D.add(d,1);}while(d.getDay()===0||d.getDay()===6); return D.iso(d); }
  return null;
}
function toggleDone(id){
  const o=byId(id); if(!o) return;
  if(has(o,'streak')){ toggleHabit(id); return; }
  o.done=!o.done;
  if(o.done){
    o.doneAt=T;
    const nd=nextDue(o);
    if(nd){
      S.objects.push(Object.assign({},o,{id:uid('o'),done:false,doneAt:null,due:nd,ord:o.ord+0.5}));
      o.kind='record'; o.parent='d_done'; o.title=o.title;
      toast(`Done · repeats ${D.human(nd).toLowerCase()}`);
    } else toast('Filed under Done & Dusted');
  } else { o.doneAt=null; }
  render();
}
function toggleHabit(id){
  const o=byId(id); if(!o) return;
  o.history=o.history||[];
  const i=o.history.indexOf(T);
  if(i>=0) o.history.splice(i,1); else { o.history.push(T); toast(`${o.title} · ${streak(o)+0} day streak`); }
  render();
}
// Anything still in the bin when the bin is emptied is gone for good, so that
// is the moment its picture can be freed — not the moment it was deleted,
// which would break undo.
function dropTrash(){
  const t=S.trash; S.trash=null;
  if(t && t.o && t.o.media && t.o.media.assetId) assetDel(t.o.media.assetId);
}
function del(id){
  const i=S.objects.findIndex(o=>o.id===id); if(i<0) return;
  dropTrash();
  S.trash={o:S.objects[i], i};
  S.objects.splice(i,1);
  if(S.openId===id) closeSheet();
  toast('Deleted', true); render();
}
function undo(){
  if(!S.trash) return;
  S.objects.splice(S.trash.i,0,S.trash.o); S.trash=null;
  $('#toast').classList.remove('show'); render();
}
function create(kind, patch){
  const k=K(kind);
  const o = Object.assign({
    id:uid(kindHas(kind,'container')?'d':'o'), kind, title:'', body:k.body||'', tags:[],
    parent:(S.view==='drawer'&&S.drawerId)||ROOT,
    done:false, doneAt:null, due:kindHas(kind,'date')?T:null,
    repeat:kindHas(kind,'streak')?'daily':null,
    history:[], milestones:kindHas(kind,'progress')?[{t:'First milestone',done:false,d:dz(30)}]:[],
    media:kindHas(kind,'media')?{type:'image',label:'Attach a file'}:null,
    link:kindHas(kind,'button')?{label:'Open',target:''}:null,
    desk:null, phone:null,
    ord:Math.min(0,...S.objects.map(o=>o.ord||0))-1, created:T
  }, patch||{});
  if(kindHas(kind,'container')){
    o.c = o.c || k.c; o.pv = o.pv || 'list';
    o.layout = o.layout || k.layout || 'list';
    o.filter = o.filter || {};
  }
  // route into a container whose rule will actually show it
  const home=containers().find(d=>d.filter&&d.filter.kinds&&d.filter.kinds.includes(kind));
  if((!patch||!patch.parent) && home) o.parent=home.id;
  S.objects.push(o);
  return o;
}
function quickAdd(text, kind, drawerId){
  let t=text.trim(); if(!t) return null;
  let k=kind||'task', due=null; const tags=[];
  const slash=t.match(/^\/(\w+)\s+/);
  if(slash){ const found=KEYS.find(x=>x.startsWith(slash[1].toLowerCase())); if(found){ k=found; t=t.slice(slash[0].length); } }
  t=t.replace(/#([\w-]+)/g,(m,g)=>{tags.push(g);return '';});
  if(/!today\b/i.test(t)){ due=T; t=t.replace(/!today\b/i,''); }
  if(/!tomorrow\b/i.test(t)){ due=dz(1); t=t.replace(/!tomorrow\b/i,''); }
  if(/!week\b/i.test(t)){ due=dz(7); t=t.replace(/!week\b/i,''); }
  t=t.replace(/\s+/g,' ').trim();
  const o=create(k,{title:t, tags, parent:drawerId||undefined, body:''});
  if(due) o.due=due; else if(!kindHas(k,'date')) o.due=null;
  return o;
}

/* ============================================================
   7 · rendering — drawers
   ============================================================ */
function drawerPreview(d, items){
  const c=d.c, f=d.filter||{};
  if(d.pv==='big'){
    const n=items.length;
    const cap = f.done ? 'accomplishments on record' : 'due today';
    return `<div class="pv-big"><div class="num">${n}</div><div class="cap">${cap}</div></div>`;
  }
  if(d.pv==='stack'){
    return `<div class="pv-stack">${items.slice(0,3).map((o,i)=>
      `<div class="card" style="--k:${K(o.kind).c};--rot:${(i-1)*0.8}deg;top:${i*34}px;z-index:${3-i}">${esc(o.title||'Untitled')}</div>`).join('')}</div>`;
  }
  if(d.pv==='thumbs'){
    return `<div class="pv-thumbs">${items.slice(0,6).map(o=>`<i style="--k:${K(o.kind).c}"></i>`).join('')||'<i style="--k:'+c+'"></i>'}</div>`;
  }
  if(d.pv==='bars'){
    return `<div class="pv-bars">${items.slice(0,4).map(o=>{
      const p = has(o,'progress') ? goalPct(o) : clamp(streak(o)*14,6,100);
      return `<div class="b" style="--k:${K(o.kind).c}"><i style="width:${p}%"></i></div>`;}).join('')}</div>`;
  }
  return `<div class="pv-list">${items.slice(0,5).map(o=>
    `<div class="r${o.done?' done':''}" style="--k:${K(o.kind).c}"><span class="dot"></span><span class="lbl">${esc(o.title||'Untitled')}</span></div>`).join('')}</div>`;
}
const HANDLES = ['nw','n','ne','e','se','s','sw','w'];
/* Where a click on bare grid happened, so the next new object lands there. */
let pendingCell=null;
function placeAtPending(o){
  if(!pendingCell){ return; }
  const n = isContainer(o) ? 6 : 4;
  const g=gridOf(), box={x:clamp(pendingCell.x,1,g.cols-n+1), y:pendingCell.y, w:n, h:n};
  o[dev()] = boxOk(box, o.id, dev(), o.parent) ? box : freeSpot(n,n,dev(),o.parent);
  pendingCell=null;
}

/* One tile, for anything. A container gets the drawer front and a preview of
   what is inside it; everything else gets its attributes rendered directly.
   This is the only place that decides how an object looks on a grid, at any
   depth — the desk and a drawer three levels down both come through here. */
function gridTile(o, arr, parentId){
  const b=ensureBox(o, dev(), parentId);
  const box=lay(o), cont=isContainer(o);
  const colour = o.c || K(o.kind).c;
  const handles = arr ? HANDLES.map(h=>`<i class="rz ${h}" data-rz="${h}"></i>`).join('') : '';
  // Bureau's own buttons resize like anything else but can't be deleted —
  // losing Settings would leave nowhere to get it back from.
  const chips = arr
    ? `<div class="sizebtns"><b data-size="${o.id}">${box.w}×${box.h}</b>${
        has(o,'control')?'':`<b data-delDrawer="${o.id}">✕</b>`}</div>`
    : '';
  const place = `grid-column:${box.x} / span ${box.w};grid-row:${box.y} / span ${box.h}`;
  const sel = S.sel.includes(o.id) ? ' selected' : '';

  // A control is a Bureau button that lives on the desk like anything else.
  if(has(o,'control')){
    return `<button class="drawer ctile${sel}" data-ctl="${esc(o.ctl||'')}" data-id="${o.id}" style="--c:${colour};${place}">
      ${chips}<span class="cico">${ic(K(o.kind).ic==='sliders'&&o.ic?o.ic:(o.ic||'sliders'),20)}</span>
      <span class="clabel">${esc(o.title||'')}</span>
      ${handles}
    </button>`;
  }

  // A drawer on a grid is just a front with a name. What is inside is behind
  // it, not printed on it — you open a drawer to find out what it holds.
  if(cont){
    const items=childrenOf(o);
    return `<button class="drawer dtile${sel}${has(o,'magic')?' magicdrawer':''}" data-drawer="${o.id}" style="--c:${colour};${place}">
      ${chips}
      <div class="dtop"><span class="dname">${esc(o.title||'Untitled')}</span>
        ${has(o,'magic')?`<span class="magicmark" title="Collects by rule">${ic('sparkle',11)}</span>`:''}
        <span class="dcount">${items.length}</span></div>
      <div class="dfoot"><span class="pull"></span></div>
      ${handles}
    </button>`;
  }

  // An image sits on the grid like something stuck in a scrapbook.
  const img = has(o,'media') && o.media && o.media.src;
  if(img){
    return `<button class="drawer otile imgtile${sel}" data-row="${o.id}" style="--c:${colour};${place}">
      ${chips}
      <img class="tileimg" src="${esc(o.media.src)}" alt="${esc(o.title||'')}" draggable="false">
      ${o.title?`<span class="imgcap">${esc(o.title)}</span>`:''}
      ${handles}
    </button>`;
  }

  return `<button class="drawer otile${sel}" data-row="${o.id}" style="--c:${colour};${place}">
    ${chips}
    <div class="dtop">
      ${has(o,'check')?`<span class="check tilecheck${o.done?' on':''}" data-check="${o.id}">${ic('check',12)}</span>`:''}
      <span class="dname${o.done?' done':''}">${esc(o.title||'Untitled')}</span>
    </div>
    ${has(o,'text')&&o.body?`<div class="dbody"><div class="tiletext">${esc(o.body).slice(0,220)}</div></div>`:'<div class="dbody"></div>'}
    ${has(o,'button')?`<div class="dfoot"><span class="tilebtn" data-fire="${o.id}">${esc((o.link&&o.link.label)||'Open')}</span></div>`:''}
    ${has(o,'streak')?`<div class="dfoot"><span class="tilemeta">${streak(o)}-day streak</span></div>`:''}
    ${has(o,'progress')?`<div class="dfoot"><span class="tilemeta">${goalPct(o)}%</span></div>`:''}
    ${handles}
  </button>`;
}

/* The grid for one container. `id` is ROOT for the desk. */
function gridOfContainer(cid){
  const arr=S.arrange, g=gridOf(), c=container(cid);
  const kids=childrenOf(c);
  // place everything first, so each one packs against real neighbours
  kids.forEach(o=>ensureBox(o, dev(), c.id));
  const tiles=kids.map(o=>gridTile(o,arr,c.id)).join('');
  const rows=gridRows(dev(),c.id)+(arr?2:0);
  const spare=arr?freeSpot(2,1,dev(),c.id):null;
  return `<div class="grid g-${dev()}${arr?' arranging':''}" id="drawergrid" data-gridfor="${c.id}"
       style="--cols:${g.cols};--rowh:${g.rowh}px;grid-template-rows:repeat(${Math.max(rows,1)},${g.rowh}px)">${tiles}
    ${arr?`<button class="drawer addnew" data-act="newdrawer" style="grid-column:${spare.x} / span 2;grid-row:${spare.y} / span 1">${ic('plus',18)}</button>`:''}
  </div>`;
}

/* The desk is nothing but the grid. There is no toolbar: New, Arrange and
   Settings are control objects sitting on it, so the grid is the whole page. */
function viewDesk(){
  const arr=S.arrange;
  return `
  <div class="scroll deskscroll">
    ${S.layoutEdit?`<div class="banner">${ic('resize',14)} You are arranging the <b style="margin:0 3px">${S.layoutEdit==='desk'?'Mac':'iPhone'}</b> layout.
      <button data-act="stopedit">Back to this device</button></div>`:''}
    ${arr?`<div class="mini" style="--k:var(--brass)"><span class="dot"></span>Drag to move · drag any edge or corner to resize · this only changes your <b style="color:var(--ink);margin:0 3px">${dev()==='desk'?'Mac':'iPhone'}</b> layout
      <button class="pill solid" style="margin-left:auto" data-act="arrange">${ic('check',13)} Done</button></div>`:''}
    ${gridOfContainer(ROOT)}
  </div>`;
}

/* ============================================================
   8 · rendering — rows & cards
   ============================================================ */
function row(o){
  const k=K(o.kind);
  const late=!o.done&&D.overdue(o.due);
  const meta=[];
  meta.push(`<span class="mchip k">${k.nm.toLowerCase()}</span>`);
  if(o.due&&!has(o,'streak')) meta.push(`<span class="mchip${late?' late':''}">${ic('calendar',11)} ${D.human(o.due)}</span>`);
  if(o.repeat&&!has(o,'streak')) meta.push(`<span class="mchip">${ic('repeat',11)} ${o.repeat}</span>`);
  if(has(o,'streak')) meta.push(`<span class="mchip">${ic('repeat',11)} ${streak(o)}-day streak</span>`);
  if(has(o,'progress')) meta.push(`<span class="mchip">${ic('target',11)} ${goalPct(o)}%</span>`);
  if(o.media) meta.push(`<span class="mchip">${ic(o.media.type==='audio'?'music':o.media.type==='video'?'film':'image',11)} ${esc(o.media.label)}</span>`);
  (o.tags||[]).slice(0,3).forEach(t=>meta.push(`<span class="mchip tag">${esc(t)}</span>`));
  const snip=strip(o.body).slice(0,90);
  const lead = has(o,'check')||has(o,'streak')
    ? `<span class="check${(has(o,'streak')? (o.history||[]).includes(T) : o.done)?' on':''}" data-check="${o.id}">${ic('check',13)}</span>`
    : `<span class="kindmark">${ic(k.ic,13)}</span>`;
  return `<div class="rowwrap" data-wrap="${o.id}">
    <div class="swipebg"><span>${ic('check',13)} File</span><span>Delete ${ic('trash',13)}</span></div>
    <div class="row${o.done?' done':''}" data-row="${o.id}" style="--k:${k.c}">
      <span class="grip" data-grip="1">${ic('grip',14)}</span>
      ${lead}
      <div class="body">
        <div class="title">${esc(o.title||'Untitled')}</div>
        ${snip?`<div class="snip">${esc(snip)}</div>`:''}
        <div class="meta">${meta.join('')}</div>
      </div>
      <div class="rowacts">
        <button data-menu="${o.id}" title="More">${ic('more',15)}</button>
        <button data-del="${o.id}" title="Delete">${ic('trash',15)}</button>
      </div>
    </div></div>`;
}
function card(o){
  const k=K(o.kind);
  return `<div class="ocard" data-row="${o.id}" style="--k:${k.c}">

    <div style="display:flex;align-items:center;gap:6px"><span style="color:${k.c}">${ic(k.ic,13)}</span>

/* ============================================================
   9 · rendering — drawer view
   ============================================================ */
function viewDrawer(){
  const d=byId(S.drawerId);
  if(!d || !isContainer(d)) return viewDesk();
  const all=childrenOf(d);
  let items=all;
  if(S.kindFilter) items=items.filter(o=>o.kind===S.kindFilter);
  if(S.tagFilter) items=items.filter(o=>(o.tags||[]).includes(S.tagFilter));
  const kinds=[...new Set(all.map(o=>o.kind))];
  const f=d.filter||{};
  const defKind = (f.kinds&&f.kinds[0]) || 'task';
  const view = d.layout || 'grid';       // grid | list | scroll
  const arr=S.arrange;
  // the full chain, so a drawer four levels deep still tells you where you are
  const trail=chainOf(d.id);
  return `
  <div class="topbar">
    <button class="iconbtn" data-act="back">${ic('chevL',18)}</button>
    <div><div class="crumbs">${ic('grid',11)} <b data-view="desk">Desk</b> ${
      trail.map((c,i)=> `${ic('chevR',10)} ${i===trail.length-1?esc(c.title):`<b data-drawer="${c.id}">${esc(c.title)}</b>`}`).join(' ')}</div>
      <h1 style="color:${d.c||K(d.kind).c}">${esc(d.title)}${has(d,'magic')?` <span class="magicmark big">${ic('sparkle',15)}</span>`:''}</h1></div>
    <div class="grow"></div>
    ${arr?`<button class="pill solid" data-act="arrange">${ic('check',13)} Done</button>`:''}
    ${view!=='grid'&&!has(d,'magic')?`<button class="pill${S.reorder?' solid':''}" data-act="reorder">${ic('grip',14)} <span class="lbl">${S.reorder?'Done':'Reorder'}</span></button>`:''}
    <button class="pill" data-act="drawersettings" data-id="${d.id}">${ic('sliders',14)} <span class="lbl">Settings</span></button>
  </div>
  <div class="scroll">
    ${has(d,'magic')?'':`<div class="quickadd">${ic('plus',15)}
      <input id="qa" placeholder="Add to ${esc(d.title)}…  try  /idea  #tag  !today" data-kind="${defKind}" data-drawer="${d.id}">
      <span class="k">↵</span></div>`}
    ${kinds.length>1&&view!=='grid'?`<div class="filterbar">
      <button class="fchip${!S.kindFilter?' on':''}" data-kind="">All</button>
      ${kinds.map(k=>`<button class="fchip${S.kindFilter===k?' on':''}" data-kind="${k}" style="--k:${K(k).c}">${K(k).nm}</button>`).join('')}
    </div>`:''}
    ${view==='grid'
      ? gridOfContainer(d.id)
      : !items.length
        ? `<div class="empty"><div class="big">This drawer is empty</div>${has(d,'magic')?'Nothing matches its rule yet.':'Add something above, or click a bare cell on the desk.'}</div>`
        : view==='scroll'
          ? `<div class="scrollview">${items.map(scrollEntry).join('')}</div>`
          : `<div class="rows${S.reorder?' reordering':''}" id="sortlist">${items.map(row).join('')}</div>`}
  </div>`;
}

/* Scroll view: the same list, but nothing is truncated. Every object's whole
   body, one after another, for reading a drawer rather than scanning it. */
function scrollEntry(o){
  const k=K(o.kind);
  return `<article class="scrollentry" data-row="${o.id}" style="--k:${k.c}">
    <header>
      ${has(o,'check')?`<span class="check${o.done?' on':''}" data-check="${o.id}">${ic('check',12)}</span>`:`<span class="kindmark">${ic(k.ic,13)}</span>`}
      <h3${o.done?' class="done"':''}>${esc(o.title||'Untitled')}</h3>
      ${o.due?`<span class="mchip">${D.human(o.due)}</span>`:''}
      ${(o.tags||[]).map(t=>`<span class="mchip tag">${esc(t)}</span>`).join('')}
    </header>
    ${has(o,'media')&&o.media&&o.media.src?`<img class="scrollimg" src="${esc(o.media.src)}" alt="${esc(o.title||'')}">`:''}
    ${o.body?`<div class="prose">${md(o.body)}</div>`:''}
  </article>`;
}

/* ============================================================

function viewToday(){

let render = function render(){
  const frame=$('#frame');
  frame.className = S.device==='desk' ? 'is-desk' : 'is-phone';

    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'walnut' : 'paper')
    : S.theme;
  const body = S.view==='desk'?viewDesk():S.view==='drawer'?viewDrawer():S.view==='today'?viewToday()
             :S.view==='keep'?viewKeep():S.view==='settings'?viewSettings():viewAll();
  // No sidebar: the desk is the navigation. Drawers are on it, ⌘K finds
  // anything, and the breadcrumb walks back up.
  $('#app').innerHTML = `<div class="main">${body}${tabbar()}</div>`;

/* The graph-paper backdrop in arrange mode has to match the real column width,
   which is fluid — so measure it after layout rather than assuming it. */
/* Measure the real column width and make the rows match it, so every cell is a
   square. Runs after each render and on resize; if the measurement changes the
   cached cell size, re-render so row counts and drag maths agree with it. */
let sizing=false;
function sizeGrid(){
  const grid=$('#drawergrid'); if(!grid) return;
  const g=gridOf(), w=cellW(grid,g);
  if(!(w>0)) return;
  const cell=Math.round(w);
  const changed = !sizing && Math.abs(CELL[dev()]-cell) > 0.5;
  CELL[dev()]=cell;
  grid.style.setProperty('--rowh', cell+'px');
  grid.style.setProperty('--cellw', (cell+g.gap)+'px');
  grid.style.setProperty('--cellstep', (cell+g.gap)+'px');
  grid.style.gridAutoRows = cell+'px';
  const rows=(grid.style.gridTemplateRows.match(/repeat\((\d+)/)||[])[1];
  if(rows) grid.style.gridTemplateRows=`repeat(${rows},${cell}px)`;
  if(changed){ sizing=true; try{ render(); } finally { sizing=false; } }
}

   ============================================================ */
function openObj(id){ S.openId=id; S.editing=false; renderSheet(); }
function closeSheet(){ S.openId=null; renderSheet(); render(); }

function renderSheet(){
  const host=$('#sheetHost');
  const o=S.openId?byId(S.openId):null;
  if(!o){ host.innerHTML=''; return; }
  const k=K(o.kind);
  const drawerOpts=containers().filter(c=>c.id!==o.id&&!isAncestor(o.id,c)).map(d=>`<option value="${d.id}"${o.parent===d.id?" selected":""}>${esc(d.title)}</option>`).join('');
  const kindOpts=KEYS.map(x=>`<option value="${x}"${o.kind===x?' selected':''}>${KINDS[x].nm}</option>`).join('');

  // Every field below is gated on an attribute, never on a kind name — that is
  // what lets an invented kind get the right fields for free.
  const fields=[];
  fields.push(`<div class="field"><label>Kind</label><select data-f="kind">${kindOpts}</select></div>`);
  fields.push(`<div class="field"><label>Lives in</label><select data-f="parent">
    <option value="${ROOT}"${o.parent===ROOT?' selected':''}>The Desk</option>${drawerOpts}</select></div>`);

/* Sweep the selection (or one object) into a brand-new drawer, made where they
   already are. The drawer takes the place of the first one, which is the least

function drawerFromSelection(id){
  const sel = S.sel.includes(id) ? S.sel.slice() : [id];
  const objs = sel.map(byId).filter(Boolean);
  if(!objs.length) return;
  const home = objs[0].parent || ROOT;
  const spot = lay(objs[0]);
  const d = {
    id:uid('d'), kind:'drawer', title:'New drawer', body:'', tags:[],
    parent:home, c:'#7E5A38', pv:'list', layout:'grid', filter:{},
    ord:0, created:T,
    desk:null, phone:null
  };
  S.objects.push(d);
  objs.forEach(o=>{ o.parent=d.id; o.desk=null; o.phone=null; });
  // now that its contents have moved out, the first object's old spot is free
  d[dev()] = boxOk({x:spot.x,y:spot.y,w:6,h:6}, d.id, dev(), home)
    ? {x:spot.x,y:spot.y,w:6,h:6} : freeSpot(6,6,dev(),home);
  S.sel=[];
  save(); render();
  toast(`${objs.length} filed in a new drawer`);
  modalDrawer(d.id);
}
