<!-- The strip the clock and the battery sit in is painted by the system from
     this, not by the page, so it is the one piece of the app's furniture that
     CSS cannot reach. It is the **wood**: the carcass runs from the status bar
     down to the drawer along the bottom, and a cream strip above a walnut bar
     reads as the app starting an inch below the top of the screen. One value,
     with no light/dark pair, because the wood is the same in both — a desk is
     walnut at midday as much as at midnight. views.js keeps it in step with a
     desk that names its own. -->
<meta name="theme-color" content="#3A2C1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="description" content="A desk for everything you keep.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">

     section map lives in CLAUDE.md; the old numbered banners are now files. -->

</body>
