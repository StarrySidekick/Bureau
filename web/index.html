<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Bureau</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDE7DB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191510" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bureau">
<meta name="description" content="A desk for everything you keep.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<style>
/* ============================================================
   BUREAU — design tokens
   ============================================================ */
:root{
  --paper:#E9E1CC;          /* parchment */
  --paper-2:#F2ECDB;
  --paper-3:#DCD2B9;
  --felt:#C7BA9B;
  --ink:#2A241C;
  --ink-2:#6B6152;
  --ink-3:#968B78;
  --rule:rgba(42,36,28,.16);
  --rule-2:rgba(42,36,28,.08);
  --brass:#A9793F;
  --brass-2:#D9B57C;
  --shadow:0 1px 2px rgba(42,36,28,.13),0 6px 18px -10px rgba(42,36,28,.28);
  --shadow-lg:0 2px 6px rgba(42,36,28,.16),0 22px 46px -20px rgba(42,36,28,.42);
  --radius:5px;             /* UI chrome — pills, chips, fields */
  --radius-d:3px;           /* drawers. A drawer front is not a rounded rect. */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="walnut"]{
  --paper:#191510;
  --paper-2:#231E18;
  --paper-3:#2E2820;
  --felt:#3A3228;
  --ink:#F0E8D9;
  --ink-2:#A29786;
  --ink-3:#7A7062;
  --rule:rgba(240,232,217,.14);
  --rule-2:rgba(240,232,217,.07);
  --brass:#D7AE72;
  --brass-2:#8A6A3C;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px -14px rgba(0,0,0,.8);
  --shadow-lg:0 2px 8px rgba(0,0,0,.55),0 40px 70px -28px rgba(0,0,0,.9);
}
/* Custom background/accent/outline are written as inline custom properties on
   <html> by applyLook() in section 4b — an inline property beats any selector
   here, so it overrides whichever theme is active without a third theme block. */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);overscroll-behavior:none;
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box;border:3px solid transparent}

/* ============================================================
   App shell
   ============================================================ */
#frame{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.seg{display:flex;background:var(--paper-3);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:4px 11px;border-radius:7px;font-size:12px;color:var(--ink-2);font-weight:500;transition:.15s}
.seg button[aria-pressed="true"]{background:var(--paper-2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.iconbtn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);transition:.15s}
.iconbtn:hover{background:var(--paper-3);color:var(--ink)}
.banner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;font-size:12px;
  background:color-mix(in srgb,var(--brass) 16%,transparent);color:var(--ink);margin-bottom:10px}
.banner button{margin-left:auto;font-weight:600;color:var(--brass);white-space:nowrap}

/* ============================================================
   App shell
   ============================================================ */
.app{position:absolute;inset:0;display:flex;overflow:hidden;padding-top:env(safe-area-inset-top)}
.rail{
  position:relative;
  width:var(--railw,212px);flex:0 0 var(--railw,212px);border-right:1px solid var(--rule);
  background:color-mix(in srgb,var(--paper-2) 55%, transparent);
  display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto;overflow-x:hidden;
}
.is-phone .rail{display:none}
.rail-hidden .rail{display:none}
/* drag the rail's right edge to resize it. The grip is a sibling of the rail,
   not a child — inside it the rail's own overflow clips and scrolls it away. */
.railgrip{
  position:absolute;top:0;bottom:0;left:calc(var(--railw,212px) - 3px);
  width:9px;cursor:ew-resize;z-index:20;
}
.railgrip::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:var(--brass);opacity:0;transition:opacity .15s}
.railgrip:hover::after,.railgrip.on::after{opacity:.8}
.is-phone .railgrip,.rail-hidden .railgrip{display:none}
/* a drag must never turn into a text selection */
.dragging-ui,.dragging-ui *{user-select:none!important;cursor:ew-resize}
/* the button that brings a hidden rail back */
.railshow{
  position:absolute;left:8px;top:calc(env(safe-area-inset-top) + 14px);z-index:25;
  width:28px;height:28px;border-radius:var(--radius);display:none;place-items:center;
  color:var(--ink-2);background:var(--paper-2);border:1px solid var(--rule);
}
.rail-hidden .railshow{display:grid}
.is-phone .railshow{display:none!important}
.rail-hidden .topbar{padding-left:46px}
.rail .wordmark{font-family:var(--serif);font-size:21px;font-weight:600;padding:4px 10px 14px;letter-spacing:.01em;
  display:flex;align-items:center;gap:6px}
.rail .railhide{margin-left:auto;flex:0 0 auto;opacity:0;transition:opacity .15s}
.rail:hover .railhide{opacity:1}
.rail .wordmark em{font-style:normal;color:var(--brass)}
.navitem{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;
  color:var(--ink-2);font-size:13.5px;font-weight:500;transition:.12s;width:100%;text-align:left;
}
.navitem:hover{background:var(--paper-3);color:var(--ink)}
.navitem.on{background:color-mix(in srgb,var(--brass) 15%, transparent);color:var(--ink)}
.navitem .ico{width:17px;display:grid;place-items:center;color:var(--ink-3)}
.navitem.on .ico{color:var(--brass)}
.navitem .n{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rail .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);padding:16px 10px 6px;font-weight:600}
.tagchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;
  background:var(--paper-3);color:var(--ink-2);border:1px solid var(--rule-2)}
.tagchip.on{background:color-mix(in srgb,var(--brass) 22%, transparent);color:var(--ink);border-color:transparent}
.rail .tagwrap{display:flex;flex-wrap:wrap;gap:5px;padding:2px 8px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 22px 10px;
}
.is-phone .topbar{padding:12px 16px 8px}
.topbar h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;letter-spacing:.005em}
.is-phone .topbar h1{font-size:23px}
.topbar .sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.topbar .grow{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12.5px;
  font-weight:500;background:var(--paper-2);border:1px solid var(--rule);color:var(--ink-2);transition:.15s;white-space:nowrap
}
.pill:hover{border-color:var(--brass);color:var(--ink)}
.pill.solid{background:var(--ink);color:var(--paper);border-color:transparent}
html[data-theme="walnut"] .pill.solid{background:var(--brass);color:#20180E}
.pill.solid:hover{opacity:.9}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 22px 120px}
.is-phone .scroll{padding:4px 14px 110px}

/* ============================================================
   Drawers grid
   ============================================================ */
/* Explicit x/y placement: every drawer names its column and row, so the grid is
   a coordinate space, not a flow. No auto-flow — an empty cell stays empty. */
.grid{display:grid;gap:10px;align-content:start;position:relative}
.grid.g-desk{grid-template-columns:repeat(var(--cols,6),1fr);grid-auto-rows:var(--rowh,104px)}
.grid.g-phone{grid-template-columns:repeat(var(--cols,4),1fr);grid-auto-rows:var(--rowh,84px);gap:8px;max-width:520px}

.drawer{
  position:relative;border-radius:var(--radius-d);overflow:hidden;text-align:left;
  background:var(--c);
  border:1px solid var(--line,rgba(0,0,0,.28));
  box-shadow:var(--shadow);
  transition:box-shadow .18s,filter .18s;
  display:flex;flex-direction:column;padding:11px 13px;isolation:isolate;
  /* Drawer fronts are solid mid-dark colours, so everything inside reads light. */
  --dink:#F8F3E6;--dink-2:rgba(248,243,230,.76);--dink-3:rgba(248,243,230,.54);
  color:var(--dink);
}
.drawer:hover{box-shadow:var(--shadow-lg);filter:brightness(1.07)}
.drawer:active{filter:brightness(.96)}
.drawer .dtop{display:flex;align-items:center;gap:7px}
.drawer .swatch{display:none}
.drawer .dname{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dink)}
.drawer .dcount{margin-left:auto;font-size:11px;color:var(--dink-2);font-variant-numeric:tabular-nums;
  background:rgba(0,0,0,.20);border:1px solid rgba(255,255,255,.14);padding:1px 7px;border-radius:20px}
.drawer .dbody{flex:1;min-height:0;margin-top:8px;overflow:hidden;position:relative}
.drawer .dfoot{
  margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:center;
}
.pull{
  width:54px;height:6px;border-radius:1px;flex:0 0 auto;
  background:var(--brass);
  box-shadow:0 1px 0 rgba(0,0,0,.28);
  opacity:.9;transition:opacity .18s;
}
.drawer:hover .pull{opacity:1}
.drawer.h1{padding:9px 12px}
.drawer.h1 .dbody{margin-top:5px}
.drawer.h1 .dfoot{padding-top:5px}
.drawer.h1 .pv-big{flex-direction:row;align-items:baseline;gap:7px}
.drawer.h1 .pv-big .num{font-size:24px}
.drawer.h1 .pv-big .cap{margin-top:0}
.drawer.h1 .pv-list .r:nth-child(n+3){display:none}
.drawer.h1 .pv-thumbs{grid-template-columns:repeat(6,1fr)}
.drawer.h1 .pv-stack .card:nth-child(n+2){display:none}
.drawer.h1 .pv-bars{gap:4px}

/* preview styles inside drawers — all on a solid colour, so light-on-dark */
.pv-list{display:flex;flex-direction:column;gap:4px}
.pv-list .r{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dink-2);white-space:nowrap;overflow:hidden;min-width:0}
.pv-list .r span.lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pv-list .r .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75;flex:0 0 auto}
.pv-list .r.done{color:var(--dink-3);text-decoration:line-through}
.pv-stack{position:relative;height:100%}
.pv-stack .card{
  position:absolute;left:0;right:0;height:30px;border-radius:2px;background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.13);padding:7px 9px;font-size:11.5px;
  color:var(--dink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  border-left:3px solid rgba(255,255,255,.4);
}
.pv-big{display:flex;flex-direction:column;justify-content:center;height:100%}
.pv-big .num{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600;letter-spacing:-.02em;color:var(--dink)}
.pv-big .cap{font-size:11.5px;color:var(--dink-3);margin-top:3px}
.pv-thumbs{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:5px;height:100%}
.drawer.h1 .pv-thumbs{grid-template-rows:1fr}
.pv-thumbs i{border-radius:2px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.10);display:block}
.pv-bars{display:flex;flex-direction:column;gap:7px;justify-content:center;height:100%}
.pv-bars .b{height:5px;border-radius:2px;background:rgba(0,0,0,.26);overflow:hidden}
.pv-bars .b i{display:block;height:100%;background:var(--dink-2);border-radius:2px}

/* ------------------------------------------------------------
   arrange mode — move and resize like a window on a grid
   ------------------------------------------------------------ */
.grid.arranging{
  /* the grid itself becomes visible graph paper while you arrange */
  background-image:linear-gradient(to right,var(--rule-2) 1px,transparent 1px),
                   linear-gradient(to bottom,var(--rule-2) 1px,transparent 1px);
  background-size:var(--cellw,100px) var(--cellstep,114px);
  outline:1px dashed var(--rule);outline-offset:6px;
}
.arranging .drawer{cursor:grab;user-select:none}
.arranging .drawer:active{cursor:grabbing}
.drawer.dragging{opacity:.85;z-index:40;box-shadow:var(--shadow-lg);cursor:grabbing}
.drawer.invalid{outline:2px solid #C0563F;outline-offset:-2px}

/* the cells a dragged/resized drawer would land on */
.ghost{
  border:1.5px dashed var(--brass);background:color-mix(in srgb,var(--brass) 14%,transparent);
  border-radius:var(--radius-d);pointer-events:none;z-index:1;
}
.ghost.bad{border-color:#C0563F;background:rgba(192,86,63,.14)}

/* eight handles, like a window. Bigger hit area than they look. */
.rz{position:absolute;z-index:30;display:none}
.arranging .rz{display:block}
.rz::after{content:"";position:absolute;inset:0}
.rz.n {top:-4px;left:10px;right:10px;height:9px;cursor:ns-resize}
.rz.s {bottom:-4px;left:10px;right:10px;height:9px;cursor:ns-resize}
.rz.w {left:-4px;top:10px;bottom:10px;width:9px;cursor:ew-resize}
.rz.e {right:-4px;top:10px;bottom:10px;width:9px;cursor:ew-resize}
.rz.nw{top:-4px;left:-4px;width:14px;height:14px;cursor:nwse-resize}
.rz.ne{top:-4px;right:-4px;width:14px;height:14px;cursor:nesw-resize}
.rz.sw{bottom:-4px;left:-4px;width:14px;height:14px;cursor:nesw-resize}
.rz.se{bottom:-4px;right:-4px;width:14px;height:14px;cursor:nwse-resize}
/* corner grips get a visible mark; edges stay invisible until hover */
.rz.nw::before,.rz.ne::before,.rz.sw::before,.rz.se::before{
  content:"";position:absolute;inset:3px;background:var(--dink);opacity:.5;border-radius:1px
}
.rz:hover::before{opacity:1}
.arranging .drawer:hover .rz.n::before,.arranging .drawer:hover .rz.s::before,
.arranging .drawer:hover .rz.w::before,.arranging .drawer:hover .rz.e::before{
  content:"";position:absolute;inset:3px;background:var(--dink);opacity:.28;border-radius:1px
}
.sizebtns{position:absolute;top:6px;right:6px;display:none;gap:3px;z-index:31}
.arranging .sizebtns{display:flex}
.arranging .drawer .dcount{visibility:hidden}  /* the size chip sits here instead */
.sizebtns b{
  font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:3px 6px;border-radius:3px;
  background:rgba(0,0,0,.42);color:var(--dink);cursor:pointer;font-variant-numeric:tabular-nums
}
.sizebtns b:hover{background:rgba(0,0,0,.68)}
.drawer.addnew{background:none;border:1.5px dashed var(--rule);box-shadow:none;align-items:center;justify-content:center;color:var(--ink-3);--dink:var(--ink-3)}
.drawer.addnew:hover{border-color:var(--brass);color:var(--brass);filter:none}

/* ============================================================
   Object rows
   ============================================================ */
.section-h{display:flex;align-items:center;gap:8px;margin:22px 0 9px;}
.section-h h2{font-family:var(--serif);font-size:16px;font-weight:600;margin:0;letter-spacing:.01em}
.section-h .rule{flex:1;height:1px;background:var(--rule)}
.section-h .n{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.rows{display:flex;flex-direction:column;gap:5px}
.rowwrap{position:relative;border-radius:11px;overflow:hidden}
.rowwrap .swipebg{position:absolute;inset:0;opacity:0;transition:opacity .12s;z-index:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:600;color:#fff}
.rowwrap.swiping .swipebg{opacity:1}
.rowwrap .swipebg::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#3E8E5A 50%,#C0563F 50%);}
.rowwrap .swipebg span{position:relative;z-index:1}
.row{
  position:relative;display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:11px;
  background:var(--paper-2);border:1px solid var(--rule);cursor:pointer;z-index:1;
  transition:border-color .15s,background .15s,transform .06s;
  touch-action:pan-y;
}
.row:hover{border-color:color-mix(in srgb,var(--k) 40%, var(--rule));background:color-mix(in srgb,var(--k) 4%, var(--paper-2))}
.row.dragging{opacity:.4}
.row.sel{border-color:var(--brass);box-shadow:0 0 0 2px color-mix(in srgb,var(--brass) 25%,transparent)}
.check{
  width:19px;height:19px;flex:0 0 auto;border-radius:6px;border:1.6px solid var(--ink-3);margin-top:1px;
  display:grid;place-items:center;transition:.15s;
}
.check:hover{border-color:var(--k)}
.check.on{background:var(--k);border-color:var(--k);color:#fff}
.check svg{opacity:0;transform:scale(.5);transition:.15s}
.check.on svg{opacity:1;transform:scale(1)}
.kindmark{
  width:22px;height:22px;flex:0 0 auto;border-radius:7px;display:grid;place-items:center;margin-top:0px;
  background:color-mix(in srgb,var(--k) 17%, transparent);color:var(--k);
}
.row .body{flex:1;min-width:0}
.row .title{font-size:13.5px;font-weight:500;letter-spacing:.003em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .title{color:var(--ink-3);text-decoration:line-through}
.row .snip{font-size:12px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3);white-space:nowrap}
.mchip.k{color:var(--k);font-weight:600;letter-spacing:.02em;text-transform:lowercase}
.mchip.late{color:#C0563F;font-weight:600}
.mchip.tag{color:var(--ink-2);background:var(--paper-3);padding:1px 7px;border-radius:20px}
.rowacts{display:flex;gap:2px;opacity:0;transition:.15s;margin-left:4px}
.row:hover .rowacts{opacity:1}
.is-phone .rowacts{display:none}
.rowacts button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.rowacts button:hover{background:var(--paper-3);color:var(--ink)}
.grip{color:var(--ink-3);opacity:0;cursor:grab;display:grid;place-items:center;width:16px;align-self:center}
.row:hover .grip{opacity:.55}
.dropline{height:2px;background:var(--brass);border-radius:2px;margin:2px 0}

/* card grid view */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
.is-phone .cards{grid-template-columns:repeat(2,1fr);gap:9px}
.ocard{
  border-radius:12px;background:var(--paper-2);border:1px solid var(--rule);padding:12px;text-align:left;
  min-height:118px;display:flex;flex-direction:column;gap:6px;transition:.16s;box-shadow:var(--shadow);cursor:pointer;
  border-top:3px solid var(--k);
}
.ocard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.ocard .t{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.25}
.ocard .s{font-size:11.5px;color:var(--ink-3);line-height:1.45;flex:1;overflow:hidden}
.ocard .media{height:64px;border-radius:8px;background:linear-gradient(135deg,color-mix(in srgb,var(--k) 50%,transparent),color-mix(in srgb,var(--k) 14%,transparent));display:grid;place-items:center;color:#fff}

/* ============================================================
   Object detail
   ============================================================ */
.sheet{
  position:absolute;inset:0;z-index:40;padding-top:env(safe-area-inset-top);background:var(--paper);display:flex;flex-direction:column;
  transform:translateY(14px);opacity:0;pointer-events:none;transition:.24s cubic-bezier(.2,.9,.3,1);
}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 20px 10px;border-bottom:1px solid var(--rule-2)}
.is-phone .sheet-h{padding:14px}
.sheet-b{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 140px}
.is-phone .sheet-b{padding:16px 14px 140px}
.detail-wrap{max-width:720px;margin:0 auto}
.kindbadge{

}

.editor{

.prose li{margin:.22em 0}
.prose blockquote{margin:0 0 .9em;padding:2px 0 2px 15px;border-left:3px solid var(--brass);color:var(--ink-2);font-style:italic}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--paper-3);padding:1.5px 5px;border-radius:5px}
.prose hr{border:0;border-top:1px solid var(--rule);margin:1.6em 0}

.weekstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.wday{
  flex:0 0 auto;width:52px;padding:8px 0;border-radius:11px;text-align:center;border:1px solid var(--rule);

}

.wday .pips i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--rule)}
.tl-item{position:relative;padding:7px 0}

.tl-date{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.modal{

}
.scrim.open .modal{transform:none}
.modal-h{padding:15px 18px 11px;border-bottom:1px solid var(--rule-2)}
.modal-h .t{font-family:var(--serif);font-size:17px;font-weight:600}

.kindgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}

.kindtile .ds{font-size:10.5px;color:var(--ink-3);line-height:1.35}

.cmd{width:min(560px,100%);align-self:flex-start;margin-top:8vh}
.cmdinput{width:100%;border:0;background:none;outline:none;font-size:17px;padding:16px 18px;font-family:var(--serif)}

.cmdrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px}

.fab{
  position:absolute;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:17px;z-index:35;

}

.fab:active{transform:scale(.94)}
.is-desk .fab{display:none}

.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));

.toast{
  position:absolute;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:80;
  background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:12px;font-size:12.5px;font-weight:500;

.toast.show{opacity:1;transform:translate(-50%,0)}
.toast u{cursor:pointer;color:var(--brass-2);text-decoration:none;font-weight:700}

.ctxmenu{

.custcol{display:inline-flex;align-items:center;gap:8px;margin-top:4px;cursor:pointer;

.rowwrap.swiping .row{transition:none}
.rowwrap .row{will-change:transform}

  };

function defaultLook(){
  return {bg:null, accent:null, line:null, railw:212, railHidden:false};

// which drawer layout we are looking at — the real device, unless you have
// deliberately opened the other one to arrange it
const dev = ()=> S.layoutEdit || S.device;
const byId = id => S.objects.find(o=>o.id===id);
const drawerById = id => S.drawers.find(d=>d.id===id);

// A drawer is BOTH a smart filter and a real container: anything filed here by
// hand shows up, plus anything matching the drawer's rule.
function inDrawer(d,o){
  const f=d.filter||{};
  if(f.done) return !!o.done;          // the archive drawer
  if(o.done) return false;             // finished things leave their drawer
  if(o.drawer===d.id) return true;     // filed by hand
  if(f.due==='today') return !!o.due && D.parse(o.due)<=D.today();
  if(f.kinds) return f.kinds.includes(o.kind);
  return false;
}
const contents = d => S.objects.filter(o=>inDrawer(d,o)).sort((a,b)=>a.ord-b.ord);

/* ------------------------------------------------------------
   4b · the grid — one coordinate space per device
   ------------------------------------------------------------
   Drawers hold {x,y,w,h} in 1-based grid cells, per device. The grid does not
   flow: an empty cell stays empty, because position is meant to carry meaning.
   Two drawers may never occupy the same cell — a move or resize that would
   overlap is refused rather than shoving a neighbour out of the way, so nothing
   you arranged ever moves without you.                                        */
const GRID = {
  desk:  {cols:6, rowh:104, gap:10},
  phone: {cols:4, rowh:84,  gap:8}
};
const gridOf = (device)=> GRID[device||dev()];
// Tolerate a drawer that predates x/y, or one hand-edited into nonsense.
function lay(d, device){
  const g=gridOf(device), b=d[device||dev()]||{};
  const w=clamp(b.w||2,1,g.cols), h=clamp(b.h||1,1,40);
  return {x:clamp(b.x||1,1,g.cols-w+1), y:Math.max(1,b.y||1), w, h};
}
const overlaps = (a,b)=> a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h;
// Is `box` a legal home for drawer `id`? Inside the columns, and touching nobody.
function boxOk(box, id, device){
  const g=gridOf(device);
  if(box.x<1 || box.y<1 || box.w<1 || box.h<1 || box.x+box.w-1>g.cols) return false;
  return !S.drawers.some(d=>d.id!==id && overlaps(box, lay(d,device)));
}
// Lowest free spot for a new drawer, scanning left-to-right then down.
function freeSpot(w,h,device){
  const g=gridOf(device);
  for(let y=1;y<200;y++) for(let x=1;x<=g.cols-w+1;x++){
    const box={x,y,w,h};
    if(boxOk(box,null,device)) return box;
  }
  return {x:1,y:1,w,h};
}
const gridRows = (device)=> S.drawers.reduce((m,d)=>{const b=lay(d,device);return Math.max(m,b.y+b.h-1)},0);

/* Appearance: custom background, accent and drawer outline. Written as inline
   custom properties on <html>, which beat both theme blocks. */
function applyLook(){
  const el=document.documentElement, L=S.look||defaultLook();
  if(L.bg){
    el.style.setProperty('--paper', L.bg);
    el.style.setProperty('--paper-2', `color-mix(in srgb, ${L.bg} 84%, #fff)`);
    el.style.setProperty('--paper-3', `color-mix(in srgb, ${L.bg} 90%, #000)`);
  } else ['--paper','--paper-2','--paper-3'].forEach(p=>el.style.removeProperty(p));
  if(L.accent) el.style.setProperty('--brass', L.accent); else el.style.removeProperty('--brass');
  if(L.line) el.style.setProperty('--line', L.line); else el.style.removeProperty('--line');
  el.style.setProperty('--railw', (L.railw||212)+'px');
}

function streak(o){
  const set=new Set(o.history||[]); let n=0, d=D.today();
  if(!set.has(D.iso(d))) d=D.add(d,-1);
  while(set.has(D.iso(d))){ n++; d=D.add(d,-1); }
  return n;
}

/* ============================================================
   5 · markdown (small, sufficient)
   ============================================================ */
function md(src){
  if(!src||!src.trim()) return '<p style="color:var(--ink-3)">Nothing written yet.</p>';
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[]; let list=null;
  const close=()=>{ if(list){out.push(`</${list}>`); list=null;} };
  src.split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();
    if(!l){ close(); return; }
    let m;
    if(/^---+$/.test(l)){ close(); out.push('<hr>'); return; }
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ close(); const n=Math.min(m[1].length+1,4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); return; }
    if((m=l.match(/^>\s?(.*)$/))){ close(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); return; }
    if((m=l.match(/^[-*]\s+\[([ xX])\]\s+(.*)$/))){
      if(list!=='ul'){close(); out.push('<ul>'); list='ul';}
      const on=m[1].toLowerCase()==='x';
      out.push(`<li class="tick${on?' on':''}"><b></b>${inline(m[2])}</li>`); return;
    }
    if((m=l.match(/^[-*]\s+(.*)$/))){ if(list!=='ul'){close(); out.push('<ul>'); list='ul';} out.push(`<li>${inline(m[1])}</li>`); return; }
    if((m=l.match(/^\d+[.)]\s+(.*)$/))){ if(list!=='ol'){close(); out.push('<ol>'); list='ol';} out.push(`<li>${inline(m[1])}</li>`); return; }
    close(); out.push(`<p>${inline(l)}</p>`);
  });
  close();
  return out.join('');
}
const strip = s => String(s||'').replace(/[#>*`\-\[\]]/g,' ').replace(/\s+/g,' ').trim();

/* ============================================================
   6 · mutations
   ============================================================ */
function toast(msg,undo){
  const t=$('#toast');
  t.innerHTML = esc(msg) + (undo?' <u data-undo="1">Undo</u>':'');
  t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),3400);
}
function nextDue(o){
  if(!o.repeat||!o.due) return null;
  const r=o.repeat;
  if(r==='daily') return D.addISO(o.due,1);
  if(r==='weekly') return D.addISO(o.due,7);
  if(r==='monthly'){ const d=D.parse(o.due); d.setMonth(d.getMonth()+1); return D.iso(d); }
  if(r==='weekdays'){ let d=D.parse(o.due); do{ d=D.add(d,1);}while(d.getDay()===0||d.getDay()===6); return D.iso(d); }
  return null;
}
function toggleDone(id){
  const o=byId(id); if(!o) return;
  if(K(o.kind).habit){ toggleHabit(id); return; }
  o.done=!o.done;
  if(o.done){
    o.doneAt=T;
    const nd=nextDue(o);
    if(nd){
      S.objects.push(Object.assign({},o,{id:uid('o'),done:false,doneAt:null,due:nd,ord:o.ord+0.5}));
      o.kind='record'; o.drawer='d_done'; o.title=o.title;
      toast(`Done · repeats ${D.human(nd).toLowerCase()}`);
    } else toast('Filed under Done & Dusted');
  } else { o.doneAt=null; }
  render();
}
function toggleHabit(id){
  const o=byId(id); if(!o) return;
  o.history=o.history||[];
  const i=o.history.indexOf(T);
  if(i>=0) o.history.splice(i,1); else { o.history.push(T); toast(`${o.title} · ${streak(o)+0} day streak`); }
  render();
}
function del(id){
  const i=S.objects.findIndex(o=>o.id===id); if(i<0) return;
  S.trash={o:S.objects[i], i};
  S.objects.splice(i,1);
  if(S.openId===id) closeSheet();
  toast('Deleted', true); render();
}
function undo(){
  if(!S.trash) return;
  S.objects.splice(S.trash.i,0,S.trash.o); S.trash=null;
  $('#toast').classList.remove('show'); render();
}
function create(kind, patch){
  const k=K(kind);
  const o = Object.assign({
    id:uid('o'), kind, title:'', body:k.body||'', tags:[], drawer:(S.view==='drawer'&&S.drawerId)||'d_in',
    done:false, doneAt:null, due:k.sched?T:null, repeat:k.habit?'daily':null,
    history:[], milestones:k.goal?[{t:'First milestone',done:false,d:dz(30)}]:[],
    media:k.media?{type:'image',label:'Attach a file'}:null,
    ord:Math.min(0,...S.objects.map(o=>o.ord))-1, created:T
  }, patch||{});
  // route into a drawer that will actually show it
  const home=S.drawers.find(d=>d.filter&&d.filter.kinds&&d.filter.kinds.includes(kind));
  if(!patch||!patch.drawer){ if(home) o.drawer=home.id; }
  S.objects.push(o);
  return o;
}
function quickAdd(text, kind, drawerId){
  let t=text.trim(); if(!t) return null;
  let k=kind||'task', due=null; const tags=[];
  const slash=t.match(/^\/(\w+)\s+/);
  if(slash){ const found=KEYS.find(x=>x.startsWith(slash[1].toLowerCase())); if(found){ k=found; t=t.slice(slash[0].length); } }
  t=t.replace(/#([\w-]+)/g,(m,g)=>{tags.push(g);return '';});
  if(/!today\b/i.test(t)){ due=T; t=t.replace(/!today\b/i,''); }
  if(/!tomorrow\b/i.test(t)){ due=dz(1); t=t.replace(/!tomorrow\b/i,''); }
  if(/!week\b/i.test(t)){ due=dz(7); t=t.replace(/!week\b/i,''); }
  t=t.replace(/\s+/g,' ').trim();
  const o=create(k,{title:t, tags, drawer:drawerId||undefined, body:''});
  if(due) o.due=due; else if(!K(k).sched) o.due=null;
  return o;
}

function drawerPreview(d, items){

    return `<div class="pv-big"><div class="num">${n}</div><div class="cap">${cap}</div></div>`;
  }
  if(d.pv==='stack'){
    return `<div class="pv-stack">${items.slice(0,3).map((o,i)=>
      `<div class="card" style="--k:${K(o.kind).c};--rot:${(i-1)*0.8}deg;top:${i*34}px;z-index:${3-i}">${esc(o.title||'Untitled')}</div>`).join('')}</div>`;

    return `<div class="pv-bars">${items.slice(0,4).map(o=>{

function row(o){
  const k=K(o.kind);
  const late=!o.done&&D.overdue(o.due);
  const meta=[];
  meta.push(`<span class="mchip k">${k.nm.toLowerCase()}</span>`);
  if(o.due&&!k.habit) meta.push(`<span class="mchip${late?' late':''}">${ic('calendar',11)} ${D.human(o.due)}</span>`);
  if(o.repeat&&!k.habit) meta.push(`<span class="mchip">${ic('repeat',11)} ${o.repeat}</span>`);
  if(k.habit) meta.push(`<span class="mchip">${ic('repeat',11)} ${streak(o)}-day streak</span>`);
  if(k.goal) meta.push(`<span class="mchip">${ic('target',11)} ${goalPct(o)}%</span>`);
  if(o.media) meta.push(`<span class="mchip">${ic(o.media.type==='audio'?'music':o.media.type==='video'?'film':'image',11)} ${esc(o.media.label)}</span>`);
  (o.tags||[]).slice(0,3).forEach(t=>meta.push(`<span class="mchip tag">${esc(t)}</span>`));
  const snip=strip(o.body).slice(0,90);
  const lead = k.checkable||k.habit
    ? `<span class="check${(k.habit? (o.history||[]).includes(T) : o.done)?' on':''}" data-check="${o.id}">${ic('check',13)}</span>`
    : `<span class="kindmark">${ic(k.ic,13)}</span>`;
  return `<div class="rowwrap" data-wrap="${o.id}">
    <div class="swipebg"><span>${ic('check',13)} File</span><span>Delete ${ic('trash',13)}</span></div>
    <div class="row${o.done?' done':''}" data-row="${o.id}" style="--k:${k.c}">
      <span class="grip" data-grip="1">${ic('grip',14)}</span>
      ${lead}
      <div class="body">
        <div class="title">${esc(o.title||'Untitled')}</div>
        ${snip?`<div class="snip">${esc(snip)}</div>`:''}
        <div class="meta">${meta.join('')}</div>
      </div>
      <div class="rowacts">
        <button data-menu="${o.id}" title="More">${ic('more',15)}</button>
        <button data-del="${o.id}" title="Delete">${ic('trash',15)}</button>
      </div>
    </div></div>`;
}
function card(o){

/* ============================================================
   19 · gestures: swipe + drag reorder
   ============================================================ */
let G=null;

/* Width of one grid column in px, measured rather than assumed — the grid is
   fluid (repeat(cols,1fr)) so this changes with the window and the rail. */
function cellW(grid,g){
  const r=grid.getBoundingClientRect();
  return (r.width - g.gap*(g.cols-1))/g.cols;
}
/* Where a move/resize would land, in grid cells. Dragging an edge moves that
   edge only; dragging a corner moves both of its edges — same as a window. */
function candidate(g, cx, cy){
  const b=g.box, hd=g.handle;
  if(g.type==='move') return {x:b.x+cx, y:b.y+cy, w:b.w, h:b.h};
  let x=b.x, y=b.y, w=b.w, h=b.h;
  if(hd.includes('e')) w=b.w+cx;
  if(hd.includes('w')){ x=b.x+cx; w=b.w-cx; }
  if(hd.includes('s')) h=b.h+cy;
  if(hd.includes('n')){ y=b.y+cy; h=b.h-cy; }
  if(w<1){ if(hd.includes('w')) x=b.x+b.w-1; w=1; }   // never invert the box
  if(h<1){ if(hd.includes('n')) y=b.y+b.h-1; h=1; }
  return {x,y,w,h};
}
function place(el, b){
  el.style.gridColumn=`${b.x} / span ${b.w}`;
  el.style.gridRow=`${b.y} / span ${b.h}`;
}

function onDown(e){
  if(e.button===2) return;
  const app=$('#app');
  // resizing the sidebar
  if(e.target.closest('.railgrip')){
    const rail=$('.rail'); if(!rail) return;
    e.preventDefault();
    G={type:'rail', el:e.target.closest('.railgrip'), w0:rail.getBoundingClientRect().width,
       sx:e.clientX, sy:e.clientY, mode:'rail'};
    G.el.classList.add('on');
    document.body.classList.add('dragging-ui');
    G.el.setPointerCapture&&G.el.setPointerCapture(e.pointerId);
    return;
  }
  const dEl=e.target.closest('.drawer[data-drawer]');
  if(S.arrange && dEl && !e.target.closest('.sizebtns')){
    const d=drawerById(dEl.dataset.drawer), grid=$('#drawergrid');
    if(!d || !grid) return;
    const hEl=e.target.closest('[data-rz]'), g=gridOf();
    G={type: hEl?'resize':'move', el:dEl, id:d.id, handle:hEl?hEl.dataset.rz:null,
       box:lay(d), stepX:cellW(grid,g)+g.gap, stepY:g.rowh+g.gap,
       sx:e.clientX, sy:e.clientY, mode:null, ok:true, cand:null};
    dEl.setPointerCapture&&dEl.setPointerCapture(e.pointerId);
    return;
  }
  const rEl=e.target.closest('.row[data-row]');
  if(!rEl) return;
  if(e.target.closest('[data-check],[data-del],[data-menu],[data-habit]')) return;
  const list=rEl.closest('.rows');
  const canDrag = e.pointerType==='mouse' || (list&&list.classList.contains('reordering'));
  G={type:'row', el:rEl, wrap:rEl.parentElement, sx:e.clientX, sy:e.clientY, mode:null, canDrag, t:Date.now()};
  rEl.setPointerCapture&&rEl.setPointerCapture(e.pointerId);
}
function onMove(e){
  if(!G) return;
  const dx=e.clientX-G.sx, dy=e.clientY-G.sy;

  if(G.mode==='rail'){
    const g=GRID.desk;
    // snap the rail to the same column step the drawer grid uses
    const raw=clamp(G.w0+dx, 0, 460);
    const step=(raw<120) ? raw : Math.round(raw/24)*24;
    document.documentElement.style.setProperty('--railw', Math.max(150,step)+'px');
    G.railw=Math.max(150,step);
    G.hide = raw<120;
    $('#frame').classList.toggle('rail-hidden', G.hide);
    return;
  }

  if(G.type==='move' || G.type==='resize'){
    if(!G.mode){
      if(Math.abs(dx)<5 && Math.abs(dy)<5) return;
      G.mode='grid';
      G.el.classList.add('dragging');
      if(G.type==='move'){
        G.ghost=document.createElement('div');
        G.ghost.className='ghost';
        place(G.ghost, G.box);
        G.el.parentElement.appendChild(G.ghost);
      }
    }
    const box=candidate(G, Math.round(dx/G.stepX), Math.round(dy/G.stepY));
    G.cand=box; G.ok=boxOk(box, G.id);
    G.el.classList.toggle('invalid', !G.ok);
    if(G.type==='move'){
      G.el.style.transform=`translate(${dx}px,${dy}px)`;
      G.ghost.className='ghost'+(G.ok?'':' bad');
      place(G.ghost, box);
    } else {
      place(G.el, box);            // live resize, like dragging a window edge
    }
    return;
  }

  if(!G.mode){
    if(Math.abs(dx)<7 && Math.abs(dy)<7) return;
    if(Math.abs(dx)>Math.abs(dy)){ G.mode='swipe'; G.wrap.classList.add('swiping'); }
    else if(G.canDrag){ G.mode='drag'; G.wrap.classList.add('dragging'); G.wrap.style.opacity='.35'; G.wrap.style.pointerEvents='none'; }
    else { G.mode='none'; }
  }
  if(G.mode==='swipe'){ G.el.style.transform=`translateX(${clamp(dx,-140,140)}px)`; }
  else if(G.mode==='drag'){
    const under=document.elementFromPoint(e.clientX,e.clientY);
    if(!under) return;
    const t=under.closest('.rowwrap');
    if(t&&t!==G.wrap){ const p=t.parentElement, before=t.compareDocumentPosition(G.wrap)&Node.DOCUMENT_POSITION_FOLLOWING;
      p.insertBefore(G.wrap, before? t : t.nextSibling); }
  }
}
function onUp(e){
  if(!G) return;
  const g=G; G=null;
  const dx=e.clientX-g.sx;

  if(g.mode==='rail'){
    g.el.classList.remove('on');
    document.body.classList.remove('dragging-ui');
    S.look.railHidden = !!g.hide;
    if(!g.hide && g.railw) S.look.railw=g.railw;
    applyLook(); save(); render(); return;
  }

  if(g.mode==='grid'){
    g.el.classList.remove('dragging','invalid');
    g.el.style.transform='';
    if(g.ghost) g.ghost.remove();
    const d=drawerById(g.id);
    if(d && g.cand && g.ok) d[dev()]={...g.cand};
    save(); render();
    if(d && g.cand && !g.ok) toast('No room there');
    return;
  }

  if(g.mode==='swipe'){
    g.wrap.classList.remove('swiping');
    const id=g.el.dataset.row;
    if(dx<-72){ g.el.style.transform='translateX(-100%)'; setTimeout(()=>del(id),140); return; }
    if(dx>72){ g.el.style.transform='translateX(100%)'; setTimeout(()=>toggleDone(id),140); return; }
    g.el.style.transform='';
    return;
  }
  if(g.mode==='drag'){
    g.wrap.classList.remove('dragging'); g.wrap.style.opacity=''; g.wrap.style.pointerEvents='';
    const list=g.wrap.parentElement;
    $$('[data-wrap]',list).forEach((el,i)=>{ const o=byId(el.dataset.wrap); if(o) o.ord=i; });
    toast('Order saved');
    render(); return;
  }
  if(g.mode===null && Math.abs(dx)<7){
    // a tap
    if(g.type==='move'||g.type==='resize'){ if(S.arrange) modalDrawer(g.id); }
    else if(g.type==='row') openObj(g.el.dataset.row);
  }
}


/* ============================================================
   19b · persistence — everything stays on this device
   ============================================================ */
const APP_VERSION = '1.0';
const KEY = 'bureau.v1';
let deferredInstall = null;
let saveTimer = null;

function snapshot(){
  return {v:2, savedAt:new Date().toISOString(), theme:S.theme, listmode:S.listmode,
          look:S.look, drawers:S.drawers, objects:S.objects};
}
function writeNow(){
  try{ localStorage.setItem(KEY, JSON.stringify(snapshot())); }
  catch(e){ console.warn('Bureau could not save:', e.message); }
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(writeNow, 250); }
function storeSize(){ try{ return (localStorage.getItem(KEY)||'').length; }catch(e){ return 0; } }

/* v1 → v2: drawers carried only {w,h} and were laid out by flow order. Replay
   that same dense flow once to give every drawer real x/y coordinates, so an
   existing desk comes back looking exactly as its owner left it. */
function flowToCoords(drawers, device){
  const g=GRID[device], taken=[];
  const free=(box)=> box.x+box.w-1<=g.cols && !taken.some(t=>overlaps(box,t));
  drawers.forEach(d=>{
    const b=d[device]||{}, w=clamp(b.w||2,1,g.cols), h=clamp(b.h||1,1,40);
    if(b.x&&b.y){ taken.push({x:b.x,y:b.y,w,h}); d[device]={x:b.x,y:b.y,w,h}; return; }
    let placed=null;
    for(let y=1;y<400&&!placed;y++) for(let x=1;x<=g.cols-w+1;x++){
      const box={x,y,w,h};
      if(free(box)){ placed=box; break; }
    }
    placed=placed||{x:1,y:1,w,h};
    taken.push(placed); d[device]=placed;
  });
}
function adopt(d){
  if(!d || !Array.isArray(d.objects) || !Array.isArray(d.drawers)) return false;
  S.objects = d.objects.map(o=>Object.assign({tags:[],history:[],milestones:[],ord:0},o));
  S.drawers = d.drawers.map(x=>Object.assign({filter:{}},x));
  flowToCoords(S.drawers,'desk');
  flowToCoords(S.drawers,'phone');
  S.look = Object.assign(defaultLook(), d.look||{});
  if(d.theme) S.theme = d.theme;
  if(d.listmode) S.listmode = d.listmode;
  return true;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    return raw ? adopt(JSON.parse(raw)) : false;
  }catch(e){ return false; }
}
function exportBackup(){
  const name = `bureau-${D.iso(D.today())}.json`;
  const blob = new Blob([JSON.stringify(snapshot(),null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Backup saved · ' + name);
}
function importBackup(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      if(adopt(JSON.parse(fr.result))){ writeNow(); S.view='desk'; S.openId=null; render(); renderSheet(); toast('Desk restored'); }
      else toast('That file is not a Bureau backup');
    }catch(e){ toast('Could not read that file'); }
  };
  fr.readAsText(file);
}

/* ============================================================
   20 · event wiring
   ============================================================ */
function bindSortables(){ /* delegation handles it; keep quick-add focused */ }

function act(name, el){
  switch(name){
    case 'new': modalNewObject(); break;
    case 'newdrawer': modalDrawer(null); break;
    case 'arrange': S.arrange=!S.arrange; render(); break;
    case 'hiderail': S.look.railHidden=true; save(); render(); break;
    case 'showrail': S.look.railHidden=false; save(); render(); break;
    case 'reorder': S.reorder=!S.reorder; render(); break;
    case 'listmode': S.listmode = S.listmode==='rows'?'cards':'rows'; render(); break;
    case 'back': S.view='desk'; S.drawerId=null; S.kindFilter=null; render(); break;
    case 'cancel': hideModal(); break;
    case 'savedrawer': {
      const id=el.dataset.id, m=$('#modal'), draft=m._draft||{};
      const nm=$('#dnm').value.trim()||'Untitled drawer';
      if(id){ const d=drawerById(id); Object.assign(d,{nm,c:draft.c,pv:draft.pv}); d.filter={kinds:draft.kinds}; }
      else S.drawers.push({id:uid('d'),nm,c:draft.c,pv:draft.pv,filter:{kinds:draft.kinds},
        desk:freeSpot(2,2,'desk'), phone:freeSpot(2,2,'phone')});
      hideModal(); render(); toast(id?'Drawer updated':'Drawer added to the desk');
      break;
    }
    case 'deldrawer': {
      const id=el.dataset.id;
      S.drawers=S.drawers.filter(d=>d.id!==id);
      hideModal(); render(); toast('Drawer removed — objects kept');
      break;
    }
    case 'addtag': {
      const o=byId(S.openId); if(!o) return;
      const t=prompt('Tag'); if(t){ o.tags=o.tags||[]; if(!o.tags.includes(t.trim())) o.tags.push(t.trim().replace(/^#/,'')); renderSheet(); render(); }
      break;
    }
    case 'addmile': { const o=byId(S.openId); o.milestones.push({t:'New milestone',done:false,d:dz(30)}); renderSheet(); break; }
    case 'attach': { const o=byId(S.openId); o.media={type:'image',label:'photo-2026-08.heic · 4.2 MB'}; renderSheet(); render(); toast('Media attached'); break; }
    case 'dupe': { const o=byId(S.openId); const c=Object.assign({},o,{id:uid('o'),title:o.title+' (copy)',ord:o.ord+0.1}); S.objects.push(c); openObj(c.id); render(); break; }
    case 'sched': { const o=byId(S.openId); o.due=T; renderSheet(); render(); toast('Scheduled for today'); break; }
    case 'stopedit': S.layoutEdit=null; S.arrange=false; render(); break;
    case 'export': exportBackup(); break;
    case 'import': $('#importer').click(); break;
    case 'install': if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; } break;
    case 'reseed': { const th=S.theme, lk=S.look; reset(); S.theme=th; S.look=lk; applyLook(); writeNow(); render(); toast('Sample desk restored'); break; }
    case 'wipe': {
      if(!confirm('Erase every object and drawer on this device? This cannot be undone.')) return;
      const th=S.theme; reset(); S.theme=th; S.objects=[]; S.drawers=S.drawers.slice(0,3);
      writeNow(); render(); toast('Desk cleared'); break;
    }
  }
}

function wire(){
  const frame=$('#frame');

  frame.addEventListener('pointerdown', onDown);
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
  frame.addEventListener('pointercancel', ()=>{ if(G){ if(G.el) G.el.style.transform=''; G=null; } });

  frame.addEventListener('contextmenu', e=>{
    const r=e.target.closest('[data-row]'); if(!r) return;
    e.preventDefault(); openCtx(e.clientX,e.clientY,r.dataset.row);
  });

  frame.addEventListener('click', e=>{
    const t=e.target;
    if(!t.closest('#ctx')) closeCtx();

    const undoEl=t.closest('[data-undo]'); if(undoEl){ undo(); return; }
    const c=t.closest('[data-c]');
    if(c){ const [cmd,id]=c.dataset.c.split(':'); closeCtx();
      if(cmd==='open') openObj(id);
      else if(cmd==='done') toggleDone(id);
      else if(cmd==='today'){ byId(id).due=T; render(); toast('Scheduled today'); }
      else if(cmd==='tom'){ byId(id).due=dz(1); render(); toast('Scheduled tomorrow'); }
      else if(cmd==='move') modalMove(id);
      else if(cmd==='dupe'){ const o=byId(id); S.objects.push(Object.assign({},o,{id:uid('o'),title:o.title+' (copy)',ord:o.ord+0.1})); render(); }
      else if(cmd==='del') del(id);
      return; }

    const mv=t.closest('[data-moveto]');
    if(mv){ const [oid,did]=mv.dataset.moveto.split(':'); byId(oid).drawer=did; hideModal(); render(); renderSheet(); toast('Filed in '+drawerById(did).nm); return; }

    const nk=t.closest('[data-new]');
    if(nk){ hideModal(); const o=create(nk.dataset.new); render(); openObj(o.id); S.editing=true; renderSheet(); return; }

    const ck=t.closest('[data-check]'); if(ck){ toggleDone(ck.dataset.check); return; }
    const hb=t.closest('[data-habit]'); if(hb){ toggleHabit(hb.dataset.habit); return; }
    const dl=t.closest('[data-del]'); if(dl){ del(dl.dataset.del); return; }
    const mn=t.closest('[data-menu]'); if(mn){ const r=mn.getBoundingClientRect(); openCtx(r.left,r.bottom+4,mn.dataset.menu); return; }

    const ml=t.closest('[data-mile]');
    if(ml){ const [gid,i]=ml.dataset.mile.split(':'); const g=byId(gid); const m=g.milestones[+i];
      m.done=!m.done; if(m.done) toast('Milestone passed · '+m.t);
      render(); if(S.openId) renderSheet(); return; }
    const mdel=t.closest('[data-mdel]');
    if(mdel){ byId(S.openId).milestones.splice(+mdel.dataset.mdel,1); renderSheet(); render(); return; }

    const hd=t.closest('[data-hday]');
    if(hd){ const o=byId(S.openId); const ds=hd.dataset.hday; const i=o.history.indexOf(ds);
      if(i>=0) o.history.splice(i,1); else o.history.push(ds); renderSheet(); render(); return; }

    const ut=t.closest('[data-untag]');
    if(ut){ const o=byId(S.openId); o.tags=o.tags.filter(x=>x!==ut.dataset.untag); renderSheet(); render(); return; }

    const sh=t.closest('[data-sheet]');
    if(sh){ const v=sh.dataset.sheet;
      if(v==='close') closeSheet();
      else if(v==='del') del(S.openId);
      else if(v==='done'){ toggleDone(S.openId); renderSheet(); }
      else { S.editing = v==='write'; renderSheet(); }
      return; }

    const a=t.closest('[data-act]'); if(a){ act(a.dataset.act,a); return; }

    const vw=t.closest('[data-view]');
    if(vw){ S.view=vw.dataset.view; S.drawerId=null; S.kindFilter=null; S.arrange=false; render(); return; }

    const dr=t.closest('[data-drawer]');
    if(dr && (dr.classList.contains('navitem') || (dr.classList.contains('drawer') && !S.arrange))){
      S.view='drawer'; S.drawerId=dr.dataset.drawer; S.kindFilter=null; S.reorder=false; render(); return; }

    // cards, goal titles, timeline entries — anything carrying an id that isn't a swipeable row
    const ro=t.closest('[data-row]');
    if(ro && !ro.classList.contains('row')){ openObj(ro.dataset.row); return; }

    const kf=t.closest('[data-kind]');
    if(kf && kf.classList.contains('fchip')){ S.kindFilter=kf.dataset.kind||null; render(); return; }
    const kk=t.closest('[data-kk]');
    if(kk){ const m=$('#modal'), k=kk.dataset.kk, i=m._draft.kinds.indexOf(k);
      if(i>=0) m._draft.kinds.splice(i,1); else m._draft.kinds.push(k);
      kk.classList.toggle('on'); return; }
    const pv=t.closest('[data-pv]');
    if(pv){ $('#modal')._draft.pv=pv.dataset.pv; $$('#dpv .fchip').forEach(b=>b.classList.remove('on')); pv.classList.add('on'); return; }
    const col=t.closest('[data-col]');
    if(col){ $('#modal')._draft.c=col.dataset.col; $$('#dcol button').forEach(b=>b.classList.remove('on')); col.classList.add('on'); return; }

    const lk=t.closest('[data-look]');
    if(lk){ const k=lk.dataset.look, v=lk.dataset.val;
      S.look[k] = k==='railHidden' ? !!v : (v||null);
      applyLook(); save(); render(); return; }

    const tg=t.closest('[data-tag]');
    if(tg){ const v=tg.dataset.tag; S.tagFilter = (!v||S.tagFilter===v)?null:v; if(S.tagFilter) S.view='all'; render(); return; }

    const day=t.closest('[data-day]'); if(day){ S.selDate=day.dataset.day; render(); return; }

    const th=t.closest('[data-theme2]'); if(th){ S.theme=th.dataset.theme2; render(); return; }
    const ly=t.closest('[data-layout]');
    if(ly){ S.layoutEdit = ly.dataset.layout || null; S.view='desk'; S.arrange=!!S.layoutEdit; render(); return; }

    // the size chip still cycles presets — quicker than dragging on a phone.
    // It keeps the drawer where it is and skips any preset that would collide.
    const sz=t.closest('[data-size]');
    if(sz){ const d=drawerById(sz.dataset.size), g=gridOf(), cur=lay(d);
      const P = dev()==='desk' ? [[2,1],[2,2],[3,2],[4,2],[6,2]] : [[2,1],[2,2],[4,1],[4,2]];
      const i=P.findIndex(p=>p[0]===cur.w&&p[1]===cur.h);
      for(let n=1;n<=P.length;n++){
        const [w,h]=P[(i+n)%P.length];
        const box={x:Math.min(cur.x, g.cols-w+1), y:cur.y, w, h};
        if(boxOk(box,d.id)){ d[dev()]=box; save(); render(); return; }
      }
      toast('No room to resize — move it first'); return; }
    const dd=t.closest('[data-delDrawer]');
    if(dd){ S.drawers=S.drawers.filter(x=>x.id!==dd.dataset.deldrawer); render(); return; }

    const cr=t.closest('[data-cmd]'); if(cr){ runCmd(+cr.dataset.cmd); return; }

    if(t.id==='scrim') hideModal();
    if(t.id==='cmdscrim') closeCmd();
  });

  // inline field edits
  frame.addEventListener('input', e=>{
    // colour pickers: live preview while dragging, committed on 'change'
    const li=e.target.dataset.lookinput;
    if(li){ S.look[li]=e.target.value; applyLook(); return; }
    if(e.target.dataset.colinput!=null){
      const m=$('#modal'); if(m&&m._draft){ m._draft.c=e.target.value;
        $$('#dcol button').forEach(b=>b.classList.remove('on')); }
      return;
    }
    const f=e.target.dataset.f;
    if(f){
      const o=byId(S.openId); if(!o) return;
      if(f==='title'){ o.title=e.target.value; e.target.style.height='auto'; e.target.style.height=e.target.scrollHeight+'px'; }
      else if(f==='body') o.body=e.target.value;
      else if(f==='due') o.due=e.target.value||null;
      else if(f==='repeat') o.repeat=e.target.value||null;
      else if(f==='drawer') o.drawer=e.target.value;
      else if(f==='mtype'){ o.media=o.media||{label:'untitled'}; o.media.type=e.target.value; renderSheet(); }
      else if(f==='kind'){ o.kind=e.target.value; if(K(o.kind).goal&&!o.milestones.length) o.milestones=[{t:'First milestone',done:false,d:dz(30)}]; renderSheet(); }
      return;
    }
    if(e.target.dataset.mtext!=null){ byId(S.openId).milestones[+e.target.dataset.mtext].t=e.target.value; return; }
    if(e.target.dataset.mdate!=null){ byId(S.openId).milestones[+e.target.dataset.mdate].d=e.target.value; return; }
    if(e.target.id==='cmdinput'){ cmdList(e.target.value); return; }
  });

  frame.addEventListener('change', e=>{
    if(e.target.id==='importer' && e.target.files && e.target.files[0]){
      importBackup(e.target.files[0]); e.target.value='';
    }
    // re-render only once the picker closes, so it doesn't die mid-drag
    if(e.target.dataset.lookinput){ save(); render(); }
  });

  frame.addEventListener('keydown', e=>{
    if(e.target.id==='qa' && e.key==='Enter'){
      const o=quickAdd(e.target.value, e.target.dataset.kind, e.target.dataset.drawer);
      e.target.value=''; if(o){ render(); setTimeout(()=>{const q=$('#qa'); q&&q.focus();},0); toast('Added'); }
      return;
    }
    if(e.target.id==='cmdinput'){
      if(e.key==='Enter'){ runCmd(0); }
      if(e.key==='Escape'){ closeCmd(); }
    }
  });

  document.addEventListener('keydown', e=>{
    const typing = /input|textarea/i.test(document.activeElement.tagName);
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCmd(); return; }
    if(e.key==='Escape'){ closeCtx(); hideModal(); closeCmd(); if(S.openId) closeSheet(); return; }
    if(typing) return;
    if(e.key==='n'||e.key==='N'){ e.preventDefault(); modalNewObject(); return; }
    if($('#scrim').classList.contains('open')){
      const k=KEYS.find(x=>KINDS[x].key.toLowerCase()===e.key.toLowerCase());
      if(k){ hideModal(); const o=create(k); render(); openObj(o.id); S.editing=true; renderSheet(); }
    }
  });

  // the device decides which layout you see; the OS decides the default theme
  const wide = window.matchMedia('(min-width: 900px)');
  const addML = (mq, fn)=> mq.addEventListener ? mq.addEventListener('change', fn) : mq.addListener(fn);
  addML(wide, ()=>{ S.device = sensedDevice(); render(); });
  addML(window.matchMedia('(prefers-color-scheme: dark)'), ()=>{ if(S.theme==='auto') render(); });

  window.addEventListener('resize', sizeGrid);
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall=e; if(S.view==='settings') render(); });
  window.addEventListener('beforeunload', writeNow);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) writeNow(); });
}

/* ============================================================
   21 · boot
   ============================================================ */
const restored = load();
const hash = (location.hash||'').replace('#','');
if(['today','keep','all','desk','settings'].includes(hash)) S.view = hash;
$('#frame').insertAdjacentHTML('beforeend', overlayHTML());
wire();
applyLook();
render();
if(!restored) writeNow();

// keep a save after every re-render, cheaply
const _render = render;
render = function(){ _render(); save(); };
save();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* file:// or unsupported */ });
  });
}

window.BUREAU = {get state(){return S}, render:()=>render(), create, save:writeNow, K:KINDS};
})();
